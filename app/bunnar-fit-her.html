<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BUNNAR FIT">
<meta name="theme-color" content="#FAFAF7">
<title>BUNNAR FIT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-2: #F4F2ED;
  --text: #1A1A1A;
  --text-2: #6B6B6B;
  --text-3: #9A9A9A;
  --border: #E8E6E1;
  --border-2: #D5D3CE;
  --accent: #BA0C2F;
  --accent-soft: rgba(186, 12, 47, 0.07);
  --done: #5C7355;
  --done-soft: rgba(92, 115, 85, 0.08);
  --shadow: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-2: 0 4px 16px rgba(0,0,0,0.06);
  --mono: 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ============ HEADER ============ */
.header {
  padding: 28px 24px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 1px solid var(--border);
}
.brand {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--text-3);
  font-weight: 600;
}
.date-line {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.streak-box {
  text-align: right;
}
.streak-num {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.streak-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-3);
  text-transform: uppercase;
  margin-top: 4px;
  font-weight: 600;
}

/* ============ SECTION ============ */
.section {
  padding: 28px 24px 8px;
}
.section-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 12px;
}
.section-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.section-sub {
  font-size: 14px;
  color: var(--text-2);
  margin-top: 8px;
}

/* ============ MISSION CARD ============ */
.mission {
  margin: 16px 24px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
}
.mission-label {
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.mission-text {
  color: var(--text);
  font-weight: 500;
}

/* ============ EXERCISE CARD ============ */
.exercises {
  padding: 8px 16px;
}
.exercise {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  overflow: hidden;
  transition: all 0.2s ease;
}
.exercise.done {
  background: var(--done-soft);
  border-color: rgba(92, 115, 85, 0.2);
}
.exercise-head {
  padding: 16px 18px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.exercise-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  background: var(--surface-2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}
.exercise-icon svg {
  width: 38px;
  height: 38px;
}
.exercise.done .exercise-icon {
  background: var(--done-soft);
  color: var(--done);
}
.exercise-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
  min-width: 18px;
}
.exercise-info {
  flex: 1;
}
.exercise-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.exercise-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.exercise.done .exercise-name { color: var(--done); }
.guide-btn {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  font-style: italic;
  font-family: Georgia, serif;
}
.exercise.expanded .exercise-head {
  border-bottom: 1px solid var(--border);
}

/* ============ SETS ============ */
.sets {
  padding: 12px 18px 16px;
}
.set-row {
  display: grid;
  grid-template-columns: 32px 1fr 1fr 36px;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
}
.set-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
}
.set-input {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 9px 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  width: 100%;
  text-align: center;
  border-radius: 2px;
  color: var(--text);
  transition: border-color 0.15s;
}
.set-input:focus {
  outline: none;
  border-color: var(--text);
}
.set-input::placeholder {
  color: var(--text-3);
  font-size: 11px;
}
.set-check {
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--border-2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.set-check.done {
  background: var(--done);
  border-color: var(--done);
}
.set-check.done::after {
  content: '';
  width: 10px;
  height: 6px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px, -1px);
}
.set-rest-btn {
  margin-top: 8px;
  width: 100%;
  padding: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
}

/* ============ INLINE FORM TIPS ============ */
.form-tips {
  padding: 12px 18px 16px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
}
.form-tips-label {
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
}
.form-tips-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.form-tips-list li {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
  padding: 3px 0 3px 14px;
  position: relative;
}
.form-tips-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 11px;
  width: 6px;
  height: 1px;
  background: var(--text-3);
}
.form-tips-warn {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
  font-size: 11px;
  color: var(--text);
  line-height: 1.45;
}
.form-tips-warn b { color: var(--accent); font-weight: 700; }

/* ============ CARDIO TYPE ============ */
.exercise.cardio .exercise-head {
  background: var(--surface-2);
}
.cardio-toggle {
  width: 100%;
  padding: 14px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
}
.exercise.done .cardio-toggle {
  color: var(--done);
}

/* ============ REST DAY / OFF DAY ============ */
.rest-day {
  text-align: center;
  padding: 60px 24px;
}
.rest-day-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}
.rest-day-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.rest-day-sub {
  font-size: 14px;
  color: var(--text-2);
  margin-top: 8px;
  line-height: 1.6;
}

/* ============ BIKE ============ */
.bike-card {
  margin: 8px 24px 0;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s;
}
.bike-card.done {
  background: var(--done-soft);
  border-color: rgba(92, 115, 85, 0.2);
}
.bike-icon {
  font-size: 22px;
}
.bike-info {
  flex: 1;
}
.bike-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-3);
  font-weight: 600;
  text-transform: uppercase;
}
.bike-text {
  font-size: 14px;
  font-weight: 600;
  margin-top: 2px;
}
.bike-card.done .bike-text { color: var(--done); }
.bike-toggle {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--border-2);
  border-radius: 50%;
}
.bike-card.done .bike-toggle {
  background: var(--done);
  border-color: var(--done);
  position: relative;
}
.bike-card.done .bike-toggle::after {
  content: '';
  position: absolute;
  left: 7px;
  top: 9px;
  width: 10px;
  height: 6px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg);
}

/* ============ WEIGHT TRACK ============ */
.weight-section {
  margin: 24px 24px 0;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.weight-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.weight-current {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.weight-num {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.weight-unit {
  font-size: 14px;
  color: var(--text-2);
  font-weight: 500;
}
.weight-goal {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.05em;
}
.weight-input-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.weight-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  border-radius: 2px;
}
.weight-input:focus {
  outline: none;
  border-color: var(--text);
}
.weight-save {
  padding: 10px 18px;
  background: var(--text);
  color: white;
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 600;
  text-transform: uppercase;
}
.weight-chart {
  margin-top: 16px;
  height: 50px;
  display: flex;
  align-items: flex-end;
  gap: 4px;
}
.weight-bar {
  flex: 1;
  background: var(--surface-2);
  border-radius: 1px;
  min-height: 4px;
  position: relative;
  transition: height 0.3s ease;
}
.weight-bar.has-data { background: var(--text); }
.weight-bar-label {
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ============ WEEK PROGRESS ============ */
.week-section {
  margin: 36px 24px 0;
}
.week-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.week-title {
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
}
.week-stats {
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.week-stats b {
  color: var(--text);
  font-weight: 800;
}
.week-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.day-cell {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  position: relative;
}
.day-cell-label {
  font-size: 9px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.05em;
}
.day-cell-num {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.day-cell.today {
  border-color: var(--accent);
  border-width: 1.5px;
}
.day-cell.today .day-cell-num { color: var(--accent); }
.day-cell.done {
  background: var(--done);
  border-color: var(--done);
}
.day-cell.done .day-cell-label,
.day-cell.done .day-cell-num { color: white; }
.day-cell.partial {
  background: var(--done-soft);
  border-color: rgba(92, 115, 85, 0.3);
}

/* ============ STAGE / 4-WEEK INFO ============ */
.stage-info {
  margin: 36px 24px 0;
  padding: 14px 18px;
  background: var(--surface-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
.stage-info-key {
  color: var(--text-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  font-size: 10px;
}
.stage-info-val {
  font-weight: 700;
  letter-spacing: -0.01em;
}

/* ============ DAY SWITCHER ============ */
.day-switch {
  display: flex;
  gap: 6px;
  padding: 14px 24px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.day-switch::-webkit-scrollbar { display: none; }
.day-pill {
  flex-shrink: 0;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-2);
  border-radius: 20px;
  white-space: nowrap;
  transition: all 0.15s;
}
.day-pill.active {
  background: var(--text);
  color: white;
  border-color: var(--text);
}
.day-pill .pill-day {
  font-weight: 800;
  margin-right: 4px;
}

/* ============ PREVIEW BANNER ============ */
.preview-banner {
  margin: 14px 24px 0;
  padding: 10px 14px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
  font-size: 11px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.preview-banner-text {
  font-weight: 600;
}
.preview-banner-text b {
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.1em;
}
.preview-back {
  font-size: 10px;
  letter-spacing: 0.1em;
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  text-decoration: underline;
}

/* In preview mode, dim interactive controls */
.exercises.preview .set-input,
.exercises.preview .set-check,
.exercises.preview .set-rest-btn,
.exercises.preview .cardio-toggle {
  opacity: 0.45;
  pointer-events: none;
}

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.4);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg);
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  padding: 24px 24px 32px;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-grip {
  width: 36px;
  height: 4px;
  background: var(--border-2);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.modal-sub {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 4px;
}
.modal-section {
  margin-top: 20px;
}
.modal-section-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 8px;
}
.modal-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
}
.form-list {
  list-style: none;
  padding: 0;
}
.form-list li {
  padding: 8px 0 8px 18px;
  position: relative;
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
  border-bottom: 1px solid var(--border);
}
.form-list li:last-child { border-bottom: none; }
.form-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 16px;
  width: 8px;
  height: 1px;
  background: var(--text-2);
}
.warn-box {
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
}
.warn-box b { color: var(--accent); }

/* ============ REST TIMER ============ */
.timer-overlay {
  position: fixed;
  inset: 0;
  background: var(--text);
  color: white;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.timer-overlay.show { display: flex; }
.timer-label {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 24px;
}
.timer-ring {
  width: 220px;
  height: 220px;
  position: relative;
}
.timer-ring svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}
.timer-ring-bg { stroke: rgba(255,255,255,0.1); fill: none; }
.timer-ring-fg {
  stroke: var(--accent);
  fill: none;
  transition: stroke-dashoffset 1s linear;
  stroke-linecap: round;
}
.timer-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  font-weight: 800;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.timer-skip {
  margin-top: 40px;
  padding: 12px 28px;
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: white;
  font-weight: 600;
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: white;
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 300;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

/* ============ COMPLETION CELEBRATION ============ */
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.celebrating { animation: pulse 0.4s ease; }
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="brand">BUNNAR · FIT · HER</div>
    <div class="date-line" id="dateLine">—</div>
  </div>
  <div class="streak-box">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-label">연속</div>
  </div>
</header>

<nav class="day-switch" id="daySwitch"></nav>

<div id="previewBannerSlot"></div>

<section class="section">
  <div class="section-label" id="dayCode">—</div>
  <h1 class="section-title" id="dayTitle">—</h1>
  <p class="section-sub" id="daySub">—</p>

  '운동 중 통증 0-3/10 범위 유지',
  '운동 후 따뜻한 물로 손 씻기',
  '오메가-3 챙기기 (등푸른생선, 견과류)',
  '잠 7-8시간 (염증 관리 핵심)',
  '오늘 충분히 먹기 (마른 체형 유지)',
  '운동 전 가벼운 손 스트레칭 1분',
  '컨디션 체크: 통증 있으면 무리 X',
  '운동 후 단백질 30g (계란 3개 또는 두부 1/2모)',
  '몸이 보내는 신호 듣기',
  '스트라이다 라이딩 즐기기',
  '엄지 손가락 부담 동작 피하기',
  '천천히, 즐기면서',
  '비타민 D 충분히 (관절 건강)'
];

const REST_DAY_MESSAGES = {
  tuesday: { icon: '🚴', title: '자유 또는 스트라이다', sub: '스트라이다 라이딩 즐기기 (선택). 컨디션 따라 가벼운 산책도 OK.' },
  thursday: { icon: '🚴', title: '자유 또는 스트라이다', sub: '스트라이다 라이딩 즐기기 (선택). 컨디션 따라 가벼운 산책도 OK.' },
  saturday: { icon: '🌿', title: '자유', sub: '컨디션 좋으면 가벼운 활동. 무리 NO.' },
  sunday: { icon: '⚪', title: '완전 휴식', sub: '오늘은 완전히 쉬세요. 관절 회복 시간.' }
};

const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
const DAY_KEYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

// =============================================================
// STATE
// =============================================================
let state = {
  startDate: null,
  workouts: {}, // date -> {type, exercises: {id: {sets: [{weight, reps, done}]}}, completed}
  weights: {},  // date -> kg
  bike: {},     // date -> bool
  missions: {}, // date -> index
  goalWeight: 50,
  initialWeight: 47.5
};
let expandedExercise = null; // preserve expanded state across re-renders
let viewMode = null; // null = today, or 'monday'/'wednesday'/'friday' for preview

function loadState() {
  const saved = localStorage.getItem('bunnar-fit-her');
  if (saved) state = { ...state, ...JSON.parse(saved) };
  if (!state.startDate) state.startDate = todayKey();
  saveState();
}
function saveState() { localStorage.setItem('bunnar-fit-her', JSON.stringify(state)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDay() { return new Date().getDay(); }
function getDayKey() { return DAY_KEYS[getDay()]; }

// =============================================================
// RENDER
// =============================================================
function render() {
  renderHeader();
  renderDaySwitch();
  renderPreviewBanner();
  renderMission();
  renderContent();
  renderWeekProgress();
  renderStageInfo();
}

function renderDaySwitch() {
  const todayDk = getDayKey();
  const isWorkoutDay = ROUTINES[todayDk] !== undefined;
  const activeMode = viewMode || (isWorkoutDay ? todayDk : 'today');
  const pills = [];
  pills.push({ key: 'today', label: '오늘', sub: '' });
  pills.push({ key: 'monday', label: '월', sub: 'A' });
  pills.push({ key: 'wednesday', label: '수', sub: 'B' });
  pills.push({ key: 'friday', label: '금', sub: 'C' });
  document.getElementById('daySwitch').innerHTML = pills.map(p => {
    const isActive = (p.key === 'today' && viewMode === null) ||
                     (p.key !== 'today' && viewMode === p.key);
    return `<button class="day-pill ${isActive?'active':''}" onclick="setViewMode('${p.key === 'today' ? 'null' : p.key}')">
      <span class="pill-day">${p.label}</span>${p.sub}
    </button>`;
  }).join('');
}

function renderPreviewBanner() {
  const slot = document.getElementById('previewBannerSlot');
  if (viewMode && viewMode !== getDayKey()) {
    const label = { monday: '월요일 · A', wednesday: '수요일 · B', friday: '금요일 · C' }[viewMode];
    slot.innerHTML = `<div class="preview-banner">
      <span class="preview-banner-text"><b>미리보기</b> · ${label} (기록 안 됨)</span>
      <button class="preview-back" onclick="setViewMode('null')">오늘로 →</button>
    </div>`;
  } else {
    slot.innerHTML = '';
  }
}

function setViewMode(mode) {
  viewMode = mode === 'null' ? null : mode;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function renderHeader() {
  const d = new Date();
  const wd = DAY_NAMES[d.getDay()];
  document.getElementById('dateLine').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} · ${wd}요일`;
  document.getElementById('streakNum').textContent = calculateStreak();
}

function calculateStreak() {
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 60; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dk = DAY_KEYS[d.getDay()];
    const isStrengthDay = ['monday','wednesday','friday'].includes(dk);
    const isBikeDay = ['tuesday','thursday'].includes(dk);

    if (i === 0) {
      // Today: count if done, but don't break streak if not done yet
      if (isStrengthDay && state.workouts[key]?.completed) streak++;
      else if (isBikeDay && state.bike[key]) streak++;
      continue;
    }
    if (isStrengthDay) {
      if (state.workouts[key]?.completed) streak++;
      else break; // missed required strength day = streak broken
    } else if (isBikeDay) {
      if (state.bike[key]) streak++;
      // bike is optional, don't break streak if missed
    }
    // rest days (sat/sun): neutral, no effect
  }
  return streak;
}

function renderMission() {
  const tk = todayKey();
  if (state.missions[tk] === undefined) {
    state.missions[tk] = Math.floor(Math.random() * MISSIONS.length);
    saveState();
  }
  document.getElementById('missionText').textContent = MISSIONS[state.missions[tk]];
}

function renderContent() {
  const dk = viewMode || getDayKey();
  const routine = ROUTINES[dk];
  const content = document.getElementById('content');
  const isPreview = viewMode !== null && viewMode !== getDayKey();

  if (routine) {
    document.getElementById('dayCode').textContent = routine.code;
    document.getElementById('dayTitle').textContent = routine.title;
    document.getElementById('daySub').textContent = routine.sub;
    content.innerHTML = renderRoutine(routine, isPreview);
  } else {
    const restMsg = REST_DAY_MESSAGES[dk];
    document.getElementById('dayCode').textContent = '';
    document.getElementById('dayTitle').textContent = restMsg.title;
    document.getElementById('daySub').textContent = '';

    let html = `<div class="rest-day">
      <div class="rest-day-icon">${restMsg.icon}</div>
      <div class="rest-day-title">${restMsg.title}</div>
      <div class="rest-day-sub">${restMsg.sub.replace('\n','<br>')}</div>
    </div>`;

    if (dk === 'tuesday' || dk === 'thursday') {
      const tk = todayKey();
      const done = state.bike[tk];
      html += `
        <div class="bike-card ${done?'done':''}" onclick="toggleBike()">
          <div class="bike-icon">🚴</div>
          <div class="bike-info">
            <div class="bike-label">스트라이다 라이딩</div>
            <div class="bike-text">${done?'오늘 스트라이다 라이딩 완료':'스트라이다 라이딩 했나요?'}</div>
          </div>
          <div class="bike-toggle"></div>
        </div>`;
    }

    html += renderWeightSection();
    content.innerHTML = html;
  }
}

function renderRoutine(routine, isPreview = false) {
  const tk = todayKey();
  // In preview mode, use empty exercise state (no save)
  let workoutState;
  if (isPreview) {
    workoutState = { exercises: {} };
    routine.exercises.forEach(ex => {
      if (ex.type === 'strength' && typeof ex.sets === 'number') {
        workoutState.exercises[ex.id] = {
          sets: Array(ex.sets).fill(null).map(()=>({weight:'', reps:'', done:false}))
        };
      } else {
        workoutState.exercises[ex.id] = { done: false };
      }
    });
  } else {
    if (!state.workouts[tk]) {
      state.workouts[tk] = { type: routine.code, exercises: {}, completed: false };
      routine.exercises.forEach(ex => {
        if (ex.type === 'strength' && typeof ex.sets === 'number') {
          state.workouts[tk].exercises[ex.id] = {
            sets: Array(ex.sets).fill(null).map(()=>({weight:'', reps:'', done:false}))
          };
        } else {
          state.workouts[tk].exercises[ex.id] = { done: false };
        }
      });
      saveState();
    }
    workoutState = state.workouts[tk];
  }

  let html = `<div class="exercises ${isPreview?'preview':''}">`;
  routine.exercises.forEach((ex, idx) => {
    const exState = workoutState.exercises[ex.id] || {};
    const isStrength = ex.type === 'strength' && typeof ex.sets === 'number';
    let isDone = false;
    if (isStrength) isDone = exState.sets?.every(s => s.done);
    else isDone = exState.done;

    html += `<div class="exercise ${ex.type==='cardio'?'cardio':''} ${isDone?'done':''}" id="ex-${ex.id}">
      <div class="exercise-head">
        <div class="exercise-icon">${SVG_ICONS[ex.id] || ''}</div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-meta">${ex.meta}</div>
        </div>
        <button class="guide-btn" onclick="showGuide('${ex.id}')">i</button>
      </div>`;

    if (isStrength) {
      html += '<div class="sets">';
      exState.sets.forEach((s, si) => {
        html += `<div class="set-row">
          <div class="set-label">SET ${si+1}</div>
          <input class="set-input" type="number" placeholder="kg" value="${s.weight||''}"
                 onchange="updateSet('${ex.id}', ${si}, 'weight', this.value)" inputmode="decimal">
          <input class="set-input" type="number" placeholder="회" value="${s.reps||''}"
                 onchange="updateSet('${ex.id}', ${si}, 'reps', this.value)" inputmode="numeric">
          <div class="set-check ${s.done?'done':''}" onclick="toggleSet('${ex.id}', ${si}, ${ex.rest||60})"></div>
        </div>`;
      });
      html += `<button class="set-rest-btn" onclick="startTimer(${ex.rest||60})">휴식 타이머 · ${ex.rest||60}초</button></div>`;
    } else {
      html += `<button class="cardio-toggle" onclick="toggleCardio('${ex.id}')">
        ${isDone?'✓ 완료':'완료 체크'}
      </button>`;
    }

    // Inline form tips (top 3 points + warning if any)
    if (ex.guide && ex.guide.form) {
      const topTips = ex.guide.form.slice(0, 3);
      html += `<div class="form-tips">
        <div class="form-tips-label">자세 포인트</div>
        <ul class="form-tips-list">${topTips.map(t=>`<li>${t}</li>`).join('')}</ul>`;
      if (ex.guide.warn) {
        html += `<div class="form-tips-warn"><b>주의 ·</b> ${ex.guide.warn}</div>`;
      }
      html += `</div>`;
    }

    html += '</div>';
  });
  html += '</div>';

  html += renderWeightSection();
  return html;
}

function renderWeightSection() {
  const tk = todayKey();
  const current = state.weights[tk] || getLatestWeight() || state.initialWeight;
  let html = `<div class="weight-section">
    <div class="weight-head">
      <div class="weight-current">
        <span class="weight-num" id="weightDisplay">${current}</span>
        <span class="weight-unit">kg</span>
      </div>
      <div class="weight-goal">목표 ${state.goalWeight}kg</div>
    </div>
    <div class="weight-input-row">
      <input class="weight-input" type="number" id="weightInput" step="0.1"
             placeholder="오늘 체중 (예: 78.5)" inputmode="decimal">
      <button class="weight-save" onclick="saveWeight()">기록</button>
    </div>
    <div class="weight-chart" id="weightChart"></div>
  </div>`;
  setTimeout(renderWeightChart, 0);
  return html;
}

function getLatestWeight() {
  const dates = Object.keys(state.weights).sort();
  return dates.length ? state.weights[dates[dates.length-1]] : null;
}

function renderWeightChart() {
  const chart = document.getElementById('weightChart');
  if (!chart) return;
  const today = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({ key, val: state.weights[key], day: d.getDate() });
  }
  const vals = days.filter(d => d.val).map(d => d.val);
  if (vals.length === 0) {
    chart.innerHTML = days.map(d=>`<div class="weight-bar" style="height:4px"></div>`).join('');
    return;
  }
  const min = Math.min(...vals) - 0.5;
  const max = Math.max(...vals) + 0.5;
  const range = max - min || 1;
  chart.innerHTML = days.map(d => {
    if (!d.val) return `<div class="weight-bar" style="height:4px"></div>`;
    const h = ((d.val - min) / range) * 40 + 8;
    return `<div class="weight-bar has-data" style="height:${h}px"></div>`;
  }).join('');
}

function renderWeekProgress() {
  const today = new Date();
  const dow = today.getDay();
  // Monday-start week
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  let weekStr = '';
  let done = 0, bikeDone = 0;
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + mondayOffset + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dk = DAY_KEYS[d.getDay()];
    const isStrength = ['monday','wednesday','friday'].includes(dk);
    const isBike = ['tuesday','thursday'].includes(dk);
    const isToday = key === todayKey();
    let cls = 'day-cell';
    if (isToday) cls += ' today';
    if (isStrength && state.workouts[key]?.completed) { cls += ' done'; done++; }
    else if (isBike && state.bike[key]) { cls += ' done'; bikeDone++; }
    cells.push(`<div class="${cls}">
      <div class="day-cell-label">${['월','화','수','목','금','토','일'][i]}</div>
      <div class="day-cell-num">${d.getDate()}</div>
    </div>`);
  }
  document.getElementById('weekDays').innerHTML = cells.join('');
  document.getElementById('weekDone').textContent = done;
  document.getElementById('weekBike').textContent = bikeDone;
}

function renderStageInfo() {
  const start = new Date(state.startDate);
  const today = new Date();
  const daysSince = Math.floor((today - start) / (1000*60*60*24));
  const week = Math.min(Math.floor(daysSince / 7) + 1, 4);
  document.getElementById('weekNum').textContent = `${week} / 4`;
  document.getElementById('totalDays').textContent =
    `${Object.values(state.workouts).filter(w=>w.completed).length}일`;
  const s = new Date(state.startDate);
  document.getElementById('startDate').textContent =
    `${String(s.getMonth()+1).padStart(2,'0')}.${String(s.getDate()).padStart(2,'0')}`;
}

// =============================================================
// ACTIONS
// =============================================================
function toggleExpand(id) {
  expandedExercise = (expandedExercise === id) ? null : id;
  render();
}

function updateSet(exId, setIdx, field, val) {
  const tk = todayKey();
  state.workouts[tk].exercises[exId].sets[setIdx][field] = val;
  saveState();
}

function toggleSet(exId, setIdx, restSec) {
  const tk = todayKey();
  const set = state.workouts[tk].exercises[exId].sets[setIdx];
  set.done = !set.done;
  saveState();
  if (set.done) {
    startTimer(restSec);
    if (navigator.vibrate) navigator.vibrate(20);
  }
  // check if exercise complete
  const allDone = state.workouts[tk].exercises[exId].sets.every(s => s.done);
  if (allDone) checkWorkoutComplete();
  render();
}

function toggleCardio(exId) {
  const tk = todayKey();
  state.workouts[tk].exercises[exId].done = !state.workouts[tk].exercises[exId].done;
  saveState();
  checkWorkoutComplete();
  render();
}

function checkWorkoutComplete() {
  const tk = todayKey();
  const dk = getDayKey();
  const routine = ROUTINES[dk];
  if (!routine) return;
  const w = state.workouts[tk];
  const allDone = routine.exercises.every(ex => {
    const s = w.exercises[ex.id];
    if (ex.type === 'strength' && typeof ex.sets === 'number') return s.sets.every(set => set.done);
    return s.done;
  });
  if (allDone && !w.completed) {
    w.completed = true;
    saveState();
    showToast('🎉 오늘 운동 완료!');
    if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);
  } else if (!allDone && w.completed) {
    w.completed = false;
    saveState();
  }
}

function toggleBike() {
  const tk = todayKey();
  state.bike[tk] = !state.bike[tk];
  saveState();
  if (state.bike[tk]) {
    showToast('🚴 스트라이다 라이딩 기록 완료');
    if (navigator.vibrate) navigator.vibrate(30);
  }
  render();
}

function saveWeight() {
  const input = document.getElementById('weightInput');
  const val = parseFloat(input.value);
  if (!val || val < 30 || val > 200) {
    showToast('체중을 정확히 입력해주세요');
    return;
  }
  state.weights[todayKey()] = val;
  saveState();
  input.value = '';
  showToast('체중 기록 완료');
  render();
}

// =============================================================
// GUIDE MODAL
// =============================================================
function showGuide(exId) {
  let ex = null;
  Object.values(ROUTINES).forEach(r => {
    r.exercises.forEach(e => { if (e.id === exId) ex = e; });
  });
  if (!ex || !ex.guide) return;
  const g = ex.guide;
  let html = `<div class="modal-title">${ex.name}</div>`;
  if (ex.meta) html += `<div class="modal-sub">${ex.meta}</div>`;
  html += `<div class="modal-section">
    <div class="modal-section-label">개요</div>
    <div class="modal-text">${g.summary || ''}</div>
  </div>`;
  if (g.equipment) {
    html += `<div class="modal-section">
      <div class="modal-section-label">장비</div>
      <div class="modal-text">${g.equipment}</div>
    </div>`;
  }
  if (g.form) {
    html += `<div class="modal-section">
      <div class="modal-section-label">자세 포인트</div>
      <ul class="form-list">${g.form.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>`;
  }
  if (g.warn) {
    html += `<div class="warn-box"><b>주의 ·</b> ${g.warn}</div>`;
  }
  html += `<div style="margin-top:24px"><button class="weight-save" style="width:100%;padding:14px"
    onclick="closeGuide()">닫기</button></div>`;
  document.getElementById('guideContent').innerHTML = html;
  document.getElementById('guideModal').classList.add('show');
}
function closeGuide() { document.getElementById('guideModal').classList.remove('show'); }

// =============================================================
// REST TIMER
// =============================================================
let timerInterval = null;
let timerRemaining = 0;
let timerTotal = 0;
function startTimer(sec) {
  timerTotal = sec;
  timerRemaining = sec;
  document.getElementById('timerOverlay').classList.add('show');
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    if (timerRemaining <= 0) {
      finishTimer();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}
function updateTimerDisplay() {
  document.getElementById('timerNum').textContent = timerRemaining;
  const circumference = 2 * Math.PI * 100;
  const offset = circumference * (1 - timerRemaining / timerTotal);
  document.getElementById('timerRingFg').style.strokeDashoffset = offset;
}
function finishTimer() {
  clearInterval(timerInterval);
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  playBeep();
  setTimeout(() => {
    document.getElementById('timerOverlay').classList.remove('show');
  }, 500);
}
function skipTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerOverlay').classList.remove('show');
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 600;
    g.gain.value = 0.1;
    o.start();
    setTimeout(()=>{o.stop();ctx.close();}, 200);
  } catch(e) {}
}

// =============================================================
// TOAST
// =============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// =============================================================
// INIT
// =============================================================
loadState();
render();

// Re-render on visibility (day might have changed)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
});
</script>
