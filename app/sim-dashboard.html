<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMBANLE 업무 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e2e0d8;
  --border2:#ccc9bc;
  --text:#1a1a18;
  --text2:#6b6960;
  --text3:#a09d92;
  --green:#1D9E75;
  --blue:#185FA5;
  --amber:#854F0B;
  --red:#993556;
  --radius:12px;
  --radius-sm:8px;
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Pretendard,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:18px 32px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.logo{font-size:20px;font-weight:700;letter-spacing:.02em}
.logo span{margin-left:8px;color:var(--text2);font-size:13px;font-weight:400}
.header-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center}
.main{max-width:1280px;margin:0 auto;padding:26px 24px 60px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;line-height:1.1}
.stat-label{margin-top:4px;color:var(--text2);font-size:13px;font-weight:600}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.filter-title{display:block;margin-bottom:8px;font-weight:700}
.filter-row{display:flex;flex-wrap:wrap;gap:7px}
.fbtn{
  min-height:40px;
  border:1px solid var(--border2);
  border-radius:999px;
  padding:7px 16px;
  background:var(--surface);
  color:var(--text2);
  font-size:15px;
  font-weight:700;
}
.fbtn:hover,.fbtn.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.hint{margin-top:8px;color:var(--text3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{
  display:flex;
  min-height:230px;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(180deg,var(--cat-soft),var(--surface) 165px);
  border:2px solid var(--cat-border);
  border-radius:var(--radius);
  box-shadow:0 8px 22px rgba(39,34,22,.06);
}
.card.today{grid-column:1/-1}
.card.drag-over{outline:3px solid rgba(24,95,165,.22);outline-offset:2px}
.card-head{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;
  gap:10px;
  align-items:center;
  padding:15px 16px 13px;
  background:var(--cat-wash);
  border-bottom:1px solid var(--cat-border);
}
.card-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border-radius:999px;
  background:var(--cat-color);
  color:#fff;
  font-size:16px;
  font-weight:800;
}
.card-label{
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:19px;
  font-weight:700;
}
.card-meta{color:var(--text3);font-size:13px;font-weight:600;white-space:nowrap}
.del-cat{
  border:0;
  background:transparent;
  color:var(--text3);
  font-size:18px;
  line-height:1;
}
.del-cat:hover{color:var(--red)}
.pbar{height:4px;background:var(--cat-soft)}
.pfill{height:100%;transition:width .25s ease}
.items{display:flex;flex:1;flex-direction:column;gap:8px;padding:12px;min-height:130px}
.empty{padding:16px;color:var(--text3);text-align:center;font-size:14px}
.irow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:8px;
  align-items:start;
  padding:9px 10px;
  background:rgba(255,255,255,.88);
  border:1px solid color-mix(in srgb,var(--cat-color) 22%,var(--border) 78%);
  border-left:6px solid var(--status-color);
  border-radius:8px;
}
.irow[draggable=true]{cursor:grab}
.irow.dragging{opacity:.45}
.iname{
  min-width:0;
  min-height:32px;
  border:1px solid transparent;
  border-radius:6px;
  padding:3px 5px;
  resize:none;
  overflow:hidden;
  color:var(--text);
  background:transparent;
  font-size:17px;
  font-weight:600;
  line-height:1.45;
}
.iname:focus{border-color:var(--cat-color);background:#fff;outline:none}
.badge{
  border:0;
  border-radius:999px;
  padding:6px 11px;
  color:var(--badge-text);
  background:var(--badge-bg);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}
.del-btn{
  width:30px;
  height:30px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--text3);
  font-size:18px;
  line-height:1;
}
.del-btn:hover{background:var(--surface2);color:var(--red)}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:0 12px 12px}
.add-input{
  min-height:42px;
  width:100%;
  border:1px solid var(--border2);
  border-radius:8px;
  padding:9px 11px;
  color:var(--text);
  background:#fff;
  outline:none;
}
.add-input:focus{border-color:var(--cat-color);background:#fff}
.btn{
  min-height:40px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:8px 14px;
  background:var(--surface);
  color:var(--text);
  font-size:14px;
  font-weight:700;
}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.add-cat-btn{
  min-height:230px;
  border:1px dashed var(--border2);
  border-radius:var(--radius);
  background:var(--surface);
  color:var(--text2);
  font-weight:700;
}
.add-cat-btn:hover{background:var(--surface2);color:var(--text)}
.modal-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.45);
}
.modal{
  width:100%;
  max-width:400px;
  padding:24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.modal h3{margin-bottom:16px;font-size:19px}
.modal label{display:block;margin:12px 0 5px;color:var(--text2);font-size:13px;font-weight:700}
.modal input{
  width:100%;
  min-height:42px;
  border:1px solid var(--border2);
  border-radius:8px;
  padding:9px 10px;
  background:var(--surface2);
  color:var(--text);
  outline:none;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.save-toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:300;
  padding:9px 16px;
  border-radius:8px;
  background:var(--text);
  color:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}
.save-toast.show{opacity:1}
.login-card{
  grid-column:1/-1;
  padding:28px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.login-card p{margin:8px 0 16px;color:var(--text2)}
@media(max-width:760px){
  .header{position:static;align-items:flex-start;flex-direction:column;padding:14px 16px}
  .header-actions{justify-content:flex-start}
  .main{padding:16px 12px 50px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .toolbar{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:1fr}
  .card.today{grid-column:auto}
  .irow{grid-template-columns:minmax(0,1fr) auto}
  .del-btn{grid-column:2}
}
@media print{
  .header-actions,.toolbar .btn,.add-row,.add-cat-btn,.del-btn,.del-cat,.modal-overlay,.save-toast{display:none!important}
  .header{position:static;padding:12px 0;background:#fff;border-bottom:1px solid #ccc}
  .main{max-width:none;padding:12px 0}
  .grid{display:block}
  .card{break-inside:avoid;margin-bottom:12px;box-shadow:none}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="header">
  <div>
    <span class="logo">SIMBANLE <span>업무 현황</span></span>
  </div>
  <div class="header-actions">
    <button class="btn" id="printBtn" type="button">프린트</button>
    <button class="btn" id="exportBtn" type="button">내보내기</button>
    <button class="btn" id="importBtn" type="button">가져오기</button>
    <button class="btn" id="loginBtn" type="button">Google 로그인</button>
    <button class="btn" id="logoutBtn" type="button" style="display:none">로그아웃</button>
    <span id="authStatus" style="font-size:12px;color:var(--text3);display:none"></span>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <button class="btn btn-primary" id="addCatHeaderBtn" type="button">+ 보드 추가</button>
  </div>
</div>

<main class="main">
  <div class="stats-row" id="sg"></div>
  <div class="toolbar">
    <div>
      <span class="filter-title">진행확인</span>
      <div class="filter-row" id="fr">
        <button class="fbtn" type="button" data-f="all">전체</button>
        <button class="fbtn" type="button" data-f="완료">완료</button>
        <button class="fbtn" type="button" data-f="진행중">진행중</button>
        <button class="fbtn on" type="button" data-f="할일">할일</button>
      </div>
      <p class="hint">항목은 드래그해서 옆 보드로 옮기거나 같은 보드 안에서 위아래로 정리할 수 있습니다.</p>
    </div>
    <button class="btn btn-primary" id="addCatToolbarBtn" type="button">+ 보드 추가</button>
  </div>
  <div class="grid" id="mg"></div>
</main>

<div class="modal-overlay" id="catModal">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>보드 추가</h3>
    <label>보드 이름</label>
    <input type="text" id="catName" placeholder="예: 쇼핑몰, 지원사업">
    <label>표시 아이콘</label>
    <input type="text" id="catIcon" placeholder="예: 📌">
    <label>보드 컬러</label>
    <input type="color" id="catColor" value="#378ADD" style="height:44px;padding:4px">
    <div class="modal-actions">
      <button class="btn" type="button" id="cancelCatBtn">취소</button>
      <button class="btn btn-primary" type="button" id="saveCatBtn">추가</button>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">저장됨</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const KEY = 'bunnar_dashboard_v1';
const TODAY_ID = 'today';
const DONE_ID = 'done-check';
const STATUSES = ['할일', '진행중', '완료'];
const BADGE_STYLE = {
  '할일': { bg:'#FFE9A8', text:'#664600', line:'#E6B833' },
  '진행중': { bg:'#BBDCF8', text:'#0C447C', line:'#378ADD' },
  '완료': { bg:'#BFE9D6', text:'#085041', line:'#1D9E75' },
};
const COLORS = ['#378ADD','#1D9E75','#BA7517','#3B6D11','#7F77DD','#D85A30','#993556'];

const firebaseConfig = {
  apiKey: "AIzaSyBGBDywtb_UQwewBObvTSVxiXTTLDZQd2w",
  authDomain: "bunnar-dashboard.firebaseapp.com",
  projectId: "bunnar-dashboard",
  storageBucket: "bunnar-dashboard.firebasestorage.app",
  messagingSenderId: "170038311346",
  appId: "1:170038311346:web:59e4eb30f65961aab80cab",
  measurementId: "G-TDR9PS981E"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const DASHBOARD_DOC = db.collection('dashboards').doc('simbanle-main');

let DATA = defaultData();
let activeFilter = '할일';
let unsubscribeDashboard = null;
let draggedItemId = '';

function uid(){return 'id_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36)}
function escapeHtml(v){return String(v || '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusOf(s){
  const text = String(s || '');
  if (text.includes('완료') || text === 'done') return '완료';
  if (text.includes('진행') || text.includes('수행') || text === 'doing') return '진행중';
  return '할일';
}

function defaultData(){
  return [
    {id:TODAY_ID,label:'오늘의 할일',icon:'✓',color:'#D85A30',locked:true,items:[]},
    {id:'daily',label:'매일',icon:'↻',color:'#1D9E75',items:[]},
    {id:'working',label:'진행중',icon:'•',color:'#378ADD',items:[]},
    {id:'support',label:'지원사업',icon:'₩',color:'#BA7517',items:[]},
    {id:DONE_ID,label:'다한일 한번더 확인용',icon:'✓',color:'#3B6D11',locked:true,items:[]},
  ];
}

function normalizeData(raw){
  const source = Array.isArray(raw) && raw.length ? raw : defaultData();
  const mapped = source.map((cat, idx)=>({
    id: cat.id || uid(),
    label: cat.label || cat.name || '새 보드',
    icon: cat.icon || '•',
    color: cat.color || COLORS[idx % COLORS.length],
    locked: cat.locked === true || cat.id === TODAY_ID || cat.id === DONE_ID,
    items: Array.isArray(cat.items) ? cat.items.map(item=>({
      id: item.id || uid(),
      n: item.n || item.title || '',
      s: statusOf(item.s || item.status),
      note: item.note || item.tag || '',
    })).filter(item=>item.n.trim()) : []
  }));

  if (!mapped.some(cat=>cat.id === TODAY_ID)) {
    mapped.unshift({id:TODAY_ID,label:'오늘의 할일',icon:'✓',color:'#D85A30',locked:true,items:[]});
  }
  if (!mapped.some(cat=>cat.id === DONE_ID)) {
    mapped.push({id:DONE_ID,label:'다한일 한번더 확인용',icon:'✓',color:'#3B6D11',locked:true,items:[]});
  }

  const todayIndex = mapped.findIndex(cat=>cat.id === TODAY_ID);
  if (todayIndex > 0) mapped.unshift(mapped.splice(todayIndex,1)[0]);
  const done = mapped.find(cat=>cat.id === DONE_ID);
  mapped.forEach(cat=>{
    if (cat.id === DONE_ID) return;
    const keep = [];
    cat.items.forEach(item=>{
      if (item.s === '완료') done.items.push(item);
      else keep.push(item);
    });
    cat.items = keep;
  });
  done.items.forEach(item=>item.s = '완료');
  return mapped;
}

function getLocalBackupData(){
  try{
    const saved = localStorage.getItem(KEY);
    return saved ? normalizeData(JSON.parse(saved)) : null;
  }catch(e){return null}
}

async function loadData(){
  try{
    const snap = await DASHBOARD_DOC.get();
    if (snap.exists && Array.isArray(snap.data().items)) {
      const cloudData = normalizeData(snap.data().items);
      localStorage.setItem(KEY, JSON.stringify(cloudData));
      return cloudData;
    }
    const initialData = getLocalBackupData() || defaultData();
    await DASHBOARD_DOC.set({items:initialData,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    localStorage.setItem(KEY, JSON.stringify(initialData));
    return initialData;
  }catch(e){
    console.error(e);
    alert('데이터를 불러오지 못했습니다. Firebase 설정, 로그인 상태, 보안 규칙을 확인해주세요.');
    return getLocalBackupData() || defaultData();
  }
}

async function save(){
  localStorage.setItem(KEY, JSON.stringify(DATA));
  if (!auth.currentUser) return;
  try{
    await DASHBOARD_DOC.set({
      items: DATA,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: auth.currentUser.email || ''
    }, {merge:true});
    showToast();
  }catch(e){
    console.error(e);
    alert('저장에 실패했습니다. 로그인 상태와 Firebase 보안 규칙을 확인해주세요.');
  }
}

function showToast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 1200);
}

function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider).catch(err=>{
    console.error(err);
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
      auth.signInWithRedirect(provider);
      return;
    }
    alert('로그인에 실패했습니다. Firebase Authentication 설정을 확인해주세요.');
  });
}
function logout(){auth.signOut()}

function calcStats(){
  const all = DATA.flatMap(c=>c.items);
  return {
    total: all.length,
    done: all.filter(i=>i.s === '완료').length,
    active: all.filter(i=>i.s === '진행중').length,
    todo: all.filter(i=>i.s === '할일').length,
  };
}

function findItem(itemId){
  for (const cat of DATA) {
    const idx = cat.items.findIndex(item=>item.id === itemId);
    if (idx >= 0) return {cat,item:cat.items[idx],idx};
  }
  return null;
}

function cycleStatus(catId, itemId){
  const found = findItem(itemId);
  if (!found) return;
  found.item.s = STATUSES[(STATUSES.indexOf(found.item.s) + 1) % STATUSES.length];
  if (found.item.s === '완료') moveItem(itemId, DONE_ID);
  save();
  render();
}

function deleteItem(itemId){
  const found = findItem(itemId);
  if (!found) return;
  found.cat.items.splice(found.idx,1);
  save();
  render();
}

function deleteCat(catId){
  const cat = DATA.find(c=>c.id === catId);
  if (!cat || cat.locked) return;
  if (cat.items.length && !confirm('보드 안의 할일도 함께 삭제됩니다. 삭제할까요?')) return;
  DATA = DATA.filter(c=>c.id !== catId);
  save();
  render();
}

function addItemKey(e, catId){
  if (e.key !== 'Enter') return;
  const text = e.target.value.trim();
  if (!text) return;
  const cat = DATA.find(c=>c.id === catId);
  if (!cat) return;
  cat.items.push({id:uid(), n:text, s:cat.id === DONE_ID ? '완료' : '할일', note:''});
  e.target.value = '';
  save();
  render();
  setTimeout(()=>{
    const inp = document.getElementById('inp_' + catId);
    if (inp) inp.focus();
  }, 30);
}

function moveItem(itemId, targetCatId, beforeItemId){
  const found = findItem(itemId);
  const target = DATA.find(c=>c.id === targetCatId);
  if (!found || !target) return;
  const [item] = found.cat.items.splice(found.idx,1);
  if (target.id === DONE_ID) item.s = '완료';
  if (target.id !== DONE_ID && item.s === '완료') item.s = '할일';
  const insertAt = beforeItemId ? target.items.findIndex(i=>i.id === beforeItemId) : -1;
  if (insertAt >= 0) target.items.splice(insertAt,0,item);
  else target.items.push(item);
}

function autoGrow(textarea){
  textarea.style.height = 'auto';
  textarea.style.height = textarea.scrollHeight + 'px';
}

function render(){
  const s = calcStats();
  document.getElementById('sg').innerHTML = `
    <div class="stat"><div class="stat-num">${s.total}</div><div class="stat-label">전체</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--green)">${s.done}</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--blue)">${s.active}</div><div class="stat-label">진행중</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--amber)">${s.todo}</div><div class="stat-label">할일</div></div>
  `;

  const grid = document.getElementById('mg');
  grid.innerHTML = '';

  DATA.forEach(cat=>{
    const done = cat.items.filter(i=>i.s === '완료').length;
    const pct = cat.items.length ? Math.round(done / cat.items.length * 100) : 0;
    const vis = activeFilter === 'all' ? cat.items : cat.items.filter(i=>i.s === activeFilter);
    const card = document.createElement('div');
    card.className = 'card' + (cat.id === TODAY_ID ? ' today' : '');
    card.dataset.catId = cat.id;
    card.style.setProperty('--cat-color', cat.color);
    card.style.setProperty('--cat-border', `color-mix(in srgb, ${cat.color} 56%, #ffffff 44%)`);
    card.style.setProperty('--cat-wash', `color-mix(in srgb, ${cat.color} 17%, #ffffff 83%)`);
    card.style.setProperty('--cat-soft', `color-mix(in srgb, ${cat.color} 8%, #ffffff 92%)`);
    card.innerHTML = `
      <div class="card-head">
        <span class="card-icon">${escapeHtml(cat.icon)}</span>
        <input class="card-label" value="${escapeHtml(cat.label)}" ${cat.locked ? 'readonly' : ''} aria-label="보드 이름">
        <span class="card-meta">${done}/${cat.items.length} · ${pct}%</span>
        ${cat.locked ? '<span></span>' : `<button class="del-cat" type="button" title="보드 삭제" data-delete-cat="${cat.id}">×</button>`}
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:${cat.color}"></div></div>
    `;

    const titleInput = card.querySelector('.card-label');
    titleInput.addEventListener('change', ()=>{
      cat.label = titleInput.value.trim() || '새 보드';
      save();
      render();
    });

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';
    if (!vis.length) {
      itemsDiv.innerHTML = '<div class="empty">표시할 일이 없습니다</div>';
    } else {
      vis.forEach(item=>{
        const style = BADGE_STYLE[item.s] || BADGE_STYLE['할일'];
        const row = document.createElement('div');
        row.className = 'irow';
        row.draggable = true;
        row.dataset.itemId = item.id;
        row.style.setProperty('--status-color', style.line);
        row.style.setProperty('--badge-bg', style.bg);
        row.style.setProperty('--badge-text', style.text);
        row.innerHTML = `
          <textarea class="iname" rows="1" aria-label="할일">${escapeHtml(item.n)}</textarea>
          <button class="badge" type="button" title="상태 변경">${item.s}</button>
          <button class="del-btn" type="button" title="삭제">×</button>
        `;
        const textarea = row.querySelector('.iname');
        textarea.addEventListener('input',()=>autoGrow(textarea));
        textarea.addEventListener('change',()=>{
          item.n = textarea.value.trim() || '제목 없음';
          save();
          render();
        });
        row.querySelector('.badge').addEventListener('click',()=>cycleStatus(cat.id,item.id));
        row.querySelector('.del-btn').addEventListener('click',()=>deleteItem(item.id));
        row.addEventListener('dragstart',e=>{
          draggedItemId = item.id;
          row.classList.add('dragging');
          e.dataTransfer.setData('text/plain', item.id);
        });
        row.addEventListener('dragend',()=>row.classList.remove('dragging'));
        row.addEventListener('dragover',e=>{
          if (!draggedItemId || draggedItemId === item.id) return;
          e.preventDefault();
        });
        row.addEventListener('drop',e=>{
          e.preventDefault();
          e.stopPropagation();
          const droppedId = e.dataTransfer.getData('text/plain') || draggedItemId;
          moveItem(droppedId, cat.id, item.id);
          draggedItemId = '';
          save();
          render();
        });
        itemsDiv.appendChild(row);
        requestAnimationFrame(()=>autoGrow(textarea));
      });
    }

    card.addEventListener('dragover',e=>{
      if (!draggedItemId) return;
      e.preventDefault();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      const droppedId = e.dataTransfer.getData('text/plain') || draggedItemId;
      moveItem(droppedId, cat.id);
      draggedItemId = '';
      save();
      render();
    });

    card.appendChild(itemsDiv);
    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `
      <input class="add-input" id="inp_${cat.id}" placeholder="+ 할일 추가 후 Enter" onkeydown="addItemKey(event,'${cat.id}')">
      <button class="btn" type="button">추가</button>
    `;
    addRow.querySelector('button').addEventListener('click',()=>{
      const inp = addRow.querySelector('input');
      addItemKey({key:'Enter',target:inp}, cat.id);
    });
    card.appendChild(addRow);
    grid.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-cat-btn';
  addBtn.type = 'button';
  addBtn.textContent = '+ 보드 추가';
  addBtn.addEventListener('click', showAddCat);
  grid.appendChild(addBtn);

  grid.querySelectorAll('[data-delete-cat]').forEach(btn=>btn.addEventListener('click',()=>deleteCat(btn.dataset.deleteCat)));
}

function showAddCat(){
  document.getElementById('catModal').style.display = 'flex';
  document.getElementById('catName').focus();
}
function closeCatModalDirect(){
  document.getElementById('catModal').style.display = 'none';
  document.getElementById('catName').value = '';
  document.getElementById('catIcon').value = '';
}
function addCategory(){
  const name = document.getElementById('catName').value.trim();
  if (!name) { alert('보드 이름을 입력해주세요.'); return; }
  const icon = document.getElementById('catIcon').value.trim() || '•';
  const color = document.getElementById('catColor').value;
  const doneIndex = DATA.findIndex(c=>c.id === DONE_ID);
  const board = {id:uid(),label:name,icon,color,items:[]};
  if (doneIndex >= 0) DATA.splice(doneIndex,0,board);
  else DATA.push(board);
  save();
  render();
  closeCatModalDirect();
}

function exportData(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bunnar-dashboard-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      DATA = normalizeData(JSON.parse(ev.target.result));
      save();
      render();
      alert('가져오기가 완료되었습니다.');
    }catch(err){
      alert('올바른 JSON 파일이 아닙니다.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('fr').addEventListener('click',e=>{
  const b = e.target.closest('[data-f]');
  if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  activeFilter = b.dataset.f;
  render();
});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.getElementById('exportBtn').addEventListener('click',exportData);
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',e=>{
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('logoutBtn').addEventListener('click',logout);
document.getElementById('addCatHeaderBtn').addEventListener('click',showAddCat);
document.getElementById('addCatToolbarBtn').addEventListener('click',showAddCat);
document.getElementById('catModal').addEventListener('click',e=>{
  if (e.target.id === 'catModal') closeCatModalDirect();
});
document.getElementById('cancelCatBtn').addEventListener('click',closeCatModalDirect);
document.getElementById('saveCatBtn').addEventListener('click',addCategory);

auth.onAuthStateChanged(async user=>{
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const authStatus = document.getElementById('authStatus');
  const addCatHeaderBtn = document.getElementById('addCatHeaderBtn');

  if (unsubscribeDashboard) {
    unsubscribeDashboard();
    unsubscribeDashboard = null;
  }

  if (!user) {
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    authStatus.style.display = 'none';
    addCatHeaderBtn.style.display = 'none';
    document.getElementById('sg').innerHTML = '';
    document.getElementById('mg').innerHTML = `
      <div class="login-card">
        <strong>로그인이 필요합니다</strong>
        <p>회사와 집에서 같은 데이터를 보려면 Google 로그인을 해주세요.</p>
        <button class="btn btn-primary" type="button" onclick="login()">Google 로그인</button>
      </div>
    `;
    return;
  }

  loginBtn.style.display = 'none';
  logoutBtn.style.display = 'inline-block';
  authStatus.textContent = user.email || '로그인됨';
  authStatus.style.display = 'inline-block';
  addCatHeaderBtn.style.display = 'inline-block';

  DATA = await loadData();
  render();

  unsubscribeDashboard = DASHBOARD_DOC.onSnapshot(snap=>{
    if (!snap.exists || !Array.isArray(snap.data().items)) return;
    DATA = normalizeData(snap.data().items);
    localStorage.setItem(KEY, JSON.stringify(DATA));
    render();
  }, err=>console.error(err));
});
</script>
</body>
