<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sam 공부">
<meta name="theme-color" content="#1565C0">
<title>Sam의 공부 대모험!</title>

<!-- Roblox-style favicon SVG -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231565C0'/><rect x='15' y='15' width='70' height='70' rx='10' fill='%23FF3E3E'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial Black'>S</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%231565C0'/><rect x='20' y='20' width='140' height='140' rx='24' fill='%23FF3E3E'/><text y='130' x='90' text-anchor='middle' font-size='100' font-family='Arial Black' fill='white'>S</text></svg>">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL8G5JrJyIZ25rrWSKqI79FiKXNqJvhlA",
  authDomain: "sam-study.firebaseapp.com",
  projectId: "sam-study",
  storageBucket: "sam-study.firebasestorage.app",
  messagingSenderId: "1005005180729",
  appId: "1:1005005180729:web:e1705133e388b01aed22e8",
  measurementId: "G-2ZV12VLP9B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let userData    = null;

// ── 기본 데이터 ──
const defaultSubjects = [
  { id:"math",  name:"만점왕 수학",    icon:"🔢", color:"#FF6B35", total:20, done:0, stickers:[] },
  { id:"hist",  name:"스토리 한국사",  icon:"🏯", color:"#E040FB", total:15, done:0, stickers:[] },
  { id:"eng",   name:"영문법",          icon:"📝", color:"#29B6F6", total:12, done:0, stickers:[] },
  { id:"word",  name:"기초 영단어",     icon:"🔤", color:"#00E5FF", total:20, done:0, stickers:[] },
  { id:"hanja", name:"쉬운 급수 한자", icon:"🀄", color:"#AB47BC", total:15, done:0, stickers:[] },
  { id:"sci",   name:"만점왕 통합본",  icon:"🔬", color:"#00E676", total:18, done:0, stickers:[] },
];

// 기본 시간표
const defaultTimetable = {
  mon: ["만점왕 수학","기초 영단어"],
  tue: ["영문법","쉬운 급수 한자"],
  wed: ["만점왕 수학","스토리 한국사"],
  thu: ["영문법","기초 영단어"],
  fri: ["만점왕 수학","쉬운 급수 한자"],
  sat: ["만점왕 통합본","자유 선택"],
};

const STICKER_POOL = ["⭐","🌟","🏆","🎯","🚀","🌈","🦁","🐬","🦋","🌺","🍀","🎉","💎","🔥","✨","🎮","👾","🏅"];
const DAY_KR = {mon:"월",tue:"화",wed:"수",thu:"목",fri:"금",sat:"토"};

async function save(data){ await setDoc(doc(db,"users",currentUser.uid), data, {merge:true}); }
async function load(uid){
  const snap = await getDoc(doc(db,"users",uid));
  return snap.exists() ? snap.data() : null;
}

// ── 탭 전환 ──
window.switchTab = function(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  document.getElementById('tab-'+tab).style.display='block';
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
};

// ── 대시보드 렌더 ──
window.renderDashboard = function(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  const name = currentUser.displayName?.split(' ')[0] || 'Sam';
  document.getElementById('user-greeting').textContent = name + ' 님, 오늘도 파이팅! 🎮';
  renderSubjects();
  renderOverallBar();
  renderTimetable();
};

window.renderSubjects = function(){
  const list = document.getElementById('subject-list');
  list.innerHTML='';
  (userData.subjects||[]).forEach((s,idx)=>{
    const pct = s.total>0 ? Math.round((s.done/s.total)*100) : 0;
    const div = document.createElement('div');
    div.className='s-card'; div.style.setProperty('--sc',s.color);
    div.style.animationDelay=(idx*0.06)+'s';
    div.innerHTML=`
      <div class="sc-head">
        <div class="sc-icon-wrap" style="background:${s.color}22;border:2px solid ${s.color}">
          <span class="sc-icon">${s.icon}</span>
        </div>
        <div class="sc-info">
          <div class="sc-name">${s.name}</div>
          <div class="sc-meta">${s.done} / ${s.total}강 완료</div>
        </div>
        <div class="sc-pct" style="color:${s.color}">${pct}%</div>
      </div>
      <div class="track-outer">
        <div class="track-inner">
          <div class="track-fill" style="width:${Math.max(pct,2)}%">
            <div class="char-runner">${pct>=100?'🏆':'🧑‍🚀'}</div>
          </div>
          <div class="track-markers">
            ${[25,50,75].map(m=>`<div class="tm" style="left:${m}%"></div>`).join('')}
            <div class="tm-flag" style="right:0">🏁</div>
          </div>
        </div>
      </div>
      <div class="sc-stickers">${(s.stickers||[]).map(st=>`<span class="stk">${st}</span>`).join('')}</div>
      <div class="sc-btns">
        <button class="btn-primary" style="background:${s.color}" ontouchstart="" onclick="markDone(${idx})">✅ 완료!</button>
        <button class="btn-ghost" ontouchstart="" onclick="undoDone(${idx})" ${s.done===0?'disabled':''}>↩ 취소</button>
        <button class="btn-stk" ontouchstart="" onclick="addSticker(${idx})">🎁</button>
      </div>
      ${pct>=100?`<div class="complete-banner">🏆 완주 달성! 대단해요!</div>`:''}
    `;
    list.appendChild(div);
  });
};

window.renderOverallBar = function(){
  const total = (userData.subjects||[]).reduce((a,s)=>a+s.total,0);
  const done  = (userData.subjects||[]).reduce((a,s)=>a+s.done,0);
  const pct   = total>0 ? Math.round((done/total)*100) : 0;
  document.getElementById('overall-fill').style.width = pct+'%';
  document.getElementById('overall-pct').textContent = pct+'%';
  document.getElementById('overall-done').textContent = done+'강';
  document.getElementById('streak-num').textContent = userData.streak||0;
  document.getElementById('streak-num2').textContent = userData.streak||0;
  renderCalendar();
};

window.renderCalendar = function(){
  const cal = document.getElementById('mini-cal');
  const log = userData.studyLog||{};
  cal.innerHTML='';
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const key = d.toDateString();
    const done = !!log[key];
    const el = document.createElement('div');
    el.className='cal-dot'+(done?' done':'');
    el.innerHTML=`<span>${['일','월','화','수','목','금','토'][d.getDay()]}</span><span>${d.getDate()}</span>`;
    cal.appendChild(el);
  }
};

// ── 시간표 렌더 ──
window.renderTimetable = function(){
  const tt = userData.timetable || defaultTimetable;
  const wrap = document.getElementById('timetable-grid');
  wrap.innerHTML='';
  const days = ['mon','tue','wed','thu','fri','sat'];
  // 오늘 요일
  const todayIdx = new Date().getDay(); // 0=일
  const dayMap   = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat'};
  const todayKey = dayMap[todayIdx]||null;

  days.forEach(d=>{
    const col = document.createElement('div');
    col.className='tt-col'+(d===todayKey?' tt-today':'');
    const classes = (tt[d]||[]);
    col.innerHTML=`
      <div class="tt-day">${DAY_KR[d]}${d===todayKey?'<span class="today-dot">●</span>':''}</div>
      <div class="tt-classes">
        ${classes.map(c=>`<div class="tt-class">${c}</div>`).join('')}
        <button class="tt-add-btn" onclick="openTTModal('${d}')">+</button>
      </div>
    `;
    wrap.appendChild(col);
  });
};

// 시간표 편집 모달
window.openTTModal = function(day){
  const tt = userData.timetable || defaultTimetable;
  window._editDay = day;
  const classes = (tt[day]||[]).join('\n');
  document.getElementById('tt-edit-day').textContent = DAY_KR[day]+'요일 수업';
  document.getElementById('tt-edit-input').value = classes;
  document.getElementById('tt-modal').style.display='flex';
};
window.closeTTModal = function(){
  document.getElementById('tt-modal').style.display='none';
};
window.saveTTModal = async function(){
  const val = document.getElementById('tt-edit-input').value;
  const classes = val.split('\n').map(v=>v.trim()).filter(Boolean);
  if(!userData.timetable) userData.timetable = {...defaultTimetable};
  userData.timetable[window._editDay] = classes;
  closeTTModal();
  renderTimetable();
  await save(userData);
};

// ── 강의 완료 ──
window.markDone = async function(idx){
  const s = userData.subjects[idx];
  if(s.done>=s.total) return;
  s.done++;
  const today = new Date().toDateString();
  if(!userData.studyLog) userData.studyLog={};
  userData.studyLog[today]=(userData.studyLog[today]||0)+1;
  // streak
  const yesterday=new Date(Date.now()-86400000).toDateString();
  const last=userData.streak_lastDate;
  if(last!==today){
    userData.streak_lastDate=today;
    if(last===yesterday) userData.streak=(userData.streak||0)+1;
    else if(!last) userData.streak=1;
    else userData.streak=1;
  }
  userData.lastStudyDate=today;
  boom(s.icon); boom(s.icon);
  renderSubjects(); renderOverallBar();
  await save(userData);
};

window.undoDone = async function(idx){
  if(userData.subjects[idx].done<=0) return;
  userData.subjects[idx].done--;
  renderSubjects(); renderOverallBar();
  await save(userData);
};

window.addSticker = async function(idx){
  const stk=STICKER_POOL[Math.floor(Math.random()*STICKER_POOL.length)];
  if(!userData.subjects[idx].stickers) userData.subjects[idx].stickers=[];
  userData.subjects[idx].stickers.push(stk);
  boom(stk);
  renderSubjects();
  await save(userData);
};

// ── 폭죽 ──
window.boom = function(emoji){
  const c=document.getElementById('fx');
  for(let i=0;i<20;i++){
    const el=document.createElement('div');
    el.className='fx-piece';
    el.textContent=emoji;
    el.style.cssText=`left:${5+Math.random()*90}%;animation-duration:${0.7+Math.random()*0.9}s;animation-delay:${Math.random()*0.25}s;font-size:${14+Math.random()*18}px`;
    c.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
};

// ── 과목 추가 모달 ──
window.openAddModal=()=>document.getElementById('add-modal').style.display='flex';
window.closeAddModal=()=>{
  document.getElementById('add-modal').style.display='none';
  document.getElementById('new-name').value='';
  document.getElementById('new-total').value='10';
};
window.addSubject=async function(){
  const name=document.getElementById('new-name').value.trim();
  const total=parseInt(document.getElementById('new-total').value)||10;
  const icon=document.getElementById('sel-icon').value||'📚';
  if(!name) return;
  const colors=["#FF6B35","#E040FB","#29B6F6","#00E5FF","#AB47BC","#00E676","#FFD600","#FF4081"];
  userData.subjects.push({id:'c'+Date.now(),name,icon,color:colors[userData.subjects.length%colors.length],total,done:0,stickers:[]});
  await save(userData);
  closeAddModal();
  renderSubjects(); renderOverallBar();
};

// ── 로그인 ──
window.loginWithGoogle=async function(){
  try{
    const r=await signInWithPopup(auth,provider);
    currentUser=r.user;
    let d=await load(currentUser.uid);
    if(!d){ d={subjects:defaultSubjects,timetable:defaultTimetable,streak:0,studyLog:{},lastStudyDate:null,streak_lastDate:null}; await save(d); }
    userData=d;
    if(!userData.timetable) userData.timetable=defaultTimetable;
    renderDashboard();
  }catch(e){ alert('로그인 실패: '+e.message); }
};
window.logout=async function(){
  await signOut(auth);
  currentUser=null; userData=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
};

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    let d=await load(user.uid);
    if(!d){ d={subjects:defaultSubjects,timetable:defaultTimetable,streak:0,studyLog:{},lastStudyDate:null,streak_lastDate:null}; await save(d); }
    userData=d;
    if(!userData.timetable) userData.timetable=defaultTimetable;
    renderDashboard();
  }
});
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0A0E1A;--s1:#111827;--s2:#1C2333;--s3:#243047;
  --border:#2A3550;--accent:#FF3E3E;--gold:#FFD600;--blue:#1E88E5;
  --cyan:#00E5FF;--green:#00E676;--purple:#E040FB;
  --text:#F0F4FF;--muted:#7B8BAD;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse at 15% 10%,#1a1060 0%,transparent 45%),
    radial-gradient(ellipse at 85% 85%,#0d1f3c 0%,transparent 45%),
    var(--bg);
}

/* ── 픽셀 격자 배경 ── */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(30,136,229,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,136,229,.04) 1px,transparent 1px);
  background-size:32px 32px;
}

/* ══ 로그인 ══ */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:16px;padding:24px;
}
.login-logo{
  width:100px;height:100px;border-radius:22px;
  background:linear-gradient(135deg,#1565C0,#0D47A1);
  border:4px solid var(--blue);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(30,136,229,.5);
  font-size:56px;animation:logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 0 30px rgba(30,136,229,.5)}50%{box-shadow:0 0 60px rgba(30,136,229,.9)}}
.login-badge{
  background:var(--accent);color:#fff;font-family:'Jua',sans-serif;
  font-size:11px;padding:3px 10px;border-radius:20px;letter-spacing:1px;
  text-transform:uppercase;margin-top:-4px;
}
.login-title{font-family:'Jua',sans-serif;font-size:32px;color:#fff;text-align:center;line-height:1.2;text-shadow:0 0 20px rgba(255,62,62,.6)}
.login-sub{color:var(--muted);font-size:13px}
.btn-google{
  background:#fff;color:#333;border:none;border-radius:50px;
  padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  transition:transform .15s;margin-top:8px;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-google:active{transform:scale(.96)}
.btn-google img{width:22px}

/* ══ 앱 ══ */
#app-screen{display:none;min-height:100vh;padding-bottom:80px}

/* ── 헤더 ── */
.app-header{
  background:linear-gradient(135deg,#0D47A1 0%,#1565C0 50%,#0A0E1A 100%);
  border-bottom:2px solid var(--blue);
  padding:14px 16px 10px;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.header-logo{display:flex;align-items:center;gap:8px}
.logo-box{
  width:34px;height:34px;border-radius:8px;
  background:var(--accent);border:2px solid #FF7043;
  display:flex;align-items:center;justify-content:center;
  font-family:'Jua',sans-serif;font-size:18px;color:#fff;
  box-shadow:0 2px 8px rgba(255,62,62,.5);
}
.header-title{font-family:'Jua',sans-serif;font-size:17px;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.streak-chip{
  background:rgba(255,214,0,.15);border:1px solid var(--gold);
  border-radius:20px;padding:4px 10px;font-size:12px;color:var(--gold);
  display:flex;align-items:center;gap:4px;
}
.btn-out{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer}
.greeting{font-size:12px;color:rgba(255,255,255,.7);padding:0 2px}

/* ── 탭 바 ── */
.tab-bar{
  display:flex;background:var(--s1);border-bottom:1px solid var(--border);
  position:sticky;top:66px;z-index:99;
}
.tab-btn{
  flex:1;padding:11px 4px;font-size:12px;font-weight:500;
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .2s;
  font-family:'Noto Sans KR',sans-serif;
}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── 메인 ── */
.main{padding:14px 12px;max-width:600px;margin:0 auto}

/* ── 전체 진행 ── */
.overall-card{
  background:linear-gradient(135deg,#1a2744,#0f1a30);
  border:1px solid var(--blue);border-radius:var(--r);
  padding:14px 16px;margin-bottom:12px;
  box-shadow:0 4px 20px rgba(30,136,229,.2);
}
.oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.oc-title{font-family:'Jua',sans-serif;font-size:14px;color:var(--cyan)}
.oc-nums{display:flex;gap:14px}
.oc-n{text-align:center}
.oc-nv{font-family:'Jua',sans-serif;font-size:20px;color:var(--gold)}
.oc-nl{font-size:10px;color:var(--muted)}
.big-track{
  position:relative;height:30px;background:#0a0e1a;
  border-radius:50px;overflow:hidden;border:1px solid var(--border);
}
#overall-fill{
  height:100%;border-radius:50px;
  background:linear-gradient(90deg,#1565C0,#42A5F5,var(--cyan));
  transition:width .9s cubic-bezier(.34,1.56,.64,1);
  position:relative;min-width:30px;
}
.big-char{
  position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  font-size:22px;filter:drop-shadow(0 0 8px var(--cyan));
  animation:hop .5s ease-in-out infinite alternate;
}
@keyframes hop{from{transform:translateY(-52%)}to{transform:translateY(-48%)}}

/* ── 스탯 행 ── */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:12px;
}
.stat-card-title{font-size:10px;color:var(--muted);margin-bottom:6px}
#mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dot{
  background:var(--s2);border-radius:6px;padding:3px 2px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.cal-dot span:first-child{font-size:8px;color:var(--muted)}
.cal-dot span:last-child{font-size:11px;font-weight:700;color:var(--text)}
.cal-dot.done{background:#003300;border:1px solid var(--green)}
.cal-dot.done span{color:var(--green)!important}
.streak-val{font-family:'Jua',sans-serif;font-size:44px;color:var(--gold);text-align:center;line-height:1;text-shadow:0 0 20px rgba(255,214,0,.5)}
.streak-lbl{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}

/* ── 과목 섹션 ── */
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-title{font-family:'Jua',sans-serif;font-size:16px}
.btn-add{
  background:var(--accent);color:#fff;border:none;border-radius:50px;
  padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 12px rgba(255,62,62,.4);
  font-family:'Noto Sans KR',sans-serif;
}
.btn-add:active{transform:scale(.94)}

#subject-list{display:flex;flex-direction:column;gap:10px}

.s-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;overflow:hidden;position:relative;
  animation:slideUp .35s ease both;
  border-left:3px solid var(--sc);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.s-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--sc),transparent);
}

.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sc-icon-wrap{
  width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.sc-icon{font-size:22px}
.sc-info{flex:1}
.sc-name{font-family:'Jua',sans-serif;font-size:15px;color:var(--text)}
.sc-meta{font-size:11px;color:var(--muted);margin-top:1px}
.sc-pct{font-family:'Jua',sans-serif;font-size:20px;font-weight:700}

/* ── 달리기 트랙 ── */
.track-outer{margin-bottom:8px}
.track-inner{
  position:relative;height:34px;background:#06080f;
  border-radius:50px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  /* 레인 라인 */
  background-image:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,.03) 3px,rgba(255,255,255,.03) 4px);
}
.track-fill{
  height:100%;border-radius:50px;
  background:linear-gradient(90deg,var(--sc),color-mix(in srgb,var(--sc) 70%,white 30%));
  transition:width .7s cubic-bezier(.34,1.56,.64,1);
  position:relative;min-width:34px;
  box-shadow:0 0 12px color-mix(in srgb,var(--sc) 60%,transparent);
}
.char-runner{
  position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  font-size:22px;filter:drop-shadow(0 0 6px var(--sc));
  animation:charBounce .55s ease-in-out infinite alternate;
}
@keyframes charBounce{from{transform:translateY(-52%) scaleX(1)}to{transform:translateY(-48%) scaleX(-1)}}
.track-markers{position:absolute;inset:0;pointer-events:none}
.tm{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.tm-flag{position:absolute;top:50%;transform:translateY(-50%);font-size:14px}

/* ── 스티커 ── */
.sc-stickers{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;min-height:4px}
.stk{font-size:16px;animation:stkPop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes stkPop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}

/* ── 버튼 ── */
.sc-btns{display:flex;gap:6px;align-items:center}
.btn-primary{
  flex:1;border:none;border-radius:50px;padding:9px 12px;
  font-size:13px;font-weight:700;cursor:pointer;color:#fff;
  font-family:'Noto Sans KR',sans-serif;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
  transition:transform .1s,filter .1s;
}
.btn-primary:active{transform:scale(.93);filter:brightness(1.2)}
.btn-ghost{
  background:var(--s2);border:1px solid var(--border);color:var(--muted);
  border-radius:50px;padding:9px 12px;font-size:12px;cursor:pointer;
  transition:border-color .15s;font-family:'Noto Sans KR',sans-serif;
}
.btn-ghost:active{border-color:var(--accent);color:var(--accent)}
.btn-ghost:disabled{opacity:.3;pointer-events:none}
.btn-stk{
  background:var(--s2);border:1px solid var(--border);
  border-radius:50px;padding:9px 12px;font-size:16px;cursor:pointer;
  transition:transform .15s;
}
.btn-stk:active{transform:scale(.88)}
.complete-banner{
  margin-top:8px;text-align:center;padding:6px;border-radius:8px;
  background:linear-gradient(135deg,#FFD600,#FF6B35);
  color:#000;font-family:'Jua',sans-serif;font-size:13px;
  animation:banner 1.5s ease-in-out infinite;
}
@keyframes banner{0%,100%{opacity:1}50%{opacity:.7}}

/* ══ 시간표 탭 ══ */
.tt-wrap{padding:0 0 10px}
.tt-today-box{
  background:linear-gradient(135deg,#1a2744,#0f1a30);
  border:1px solid var(--cyan);border-radius:var(--r);
  padding:12px 14px;margin-bottom:14px;
}
.tt-today-title{font-size:11px;color:var(--cyan);margin-bottom:6px;font-family:'Jua',sans-serif}
.tt-today-classes{display:flex;flex-wrap:wrap;gap:6px}
.tt-today-class{
  background:rgba(0,229,255,.12);border:1px solid var(--cyan);
  border-radius:20px;padding:5px 12px;font-size:12px;color:var(--cyan);font-weight:500;
}

.tt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tt-col{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:10px;overflow:hidden;
}
.tt-today{border-color:var(--cyan);background:linear-gradient(135deg,#0d1e35,#0a1528)}
.tt-day{
  font-family:'Jua',sans-serif;font-size:14px;color:var(--text);
  margin-bottom:6px;display:flex;align-items:center;gap:4px;
}
.today-dot{font-size:8px;color:var(--cyan);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.tt-classes{display:flex;flex-direction:column;gap:4px}
.tt-class{
  font-size:10px;padding:4px 7px;border-radius:6px;
  background:var(--s2);color:var(--text);line-height:1.3;
}
.tt-add-btn{
  background:transparent;border:1px dashed var(--border);color:var(--muted);
  border-radius:6px;padding:3px;font-size:12px;cursor:pointer;margin-top:2px;width:100%;
}
.tt-add-btn:active{border-color:var(--gold);color:var(--gold)}

/* ══ 모달 공통 ══ */
.modal-wrap{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:200;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(6px);
}
.modal-sheet{
  background:var(--s1);border:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:24px 20px 36px;
  width:100%;max-width:500px;
  animation:sheetUp .25s ease;
}
@media(min-width:500px){
  .modal-wrap{align-items:center}
  .modal-sheet{border-radius:20px;max-width:400px}
}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Jua',sans-serif;font-size:18px;color:var(--gold);margin-bottom:16px}
.modal-row{margin-bottom:12px}
.modal-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.modal-input{
  width:100%;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:14px;
  font-family:'Noto Sans KR',sans-serif;
}
.modal-input:focus{outline:none;border-color:var(--cyan)}
.icon-row{display:flex;flex-wrap:wrap;gap:6px}
.ic-opt{
  width:38px;height:38px;border:2px solid var(--border);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  cursor:pointer;background:var(--s2);transition:all .15s;
}
.ic-opt.sel,.ic-opt:active{border-color:var(--gold);background:#1a1500;transform:scale(1.1)}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.m-ok{flex:1;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.m-cancel{flex:1;background:var(--s2);color:var(--muted);border:1px solid var(--border);border-radius:50px;padding:12px;font-size:14px;cursor:pointer}
.m-ok:active,.m-cancel:active{transform:scale(.95)}

/* ── 폭죽 ── */
#fx{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:9999}
.fx-piece{position:absolute;top:-20px;animation:fxFall linear forwards}
@keyframes fxFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(540deg) scale(.4);opacity:0}}
</style>
</head>
<body>

<div id="fx"></div>

<!-- ══ 로그인 ══ -->
<div id="login-screen">
  <div class="login-logo">🎮</div>
  <div class="login-badge">STUDY QUEST</div>
  <div class="login-title">Sam의<br>공부 대모험!</div>
  <div class="login-sub">오늘 퀘스트를 완료하면 레벨업! 🚀</div>
  <button class="btn-google" onclick="loginWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Google로 시작하기
  </button>
</div>

<!-- ══ 앱 ══ -->
<div id="app-screen">

  <div class="app-header">
    <div class="header-top">
      <div class="header-logo">
        <div class="logo-box">S</div>
        <div class="header-title">STUDY QUEST</div>
      </div>
      <div class="header-right">
        <div class="streak-chip">🔥<span id="streak-num">0</span>일</div>
        <button class="btn-out" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="greeting" id="user-greeting">Sam 님, 오늘도 파이팅!</div>
  </div>

  <!-- 탭 바 -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">🏠 홈</button>
    <button class="tab-btn" data-tab="quest" onclick="switchTab('quest')">⚔️ 퀘스트</button>
    <button class="tab-btn" data-tab="timetable" onclick="switchTab('timetable')">📅 시간표</button>
  </div>

  <div class="main">

    <!-- ─── 홈 탭 ─── -->
    <div id="tab-home">

      <div class="overall-card">
        <div class="oc-top">
          <div class="oc-title">⚡ 전체 퀘스트 진행도</div>
          <div class="oc-nums">
            <div class="oc-n"><div class="oc-nv" id="overall-done">0강</div><div class="oc-nl">완료</div></div>
            <div class="oc-n"><div class="oc-nv" id="overall-pct">0%</div><div class="oc-nl">달성</div></div>
          </div>
        </div>
        <div class="big-track">
          <div id="overall-fill" style="width:0%">
            <div class="big-char">🧑‍🚀</div>
          </div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-card-title">📅 최근 7일 출석</div>
          <div id="mini-cal"></div>
        </div>
        <div class="stat-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div class="stat-card-title">🔥 연속 공부</div>
          <div class="streak-val" id="streak-num2">0</div>
          <div class="streak-lbl">일 연속!</div>
        </div>
      </div>

      <!-- 오늘의 시간표 미리보기 -->
      <div class="tt-today-box" id="today-preview">
        <div class="tt-today-title">📌 오늘의 수업</div>
        <div class="tt-today-classes" id="today-classes"></div>
      </div>

    </div>

    <!-- ─── 퀘스트 탭 ─── -->
    <div id="tab-quest" style="display:none">
      <div class="sec-header">
        <div class="sec-title">⚔️ 내 퀘스트 목록</div>
        <button class="btn-add" onclick="openAddModal()">+ 추가</button>
      </div>
      <div id="subject-list"></div>
    </div>

    <!-- ─── 시간표 탭 ─── -->
    <div id="tab-timetable" style="display:none">
      <div class="sec-header" style="margin-bottom:12px">
        <div class="sec-title">📅 주간 시간표</div>
      </div>
      <div class="tt-grid" id="timetable-grid"></div>
    </div>

  </div>
</div>

<!-- ══ 과목 추가 모달 ══ -->
<div class="modal-wrap" id="add-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">➕ 새 퀘스트 추가</div>
    <div class="modal-row">
      <div class="modal-label">아이콘</div>
      <div class="icon-row">
        <div class="ic-opt sel" onclick="selIcon(this,'📚')">📚</div>
        <div class="ic-opt" onclick="selIcon(this,'🔢')">🔢</div>
        <div class="ic-opt" onclick="selIcon(this,'🔬')">🔬</div>
        <div class="ic-opt" onclick="selIcon(this,'🏯')">🏯</div>
        <div class="ic-opt" onclick="selIcon(this,'📝')">📝</div>
        <div class="ic-opt" onclick="selIcon(this,'🎨')">🎨</div>
        <div class="ic-opt" onclick="selIcon(this,'🌍')">🌍</div>
        <div class="ic-opt" onclick="selIcon(this,'🔤')">🔤</div>
        <div class="ic-opt" onclick="selIcon(this,'🀄')">🀄</div>
        <div class="ic-opt" onclick="selIcon(this,'⚗️')">⚗️</div>
        <div class="ic-opt" onclick="selIcon(this,'🎮')">🎮</div>
        <div class="ic-opt" onclick="selIcon(this,'💡')">💡</div>
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-label">수업 이름</div>
      <input id="new-name" class="modal-input" type="text" placeholder="예: 만점왕 수학 4-1">
    </div>
    <div class="modal-row">
      <div class="modal-label">총 강의 수</div>
      <input id="new-total" class="modal-input" type="number" value="10" min="1" max="200">
    </div>
    <input type="hidden" id="sel-icon" value="📚">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeAddModal()">취소</button>
      <button class="m-ok" onclick="addSubject()">추가! 🚀</button>
    </div>
  </div>
</div>

<!-- ══ 시간표 편집 모달 ══ -->
<div class="modal-wrap" id="tt-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="tt-edit-day">시간표 편집</div>
    <div class="modal-row">
      <div class="modal-label">수업 목록 (한 줄에 하나씩)</div>
      <textarea id="tt-edit-input" class="modal-input" rows="5" placeholder="만점왕 수학&#10;기초 영단어"></textarea>
    </div>
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeTTModal()">취소</button>
      <button class="m-ok" onclick="saveTTModal()">저장 ✅</button>
    </div>
  </div>
</div>

<script>
function selIcon(el,v){
  document.querySelectorAll('.ic-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('sel-icon').value=v;
}

// 오늘 수업 미리보기
const origRT = window.renderTimetable;
window.renderTimetable = function(){
  origRT && origRT();
  // 오늘 수업 홈탭에 표시
  try{
    const dayMap={1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat'};
    const todayKey = dayMap[new Date().getDay()]||null;
    const tt = (window.userData&&window.userData.timetable)||{};
    const classes = todayKey ? (tt[todayKey]||[]) : [];
    const box = document.getElementById('today-classes');
    if(box){
      if(classes.length){
        box.innerHTML=classes.map(c=>`<div class="tt-today-class">${c}</div>`).join('');
      } else {
        box.innerHTML='<div style="font-size:12px;color:var(--muted)">오늘은 쉬는 날! 🎉</div>';
      }
    }
  }catch(e){}
};

// streak sync
const origROB = window.renderOverallBar;
window.renderOverallBar = function(){
  origROB && origROB();
  const v = document.getElementById('streak-num');
  const v2= document.getElementById('streak-num2');
  if(v&&v2) v2.textContent=v.textContent;
};
</script>

</body>
</html>
