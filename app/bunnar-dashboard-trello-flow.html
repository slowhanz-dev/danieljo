.brand{display:flex;align-items:center;gap:10px}.logo-mark{width:30px;height:30px;border-radius:9px;display:block;box-shadow:0 4px 12px rgba(0,0,0,.12)}.logo{font-size:17px;font-weight:700;letter-spacing:.04em}.logo span{font-weight:400;opacity:.55;margin-left:7px;font-size:13px}.mode-pill{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;background:#e0f2fe;color:#075985;border-radius:999px;padding:2px 7px;vertical-align:middle}.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.auth-note{font-size:11px;color:var(--text3)}

.board-wrap{overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}.kanban{display:grid;grid-template-columns:repeat(6,minmax(260px,1fr));gap:12px;min-width:1500px;align-items:start}.column{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:520px;display:flex;flex-direction:column;overflow:hidden}.column-head{padding:13px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:9px;position:sticky;top:0;background:var(--surface);z-index:2}.column-dot{width:10px;height:10px;border-radius:99px;margin-top:4px;flex-shrink:0}.column-title{font-size:13px;font-weight:800;line-height:1.25}.column-sub{font-size:10px;color:var(--text3);margin-top:1px}.column-count{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap}.column-cards{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:420px;flex:1}.column.drag-over{box-shadow:inset 0 0 0 2px rgba(24,95,165,.35)}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 5px 14px rgba(25,24,20,.05);padding:10px 10px 9px;cursor:grab;transition:background .12s,box-shadow .12s,transform .12s;border-left:4px solid var(--border2)}.task-card:hover{background:var(--surface2);box-shadow:0 8px 18px rgba(25,24,20,.08)}.task-card:active{cursor:grabbing}.task-card.dragging{opacity:.35;transform:rotate(1deg)}.task-card.drop-above{box-shadow:inset 0 3px 0 var(--blue)}.task-card.drop-below{box-shadow:inset 0 -3px 0 var(--blue)}.task-card.priority-high{border-left-color:var(--red)}.task-card.priority-today{border-left-color:var(--blue)}.task-top{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}.handle{color:var(--text3);font-size:14px;line-height:1;letter-spacing:-2px;user-select:none;margin-top:2px}.task-title{font-size:13px;font-weight:700;line-height:1.42;flex:1;word-break:keep-all}.task-actions{display:flex;gap:2px}.icon-btn{border:none;background:transparent;color:var(--text3);font-size:13px;cursor:pointer;line-height:1;padding:2px}.icon-btn:hover{color:var(--text)}.task-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:5px}.chip{font-size:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:999px;padding:1px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip.project{font-weight:700}.chip.high{background:#fee2e2;color:#991b1b;border-color:#fecaca}.chip.today{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}.chip.due-urgent{background:#fecaca;color:#991b1b;border-color:#fca5a5}.chip.due-soon{background:#fde68a;color:#854d0e;border-color:#fcd34d}.chip.due-normal{background:var(--surface);color:var(--text2)}.chip.due-over{background:var(--text);color:var(--bg);border-color:var(--text)}.task-note{font-size:11px;color:var(--text2);line-height:1.35;margin-top:7px;white-space:pre-wrap;border-top:1px dashed var(--border);padding-top:7px}.column-empty{font-size:12px;color:var(--text3);font-style:italic;padding:12px;text-align:center;border:1px dashed var(--border);border-radius:10px;margin:2px}
.project-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.project-pill{font-size:11px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 9px;color:var(--text2);cursor:pointer}.project-pill:hover,.project-pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.logged-out{padding:28px}.logged-out h2{font-size:18px}.logged-out p{color:var(--text2);margin:8px 0 16px}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:460px}.modal h3{font-size:16px;margin-bottom:12px}.modal label{display:block;font-size:11px;color:var(--text2);margin:10px 0 4px}.modal input,.modal select,.modal textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 10px;outline:none}.modal textarea{min-height:82px;resize:vertical}.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.save-toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);border-radius:10px;padding:8px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120}.save-toast.show{opacity:1}
@media(max-width:860px){.header{padding:10px 12px}.header-actions .btn{font-size:11px;padding:5px 8px}.logo span{display:none}.mode-pill{display:none}.main{padding:14px 12px 80px}.focus-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.toolbar-left{width:100%}.search{min-width:0;flex:1}.kanban{display:flex;min-width:0;gap:10px}.column{min-width:82vw;min-height:500px}.board-wrap{margin-left:-2px;padding-left:2px}.auth-note{display:none}.modal-row{grid-template-columns:1fr}}
@media print{.header,.toolbar,.project-strip,.save-toast,.modal-overlay,.task-actions{display:none!important}.main{padding:0}.focus,.column,.task-card{box-shadow:none;break-inside:avoid}.board-wrap{overflow:visible}.kanban{display:grid;grid-template-columns:repeat(3,1fr);min-width:0}.column{min-height:auto}.column-cards{min-height:auto}.task-card{page-break-inside:avoid}}

<body>
<div class="header">
  <div class="brand"><img class="logo-mark" src="bunnar_work_icon.svg?v=20260517-trello" alt="BUNNAR WORK"><div><span class="logo">BUNNAR <span>· Trello Flow Dashboard</span></span><span class="mode-pill">FLOW</span></div></div>
  <div class="header-actions">
    <button class="btn" onclick="window.print()">🖨️ 프린트</button>
    <button class="btn" onclick="exportData()">📤 내보내기</button>
    <button class="btn" onclick="triggerImport()">📥 가져오기</button>
    <button class="btn" id="loginBtn" onclick="login()">🔐 로그인</button>
    <button class="btn" id="logoutBtn" onclick="logout()" style="display:none">로그아웃</button>
    <span class="auth-note" id="authStatus" style="display:none"></span>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="main">
  <div id="loggedOut" class="panel logged-out" style="display:none">
    <h2>로그인이 필요합니다.</h2>
    <p>기존 Firebase 문서에 연결됩니다. 회사·집·모바일에서 같은 데이터를 보려면 구글 로그인을 해주세요.</p>
    <button class="btn btn-primary" onclick="login()">구글 로그인</button>
  </div>

  <div id="app" style="display:none">
    <section class="panel focus">
      <div class="focus-head">
        <div>
          <h1>일의 흐름을 왼쪽에서 오른쪽으로 봅니다.</h1>
          <p>마인드맵처럼 프로젝트 맥락을 유지하고, 트렐로처럼 카드를 옮기며 우선순위를 조정합니다.</p>
        </div>
        <div class="today" id="todayDate"></div>
      </div>
      <div class="focus-grid">
        <div class="focus-col"><h3>🔴 오늘/중요</h3><div id="focusPriority"></div></div>
        <div class="focus-col"><h3>➡️ 다음 행동</h3><div id="focusNext"></div></div>
        <div class="focus-col"><h3>🟡 대기 중</h3><div id="focusWaiting"></div></div>
      </div>
      <div class="statline" id="statLine"></div>
    </section>

    <div class="toolbar">
      <div>
        <div class="section-title">Trello Flow Board <span class="count" id="cardCount">0개 카드</span></div>
        <p>카드는 좌우로 옮기고, 같은 열 안에서는 위아래 순서가 곧 우선순위입니다.</p>
      </div>
      <div class="toolbar-left">
        <input class="search" id="searchInput" placeholder="검색: 고객명, 지원사업, 메모" oninput="renderBoard()">
        <select class="select" id="projectFilter" onchange="renderBoard()"><option value="all">모든 프로젝트</option></select>
        <button class="btn" onclick="createCardsFromCurrentBoard(false)">기존 보드 가져오기</button>
        <button class="btn btn-primary" onclick="openCardModal()">+ 카드</button>
      </div>
    </div>

    <div class="project-strip" id="projectStrip"></div>
    <div class="board-wrap"><div class="kanban" id="kanban"></div></div>
  </div>
</div>

<div class="modal-overlay" id="cardModal" onclick="closeCardModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">카드 추가</h3>
    <input type="hidden" id="editCardId">
    <label>카드 제목</label>
    <input type="text" id="cardTitle" placeholder="예: 독일 바이어 샘플 팔로업">
    <div class="modal-row">
      <div><label>프로젝트 / 가지</label><input type="text" id="cardProject" placeholder="예: 해외 B2B"></div>
      <div><label>현재 단계</label><select id="cardColumn"></select></div>
    </div>
    <div class="modal-row">
      <div><label>마감일</label><input type="date" id="cardDue"></div>
      <div><label>중요도</label><select id="cardPriority"><option value="normal">보통</option><option value="today">오늘</option><option value="high">중요</option></select></div>
    </div>
    <label>메모</label>
    <textarea id="cardNote" placeholder="다음 행동, 연락할 사람, 참고 링크"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeCardModalDirect()">취소</button>
      <button class="btn btn-danger" id="deleteCardBtn" onclick="deleteEditingCard()" style="display:none">삭제</button>
      <button class="btn btn-primary" onclick="saveCardFromModal()">저장</button>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">✓ 저장됨</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY='bunnar_trello_flow_dashboard_v1';
const COLUMNS=[
  {id:'pool',title:'풀 / 생각',sub:'정리 전·언젠가',color:'var(--text3)'},
  {id:'next',title:'다음 행동',sub:'가장 먼저 움직일 일',color:'var(--blue)'},
  {id:'doing',title:'진행중',sub:'지금 실제로 하고 있는 일',color:'var(--green)'},
  {id:'waiting',title:'대기 / 확인',sub:'회신·심사·외부 응답',color:'var(--amber)'},
  {id:'done',title:'완료',sub:'끝난 일',color:'var(--green)'},
  {id:'parked',title:'나중에',sub:'지금 안 해도 되는 일',color:'var(--text)'}
];
const COL_MAP={
  '지금당장':'next','수행중':'doing','진행중':'doing','심사중':'waiting','신청완료':'waiting','예정':'pool','완료':'done','탈락':'parked'
};
const firebaseConfig={apiKey:"AIzaSyBGBDywtb_UQwewBObvTSVxiXTTLDZQd2w",authDomain:"bunnar-dashboard.firebaseapp.com",projectId:"bunnar-dashboard",storageBucket:"bunnar-dashboard.firebasestorage.app",messagingSenderId:"170038311346",appId:"1:170038311346:web:59e4eb30f65961aab80cab",measurementId:"G-TDR9PS981E"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const DASHBOARD_DOC=db.collection('dashboards').doc('bunnar-main');
let DATA=[];let QUICK=[];let FLOWS=[];let TRELLO=[];let unsubscribeDashboard=null;let suppressSnapshot=false;let activeProject='all';let draggedCardId=null;
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function daysUntil(d){if(!d)return null;const t=new Date(todayISO()+'T00:00:00');const due=new Date(d+'T00:00:00');return Math.round((due-t)/86400000)}
function dueLabel(d){const n=daysUntil(d);if(n===null)return null;if(n<0)return{cls:'due-over',text:`D+${Math.abs(n)}`};if(n===0)return{cls:'due-urgent',text:'D-DAY'};if(n<=3)return{cls:'due-urgent',text:`D-${n}`};if(n<=7)return{cls:'due-soon',text:`D-${n}`};return{cls:'due-normal',text:`D-${n}`}}
function escapeHtml(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getLocalBackup(){try{const saved=localStorage.getItem(KEY);return saved?JSON.parse(saved):null}catch(e){return null}}
function setLocalBackup(){try{localStorage.setItem(KEY,JSON.stringify({items:DATA,quickTasks:QUICK,flows:FLOWS,trelloCards:TRELLO}))}catch(e){}}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>t.classList.remove('show'),1400)}
function normalizeCard(c,i=0){return{ id:c.id||uid('card'), title:c.title||c.n||'새 카드', project:c.project||c.catLabel||c.category||'미분류', column:c.column||COL_MAP[c.s]||'pool', due:c.due||'', note:c.note||c.notes||'', priority:c.priority||((c.s==='지금당장'||c.today)?'today':'normal'), order:Number.isFinite(c.order)?c.order:i, source:c.source||'' }}
function cardsFromItems(items){const cards=[];(items||[]).forEach(cat=>{(cat.items||[]).forEach((it,i)=>cards.push(normalizeCard({id:'from_'+(cat.id||uid('cat'))+'_'+i,title:it.n,project:cat.label,column:COL_MAP[it.s]||'pool',due:it.due||'',note:it.notes||it.note||'',priority:it.s==='지금당장'?'today':'normal',source:'items',order:i},cards.length)))});return cards}
function cardsFromFlows(flows){const cards=[];(flows||[]).forEach(flow=>{(flow.nodes||[]).forEach((node,i)=>{let col='pool';if(node.status==='done')col='done';else if(node.status==='waiting')col='waiting';else if(node.status==='ready')col='next';else if(node.status==='blocked')col='pool';cards.push(normalizeCard({id:'node_'+node.id,title:node.label,project:flow.title,column:col,due:node.due||'',note:node.note||'',priority:col==='next'?'today':'normal',source:'flows',order:i},cards.length))})});return cards}
async function loadData(){try{const snap=await DASHBOARD_DOC.get();if(snap.exists){const d=snap.data();DATA=Array.isArray(d.items)?d.items:[];QUICK=Array.isArray(d.quickTasks)?d.quickTasks:[];FLOWS=Array.isArray(d.flows)?d.flows:[];if(Array.isArray(d.trelloCards)&&d.trelloCards.length){TRELLO=d.trelloCards.map(normalizeCard)}else{TRELLO=cardsFromItems(DATA);if(!TRELLO.length)TRELLO=cardsFromFlows(FLOWS);if(TRELLO.length)await saveTrelloOnly()}setLocalBackup();return}}catch(e){console.error(e);alert('데이터 불러오기에 실패했습니다. 로그인 상태나 Firebase 보안 규칙을 확인해 주세요. 로컬 백업을 표시합니다.')}const local=getLocalBackup();DATA=Array.isArray(local?.items)?local.items:[];QUICK=Array.isArray(local?.quickTasks)?local.quickTasks:[];FLOWS=Array.isArray(local?.flows)?local.flows:[];TRELLO=Array.isArray(local?.trelloCards)?local.trelloCards.map(normalizeCard):cardsFromItems(DATA)}
async function saveTrelloOnly(){setLocalBackup();if(!auth.currentUser){showToast();return}try{suppressSnapshot=true;await DASHBOARD_DOC.set({trelloCards:TRELLO,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email||''},{merge:true});showToast()}catch(e){console.error(e);alert('저장에 실패했습니다. 로그인 상태나 Firebase 보안 규칙을 확인해 주세요.')}}
async function saveAll(){setLocalBackup();if(!auth.currentUser){showToast();return}try{suppressSnapshot=true;await DASHBOARD_DOC.set({items:DATA,quickTasks:QUICK,flows:FLOWS,trelloCards:TRELLO,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email||''},{merge:true});showToast()}catch(e){console.error(e);alert('저장에 실패했습니다.')}}
function login(){const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(provider).catch(err=>{console.error(err);if(err.code==='auth/popup-blocked'||err.code==='auth/cancelled-popup-request'){auth.signInWithRedirect(provider);return}alert('로그인에 실패했습니다.')})}
function logout(){auth.signOut()}
auth.onAuthStateChanged(async user=>{document.getElementById('loginBtn').style.display=user?'none':'inline-flex';document.getElementById('logoutBtn').style.display=user?'inline-flex':'none';document.getElementById('authStatus').style.display=user?'inline':'none';document.getElementById('authStatus').textContent=user?`로그인: ${user.email||''}`:'';if(unsubscribeDashboard){unsubscribeDashboard();unsubscribeDashboard=null}if(!user){document.getElementById('app').style.display='none';document.getElementById('loggedOut').style.display='block';return}document.getElementById('loggedOut').style.display='none';document.getElementById('app').style.display='block';await loadData();renderAll();unsubscribeDashboard=DASHBOARD_DOC.onSnapshot(snap=>{if(suppressSnapshot){suppressSnapshot=false;return}if(!snap.exists)return;const d=snap.data();DATA=Array.isArray(d.items)?d.items:DATA;QUICK=Array.isArray(d.quickTasks)?d.quickTasks:QUICK;FLOWS=Array.isArray(d.flows)?d.flows:FLOWS;if(Array.isArray(d.trelloCards))TRELLO=d.trelloCards.map(normalizeCard);setLocalBackup();renderAll()},err=>console.error(err))});
function filteredCards(){const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();const pf=document.getElementById('projectFilter')?.value||activeProject||'all';return TRELLO.filter(c=>{if(pf!=='all'&&c.project!==pf)return false;if(q){const hay=[c.title,c.project,c.note,c.column].join(' ').toLowerCase();if(!hay.includes(q))return false}return true})}
function sorted(list){return [...list].sort((a,b)=>(a.order||0)-(b.order||0))}
function renderAll(){renderFocus();renderProjectControls();renderBoard()}
function renderProjectControls(){const projects=[...new Set(TRELLO.map(c=>c.project||'미분류'))].sort();const select=document.getElementById('projectFilter');const current=select.value||'all';select.innerHTML='<option value="all">모든 프로젝트</option>'+projects.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');select.value=projects.includes(current)?current:'all';const strip=document.getElementById('projectStrip');strip.innerHTML=`<button class="project-pill ${select.value==='all'?'on':''}" onclick="setProjectFilter('all')">전체</button>`+projects.map(p=>`<button class="project-pill ${select.value===p?'on':''}" onclick="setProjectFilter('${escapeHtml(p).replace(/'/g,'&#39;')}')">${escapeHtml(p)}</button>`).join('')}
function setProjectFilter(p){document.getElementById('projectFilter').value=p;renderBoard();renderProjectControls()}
function renderFocus(){document.getElementById('todayDate').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const all=sorted(TRELLO);const priority=all.filter(c=>c.priority==='high'||c.priority==='today'||(c.due&&daysUntil(c.due)<=3&&c.column!=='done')).slice(0,6);const next=all.filter(c=>c.column==='next').slice(0,6);const waiting=all.filter(c=>c.column==='waiting').slice(0,6);document.getElementById('focusPriority').innerHTML=priority.length?priority.map(focusItem).join(''):'<div class="empty">오늘/중요 카드가 없습니다.</div>';document.getElementById('focusNext').innerHTML=next.length?next.map(focusItem).join(''):'<div class="empty">다음 행동 열이 비어 있습니다.</div>';document.getElementById('focusWaiting').innerHTML=waiting.length?waiting.map(focusItem).join(''):'<div class="empty">대기 중인 카드가 없습니다.</div>';const done=TRELLO.filter(c=>c.column==='done').length;document.getElementById('statLine').innerHTML=`<span>카드 ${TRELLO.length}개</span><span>프로젝트 ${new Set(TRELLO.map(c=>c.project)).size}개</span><span>진행중 ${TRELLO.filter(c=>c.column==='doing').length}개</span><span>완료 ${done}개</span>`}
function focusItem(c){const due=c.due?dueLabel(c.due):null;return `<div class="focus-item"><span class="dot" style="background:${c.priority==='high'?'var(--red)':c.priority==='today'?'var(--blue)':'var(--text3)'}"></span><div><strong>${escapeHtml(c.title)}</strong><small>${escapeHtml(c.project)}${due?' · '+escapeHtml(due.text):''}</small></div></div>`}
function renderBoard(){const board=document.getElementById('kanban');const cards=filteredCards();document.getElementById('cardCount').textContent=`${cards.length}개 카드`;board.innerHTML=COLUMNS.map(col=>{const list=sorted(cards.filter(c=>c.column===col.id));return `<section class="column" data-col="${col.id}" ondragover="onColumnDragOver(event,'${col.id}')" ondrop="onColumnDrop(event,'${col.id}')" ondragleave="this.classList.remove('drag-over')"><div class="column-head"><span class="column-dot" style="background:${col.color}"></span><div><div class="column-title">${escapeHtml(col.title)}</div><div class="column-sub">${escapeHtml(col.sub)}</div></div><div class="column-count">${list.length}</div></div><div class="column-cards">${list.length?list.map(renderCard).join(''):'<div class="column-empty">여기에 카드를 드래그하세요.</div>'}</div></section>`}).join('')}
function renderCard(c){const due=c.due?dueLabel(c.due):null;const pClass=c.priority==='high'?'priority-high':c.priority==='today'?'priority-today':'';return `<article class="task-card ${pClass}" draggable="true" data-id="${c.id}" ondragstart="onCardDragStart(event,'${c.id}')" ondragend="onCardDragEnd(event)" ondragover="onCardDragOver(event,'${c.id}')" ondragleave="onCardDragLeave(event)" ondrop="onCardDrop(event,'${c.id}')"><div class="task-top"><span class="handle">⋮⋮</span><div class="task-title" ondblclick="quickEditTitle(event,'${c.id}')">${escapeHtml(c.title)}</div><div class="task-actions"><button class="icon-btn" title="중요/오늘" onclick="togglePriority(event,'${c.id}')">${c.priority==='high'?'★':c.priority==='today'?'●':'○'}</button><button class="icon-btn" title="수정" onclick="openCardModal('${c.id}')">✎</button></div></div><div class="task-meta"><span class="chip project">${escapeHtml(c.project||'미분류')}</span>${c.priority==='high'?'<span class="chip high">중요</span>':''}${c.priority==='today'?'<span class="chip today">오늘</span>':''}${due?`<span class="chip ${due.cls}">${due.text}</span>`:''}</div>${c.note?`<div class="task-note">${escapeHtml(c.note)}</div>`:''}</article>`}
function onCardDragStart(e,id){draggedCardId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function onCardDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-above,.drop-below,.drag-over').forEach(el=>el.classList.remove('drop-above','drop-below','drag-over'));draggedCardId=null}
function onColumnDragOver(e,col){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function onColumnDrop(e,col){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain')||draggedCardId;if(!id)return;moveCard(id,col,null,false)}
function onCardDragOver(e,targetId){e.preventDefault();const card=e.currentTarget;if(card.dataset.id===draggedCardId)return;const rect=card.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;card.classList.remove('drop-above','drop-below');card.classList.add(after?'drop-below':'drop-above')}
function onCardDragLeave(e){e.currentTarget.classList.remove('drop-above','drop-below')}
function onCardDrop(e,targetId){e.preventDefault();e.stopPropagation();const id=e.dataTransfer.getData('text/plain')||draggedCardId;if(!id||id===targetId)return;const target=TRELLO.find(c=>c.id===targetId);if(!target)return;const rect=e.currentTarget.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;moveCard(id,target.column,targetId,after)}
function moveCard(id,targetCol,targetId=null,after=false){const moved=TRELLO.find(c=>c.id===id);if(!moved)return;const oldCol=moved.column;moved.column=targetCol;const targetList=sorted(TRELLO.filter(c=>c.column===targetCol&&c.id!==id));let insertAt=targetList.length;if(targetId){const idx=targetList.findIndex(c=>c.id===targetId);if(idx>=0)insertAt=idx+(after?1:0)}targetList.splice(insertAt,0,moved);targetList.forEach((c,i)=>c.order=i);if(oldCol!==targetCol){sorted(TRELLO.filter(c=>c.column===oldCol)).forEach((c,i)=>c.order=i)}saveTrelloOnly();renderAll()}
function togglePriority(ev,id){ev.stopPropagation();const c=TRELLO.find(x=>x.id===id);if(!c)return;c.priority=c.priority==='normal'?'today':c.priority==='today'?'high':'normal';saveTrelloOnly();renderAll()}
function quickEditTitle(ev,id){ev.preventDefault();ev.stopPropagation();const c=TRELLO.find(x=>x.id===id);if(!c)return;const v=prompt('카드 제목 수정:',c.title);if(v===null)return;const t=v.trim();if(!t)return;c.title=t;saveTrelloOnly();renderAll()}
function openCardModal(id=null){const isEdit=!!id;const c=isEdit?TRELLO.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=isEdit?'카드 수정':'카드 추가';document.getElementById('editCardId').value=isEdit?id:'';document.getElementById('cardTitle').value=c?.title||'';document.getElementById('cardProject').value=c?.project||'';document.getElementById('cardDue').value=c?.due||'';document.getElementById('cardPriority').value=c?.priority||'normal';document.getElementById('cardNote').value=c?.note||'';document.getElementById('deleteCardBtn').style.display=isEdit?'inline-flex':'none';const colSel=document.getElementById('cardColumn');colSel.innerHTML=COLUMNS.map(col=>`<option value="${col.id}">${col.title}</option>`).join('');colSel.value=c?.column||'next';document.getElementById('cardModal').style.display='flex';document.getElementById('cardTitle').focus()}
function closeCardModal(e){if(e.target.id==='cardModal')closeCardModalDirect()}
function closeCardModalDirect(){document.getElementById('cardModal').style.display='none'}
function saveCardFromModal(){const id=document.getElementById('editCardId').value;const title=document.getElementById('cardTitle').value.trim();if(!title){alert('카드 제목을 입력하세요.');return}const obj={title,project:document.getElementById('cardProject').value.trim()||'미분류',column:document.getElementById('cardColumn').value,due:document.getElementById('cardDue').value,note:document.getElementById('cardNote').value.trim(),priority:document.getElementById('cardPriority').value};if(id){const c=TRELLO.find(x=>x.id===id);if(!c)return;Object.assign(c,obj)}else{const list=sorted(TRELLO.filter(c=>c.column===obj.column));TRELLO.push({...obj,id:uid('card'),order:list.length,source:'manual'})}closeCardModalDirect();saveTrelloOnly();renderAll()}
function deleteEditingCard(){const id=document.getElementById('editCardId').value;if(!id)return;if(!confirm('이 카드를 삭제할까요?'))return;TRELLO=TRELLO.filter(c=>c.id!==id);closeCardModalDirect();saveTrelloOnly();renderAll()}
function createCardsFromCurrentBoard(confirmFirst=true){if(confirmFirst&&!confirm('기존 업무 현황판 항목을 Trello 카드로 다시 가져올까요? 이미 있는 카드는 유지됩니다.'))return;const incoming=cardsFromItems(DATA);const existingTitles=new Set(TRELLO.map(c=>(c.project+'::'+c.title).toLowerCase()));incoming.forEach(c=>{if(!existingTitles.has((c.project+'::'+c.title).toLowerCase()))TRELLO.push(c)});saveTrelloOnly();renderAll()}
function exportData(){const payload={items:DATA,quickTasks:QUICK,flows:FLOWS,trelloCards:TRELLO,exportedAt:new Date().toISOString(),source:'bunnar-trello-flow'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bunnar-trello-flow-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function triggerImport(){document.getElementById('importFile').click()}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=function(ev){try{const p=JSON.parse(ev.target.result);if(Array.isArray(p.trelloCards))TRELLO=p.trelloCards.map(normalizeCard);if(Array.isArray(p.items))DATA=p.items;if(Array.isArray(p.quickTasks))QUICK=p.quickTasks;if(Array.isArray(p.flows))FLOWS=p.flows;saveAll();renderAll();alert('가져오기 완료!')}catch(err){alert('올바른 JSON 파일이 아닙니다.')}};r.readAsText(file);e.target.value=''}
</script>
</body>
