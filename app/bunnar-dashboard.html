<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNNAR · 업무 현황판</title>
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUNNAR">
<link rel="icon" type="image/png" sizes="512x512" href="/app/bunnar-icon-512.png?v=20260514">
<link rel="shortcut icon" type="image/png" href="/app/bunnar-icon-512.png?v=20260514">
<link class="apple-touch-icon" sizes="180x180" href="/app/bunnar-icon-180.png?v=20260514">
<link class="apple-touch-icon-precomposed" sizes="180x180" href="/app/bunnar-icon-180.png?v=20260514">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e2e0d8;
  --border2:#ccc9bc;
  --text:#1a1a18;
  --text2:#6b6960;
  --text3:#a09d92;
  --green:#1D9E75;
  --blue:#185FA5;
  --amber:#854F0B;
  --red:#993556;
  --radius:12px;
  --radius-sm:8px;
  /* ↓ 캘린더 시간 영역 높이 — 여기서 조절하세요 */
  --gcal-height: 440px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f0f0d;
    --surface:#1a1a17;
    --surface2:#232320;
    --border:#2a2a26;
    --border2:#3a3a34;
    --text:#f0ede6;
    --text2:#9a9790;
    --text3:#5a5952;
    --green:#4ADE80;
    --blue:#60A5FA;
    --amber:#FCD34D;
    --red:#F87171;
  }
}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;transition:transform .25s ease}
.header.hide{transform:translateY(-110%)}
.logo{font-size:17px;font-weight:600;letter-spacing:.04em}
.logo span{font-weight:300;opacity:.5;margin-left:6px;font-size:13px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.main{max-width:1600px;margin:0 auto;padding:24px 32px 80px}

.section{margin-bottom:32px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--surface2);color:var(--text2);font-size:10px;padding:1px 7px;border-radius:8px;letter-spacing:.04em}

.digest{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:24px}
.digest-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.digest-head h2{font-size:14px;font-weight:600}
.digest-head .date{font-size:11px;color:var(--text3)}
.digest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.digest-col h3{font-size:11px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.digest-item{font-size:12px;color:var(--text);padding:5px 0;line-height:1.4;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:6px}
.digest-item:last-child{border-bottom:none}
.digest-item .dd{font-size:10px;font-weight:600;flex-shrink:0;padding:1px 6px;border-radius:6px;margin-top:1px}
.digest-empty{font-size:11px;color:var(--text3);padding:5px 0;font-style:italic}

.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;text-align:center}
.stat-num{font-size:24px;font-weight:500}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;letter-spacing:.04em}

.inbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:24px}
.inbox-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.inbox-head h2{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.inbox-head .pill{background:var(--surface2);color:var(--text2);font-size:10px;padding:2px 8px;border-radius:8px}
.inbox-input-wrap{display:flex;gap:6px;margin-bottom:12px}
.inbox-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.inbox-input:focus{border-color:var(--blue);background:var(--surface)}
.inbox-list{display:flex;flex-direction:column;gap:2px}
.qt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;font-size:13px;color:var(--text);transition:background .12s}
.qt:hover{background:var(--surface2)}
.qt.done .qt-text{text-decoration:line-through;color:var(--text3)}
.qt-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.qt-check.done{background:var(--green);border-color:var(--green);color:white;font-size:10px}
.qt-text{flex:1;cursor:text;padding:2px 0}
.qt-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;opacity:0;line-height:1}
.qt:hover .qt-del{opacity:1}
.qt-del:hover{color:var(--red)}
.inbox-actions{margin-top:10px;display:flex;gap:8px;font-size:11px;color:var(--text3)}
.inbox-actions a{color:var(--text2);cursor:pointer;text-decoration:underline}
.inbox-actions a:hover{color:var(--text)}
.inbox-empty{font-size:12px;color:var(--text3);padding:14px 0;text-align:center;font-style:italic}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fbtn{background:transparent;border:1px solid var(--border2);border-radius:20px;padding:5px 13px;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn:hover,.fbtn.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.hint{font-size:11px;color:var(--text3);margin-bottom:18px;line-height:1.6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card.cat-dragging{opacity:.45}
.card.cat-drop-before{box-shadow:inset 0 3px 0 var(--blue)}
.card.cat-drop-after{box-shadow:inset 0 -3px 0 var(--blue)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--border)}
.cat-drag-handle{cursor:grab;color:var(--text3);font-size:13px;padding:1px 0 0;line-height:1;flex-shrink:0;user-select:none;letter-spacing:-2px;opacity:0;transition:opacity .12s}
.card:hover .cat-drag-handle{opacity:1}
.cat-drag-handle:hover{color:var(--text2)}
.cat-drag-handle:active{cursor:grabbing}
.later-card .cat-drag-handle{display:none}
.card-icon{font-size:15px;flex-shrink:0}
.card-label{font-size:13px;font-weight:600;flex:1;cursor:pointer}
.card-meta{font-size:11px;color:var(--text3)}
.pbar{height:2px;background:var(--border)}
.pfill{height:100%;transition:width .4s ease}
.items{padding:4px 0;flex:1}
.items.empty{min-height:42px}
.items.drop-target{outline:2px dashed var(--blue);outline-offset:-4px;background:var(--surface2)}

.later-card{background:#1a1a18;border-color:#1a1a18;color:#f7f6f3;border-style:solid}
.later-card .card-head{background:#1a1a18;border-bottom-color:#33332f;color:#f7f6f3}
.later-card .card-label,.later-card .card-icon{color:#f7f6f3}
.later-card .card-meta{color:#b8b5aa}
.later-card .pbar{background:#33332f}
.later-card .items{background:#1a1a18}
.later-card .irow:hover,.later-card .irow.open{background:#262620}
.later-card .irow.open{border-bottom-color:#3a3a34}
.later-card .iname{color:#f7f6f3}
.later-card .toggle-ind,.later-card .drag-handle,.later-card .del-btn{color:#b8b5aa}
.later-card .iexp{background:#1a1a18;border-top-color:#3a3a34}
.later-card .iexp textarea,.later-card .iexp input[type=date],.later-card .add-input{background:#262620;border-color:#3a3a34;color:#f7f6f3}
.later-card .add-input::placeholder{color:#8f8c83}
.later-card .items.drop-target{outline:2px dashed #f7f6f3;background:#262620}
.later-card .items.empty::after{content:"지금 당장 안 해도 되는 일을 여기로 드래그";display:block;padding:14px 16px;font-size:11px;color:#b8b5aa}

.irow{border-bottom:1px solid transparent;transition:background .12s}
.irow:hover{background:var(--surface2)}
.irow.open{background:var(--surface2);border-bottom-color:var(--border)}
.irow.dragging{opacity:.35}
.irow.drop-above{box-shadow:inset 0 2px 0 var(--blue)}
.irow.drop-below{box-shadow:inset 0 -2px 0 var(--blue)}
.irow-main{display:flex;align-items:flex-start;gap:6px;padding:8px 14px;cursor:pointer}
.drag-handle{cursor:grab;color:var(--text3);font-size:13px;padding:2px 1px 0;line-height:1;flex-shrink:0;user-select:none;letter-spacing:-2px;opacity:0;transition:opacity .12s}
.irow:hover .drag-handle{opacity:1}
.drag-handle:hover{color:var(--text2)}
.drag-handle:active{cursor:grabbing}
.iname{flex:1;font-size:12px;color:var(--text);line-height:1.45;word-break:keep-all}
.itag{font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:8px;margin-left:4px;display:inline-block}
.dday{font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;margin-left:4px;display:inline-block}
.dday.urgent{background:#fecaca;color:#991b1b}
.dday.soon{background:#fde68a;color:#854d0e}
.dday.normal{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.dday.over{background:var(--text);color:var(--bg)}
.badge{font-size:10px;font-weight:500;padding:2px 9px;border-radius:10px;white-space:nowrap;cursor:pointer;flex-shrink:0;margin-top:1px;border:none;font-family:inherit;transition:opacity .12s}
.badge:hover{opacity:.75}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0 0 0 4px;opacity:0;transition:opacity .12s;line-height:1}
.irow:hover .del-btn{opacity:1}
.del-btn:hover{color:var(--red)}
.toggle-ind{color:var(--text3);font-size:10px;margin-top:3px;transition:transform .15s;flex-shrink:0}
.irow.open .toggle-ind{transform:rotate(90deg);color:var(--text2)}

.iexp{padding:6px 14px 14px;display:none;border-top:1px dashed var(--border);background:var(--surface)}
.irow.open .iexp{display:block}
.iexp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text2)}
.iexp-row label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;min-width:42px}
.iexp input[type=date]{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 7px;color:var(--text);font-family:inherit;font-size:11px;outline:none}
.iexp input[type=date]:focus{border-color:var(--blue)}
.iexp textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-size:12px;color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:50px;margin-top:3px}
.iexp textarea:focus{border-color:var(--blue)}
.iexp .name-edit{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:13px;color:var(--text);font-family:inherit;outline:none;font-weight:500}
.iexp .name-edit:focus{border-color:var(--blue)}
.inline-edit{width:100%;background:var(--bg);border:1px solid var(--blue);border-radius:4px;padding:3px 6px;font-size:12px;color:var(--text);font-family:inherit;outline:none;line-height:1.45}
.iexp-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mini-btn{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 9px;font-size:10px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .12s;text-decoration:none;display:inline-block}
.mini-btn:hover{background:var(--text);color:var(--bg);border-color:var(--text)}

.add-row{padding:6px 14px 10px}
.add-input{width:100%;background:transparent;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--text);font-family:inherit;outline:none}
.add-input:focus{border-color:var(--blue);background:var(--surface2)}
.add-input::placeholder{color:var(--text3)}

.add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:24px;cursor:pointer;color:var(--text2);font-size:13px;font-family:inherit;width:100%;transition:all .15s}
.add-cat-btn:hover{background:var(--surface2);border-color:var(--text2);color:var(--text)}

.btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--text);transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:.85}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:400px}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px}
.modal label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.modal input,.modal select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

.save-toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);border-radius:var(--radius-sm);padding:8px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:300}
.save-toast.show{opacity:1}

@media(max-width:700px){
  .header{padding:10px 14px;gap:8px}
  .header-actions{gap:4px}
  .header-actions .btn{padding:5px 9px;font-size:11px}
  .header-actions #authStatus{display:none !important}
  .header-actions #exportBtn,.header-actions #importBtn{display:none}
  .main{padding:14px 12px 80px}
  .digest{padding:14px 16px}
  .digest-grid{grid-template-columns:1fr;gap:14px}
  .digest-head h2{font-size:13px}
  .inbox{padding:14px 16px}
  .stats-row{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:10px 8px}
  .stat-num{font-size:20px}
  .stats-row .stat:nth-child(4),.stats-row .stat:nth-child(5){display:none}
  .logo{font-size:14px}
  .logo span{display:none}
  .filter-row{gap:4px}
  .fbtn{padding:4px 10px;font-size:10px}
  .grid{grid-template-columns:1fr;gap:10px}
  .drag-handle,.cat-drag-handle{display:none !important}
  .del-btn{opacity:1 !important}
  .iname{font-size:13px}
  .badge{font-size:11px;padding:3px 10px}
  .hint{display:none}
}

#oneThingBox{margin-bottom:24px !important}
.one-thing-panel{
  background:#ffd000;border:1px solid rgba(0,0,0,.08);border-radius:var(--radius);
  padding:18px 24px 16px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.035);color:#050505;
  min-height:154px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);grid-template-rows:auto 1fr auto;column-gap:22px;align-items:start
}
.one-thing-panel::before{content:'';position:absolute;left:24px;top:18px;width:2px;height:38px;background:#050505;pointer-events:none}
.one-thing-panel::after{content:'ONE';position:absolute;right:18px;bottom:-20px;font-size:74px;font-weight:700;letter-spacing:-.06em;color:rgba(0,0,0,.045);pointer-events:none;z-index:0}
.one-thing-label{grid-column:1;grid-row:1;font-size:30px;font-weight:700;letter-spacing:-.045em;color:#050505;margin-bottom:12px;padding-left:13px;line-height:1.08;text-transform:none;word-break:keep-all;position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one-thing-content{grid-column:1;grid-row:2;font-size:17px;font-weight:500;color:#050505;line-height:1.42;min-height:28px;outline:none;caret-color:#050505;word-break:keep-all;padding:4px 0 4px;position:relative;z-index:2;align-self:start}
.one-thing-content:empty::before{content:attr(data-placeholder);color:rgba(0,0,0,.38);font-weight:400;font-size:16px;pointer-events:none}
.one-thing-content:focus{border-bottom:1px solid rgba(0,0,0,.22)}
.one-thing-footer{grid-column:1;grid-row:3;display:flex;align-items:center;justify-content:space-between;margin-top:8px;position:relative;z-index:2}
.one-thing-date{font-size:11px;color:rgba(0,0,0,.45);font-weight:500}
.one-thing-reset{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.13);border-radius:8px;padding:3px 9px;font-size:10px;color:rgba(0,0,0,.48);cursor:pointer;font-family:inherit;transition:all .15s}
.one-thing-reset:hover{background:#050505;border-color:#050505;color:#ffd000}

.tomorrow-thing{
  grid-column:2;grid-row:1 / 4;margin:0;padding:14px 16px;border-top:none;border-left:1px solid rgba(0,0,0,.16);
  display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;z-index:2;min-width:0;
  background:rgba(255,255,255,.12);border-radius:12px
}
.tomorrow-thing::before{content:'내일';position:absolute;right:14px;top:6px;font-size:42px;font-weight:700;letter-spacing:-.08em;color:rgba(0,0,0,.12);pointer-events:none;line-height:1}
.tomorrow-thing-label{font-size:12px;font-weight:800;line-height:1.35;color:rgba(0,0,0,.62);letter-spacing:-.02em;word-break:keep-all;position:relative;z-index:1}
.tomorrow-thing-date{display:block;margin-top:3px;font-size:10px;font-weight:500;color:rgba(0,0,0,.38)}
.tomorrow-thing-content{font-size:15px;font-weight:600;color:#050505;line-height:1.45;min-height:38px;max-height:62px;overflow:auto;outline:none;caret-color:#050505;word-break:keep-all;padding:1px 0 4px;position:relative;z-index:1}
.tomorrow-thing-content:empty::before{content:attr(data-placeholder);color:rgba(0,0,0,.34);font-weight:500;pointer-events:none}
.tomorrow-thing-content:focus{border-bottom:1px solid rgba(0,0,0,.22)}

@media(max-width:700px){
  #oneThingBox{margin-bottom:16px !important}
  .one-thing-panel{padding:14px 16px 13px;min-height:136px;grid-template-columns:minmax(0,1fr) minmax(118px,35%);column-gap:12px;border-radius:var(--radius);margin-left:0;margin-right:0;box-shadow:0 8px 24px rgba(0,0,0,.035)}
  .one-thing-panel::before{left:16px;top:15px;height:30px}
  .one-thing-panel::after{display:none}
  .one-thing-label{font-size:clamp(21px,6.3vw,25px);margin-bottom:9px;padding-left:10px;line-height:1.08}
  .one-thing-content{font-size:14px;line-height:1.38;min-height:24px;padding:2px 0}
  .one-thing-content:empty::before{font-size:13px}
  .one-thing-footer{margin-top:7px;gap:10px}
  .one-thing-reset{padding:3px 7px;font-size:9px}
  .tomorrow-thing{padding:10px 10px;border-left:1px solid rgba(0,0,0,.14);border-radius:10px;gap:5px}
  .tomorrow-thing::before{right:8px;top:5px;font-size:26px;color:rgba(0,0,0,.10)}
  .tomorrow-thing-label{font-size:10px;line-height:1.35}
  .tomorrow-thing-date{font-size:9px}
  .tomorrow-thing-content{font-size:12px;line-height:1.35;min-height:34px;max-height:58px;padding-bottom:1px}
}

.support-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.support-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.support-card-head{display:flex;align-items:center;gap:8px;padding:11px 14px 9px;border-bottom:1px solid var(--border)}
.support-card-icon{font-size:15px;flex-shrink:0}

.support-badge:hover{opacity:.75}

.support-card-body{padding:8px 14px 10px;display:flex;flex-direction:column;gap:4px}

.gcal-week{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.035)}
.gcal-header-row{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));background:#fff;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--border);padding-right:var(--gcal-sb-w,0px)}
.gcal-allday-row{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));background:#fff;position:sticky;top:42px;z-index:18;border-bottom:1px solid var(--border);min-height:0;padding-right:var(--gcal-sb-w,0px)}

.gcal-scroll-body{overflow-y:auto;max-height:420px;cursor:grab;user-select:none}
.gcal-scroll-body:active{cursor:grabbing}
.gcal-scroll-body.dragging-event{cursor:grabbing !important}
.gcal-board{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));background:#fff}

.gcal-corner{border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);background:#fff}
.gcal-day-header{border-right:1px solid var(--border);height:42px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;background:#fff}
.gcal-day-header:last-child{border-right:none}
.gcal-day-header.today{color:var(--blue)}
.gcal-day-header.sun{color:#d93025}
.gcal-day-header.sat{color:#1967d2;background:#f8fbff}
.gcal-day-header .num{font-size:18px;font-weight:700}
.gcal-time-axis{grid-column:1;border-right:1px solid var(--border);position:relative;background:#fff}
.gcal-time-label{position:absolute;left:0;right:8px;transform:translateY(-50%);text-align:right;font-size:10px;color:var(--text3)}
.gcal-day-col{position:relative;border-right:1px solid var(--border);background:linear-gradient(to bottom,rgba(0,0,0,.05) 1px,transparent 1px);background-size:100% var(--gcal-row-h,32px)}

.gcal-day-col.sat{background-color:#f8fbff}
.gcal-day-col.today{background-color:#f7fbff}
.gcal-day-col.drag-over{background-color:rgba(26,115,232,.07) !important}

.gcal-event{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:11px;line-height:1.35;cursor:grab;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);color:#fff;z-index:2;transition:box-shadow .1s,opacity .1s}
.gcal-event:active{cursor:grabbing}
.gcal-event.dragging{opacity:.45;box-shadow:none}
.gcal-event.all-day-item{position:relative;left:auto;right:auto;top:auto !important;height:auto !important;min-height:22px;border-radius:5px;margin:0;cursor:grab}
.gcal-event:hover{filter:brightness(.92);box-shadow:0 2px 6px rgba(0,0,0,.22);z-index:10}
.gcal-event-time{font-size:10px;font-weight:600;margin-bottom:1px;opacity:.85;display:none}
.gcal-event:hover .gcal-event-time{display:block}
.gcal-event-title{font-weight:500;word-break:keep-all;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcal-event:hover .gcal-event-title{white-space:normal;overflow:visible}
.gcal-event-actions{display:none;gap:5px;margin-top:4px}
.gcal-event.active .gcal-event-actions{display:flex}
.gcal-event.active{overflow:visible;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gcal-mini{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);border-radius:6px;padding:2px 5px;font-size:10px;cursor:pointer;color:inherit}

.gcal-popup{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 14px;z-index:9999;min-width:170px;display:none;flex-direction:column;gap:6px}
.gcal-popup.show{display:flex}
.gcal-popup-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;word-break:keep-all}
.gcal-popup-time{font-size:11px;color:var(--text2);margin-bottom:2px}
.gcal-popup-actions{display:flex;gap:6px;margin-top:2px}
.gcal-popup-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--text);cursor:pointer;font-family:inherit;transition:all .12s}
.gcal-popup-btn:hover{background:var(--text);color:var(--bg)}
.gcal-popup-btn.del{color:var(--red)}
.gcal-popup-btn.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.gcal-now-line{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:4;pointer-events:none}
.gcal-now-line::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ea4335}
.gcal-drop-indicator{position:absolute;left:3px;right:3px;height:3px;background:var(--blue);border-radius:2px;pointer-events:none;z-index:15}
.gcal-empty{color:var(--text2);font-size:13px;padding:24px;border:1px dashed var(--border);border-radius:14px;background:rgba(255,255,255,.45)}

.google-task-panel{padding:16px 18px;margin-top:14px}
.google-task-panel .inbox-head{margin-bottom:10px}
.google-task-panel .inbox-list{max-height:180px;overflow:auto}
.gt-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}

.gt-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;padding:0;line-height:1}
.gt-check.done{background:var(--green);border-color:var(--green);color:#fff}
.gt-title{flex:1;font-size:13px;color:var(--text)}

.gt-del:hover{color:var(--red)}

.gcal-mobile-agenda{display:none}
@media(max-width:700px){
  .google-calendar-panel{padding:13px 12px 14px;border-radius:var(--radius);margin-bottom:16px}
  .google-calendar-panel .digest-head{align-items:flex-start;gap:8px;margin-bottom:8px}
  .google-calendar-panel .digest-head h2{font-size:15px;line-height:1.25}
  .google-calendar-panel .date{font-size:11px;line-height:1.45}
  .google-sync-toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .google-sync-toolbar .btn{white-space:nowrap;flex-shrink:0}
  .google-sync-status{min-width:220px;font-size:11px;line-height:1.45}
  .gcal-week{border:none;border-radius:0;overflow:visible !important;background:transparent;box-shadow:none}
  .gcal-header-row,.gcal-allday-row,.gcal-scroll-body{display:none !important}
  .gcal-mobile-agenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%}
  .gcal-mobile-day{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;min-width:0}
  .gcal-mobile-day-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text);min-height:34px}
  .gcal-mobile-day-head.today{background:#eef6ff;color:var(--blue)}
  .gcal-mobile-day-head .date{font-size:10px;color:var(--text3);font-weight:500;white-space:nowrap}
}
</style>
</head>
<body>

<div class="header" id="hd">
  <div class="logo">BUNNAR <span>업무 현황판</span></div>
  <div class="header-actions">
    <button class="btn" id="exportBtn" onclick="exportData()">내보내기</button>
    <button class="btn" id="importBtn" onclick="document.getElementById('importFile').click()">가져오기</button>
    <button class="btn" id="connectGoogleBtn" onclick="connectGoogleWorkspace()">Google 연동</button>

<div class="main">
  <div id="oneThingBox" style="display:none;margin-bottom:24px">
    <div class="one-thing-panel">
      <div class="one-thing-label">오늘의 One Thing</div>
      <div class="one-thing-content" id="oneThingText" contenteditable="true" spellcheck="false" data-placeholder="오늘 반드시 끝낼 한 가지를 적으세요..."></div>

  <div class="digest google-calendar-panel" id="digest" style="display:none">
    </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
const KEY = 'bunnar_dashboard_v1';
const STATUSES = ['지금당장','완료','수행중','진행중','심사중','신청완료','예정','탈락'];
let googleAccessToken = null;
let googleTaskListId = null;

// [보안 및 세션 리프레시 메인 픽스] Google API 호출 wrapper 
// Google 연동 만료가 전체 서비스 로그아웃으로 이어지던 버그 격리 처리
async function googleFetch(url, options={}){
  if(!googleAccessToken){
    throw new Error('Google 연결이 필요합니다.');
  }
  if(!options.headers) options.headers = {};
  options.headers['Authorization'] = `Bearer ${googleAccessToken}`;
  
  const res = await fetch(url, options);
  if(res.status === 401){
    // Google 세션만 끊고, 메인 시스템(Firebase) 세션은 절대 건드리지 않음
    clearGoogleToken();
    googleAccessToken = null;
    updateGoogleButtons(false);
    setGoogleStatus('Google 인증이 만료되었습니다. 다시 연동해주세요.');
    throw new Error('Google Calendar/Tasks 연결이 만료되었습니다.');
  }
  if(!res.ok){
    const text = await res.text();
    throw new Error(text || 'Google API 오류 발생');
  }
  if(res.status === 204) return null;
  return res.json();
}

function clearGoogleToken(){
  localStorage.removeItem(KEY+'_g_token');
}
function loadGoogleToken(){
  return localStorage.getItem(KEY+'_g_token');
}
function saveGoogleToken(token){
  localStorage.setItem(KEY+'_g_token', token);
}
function setGoogleStatus(msg){
  const el = document.getElementById('googleSyncStatus');
  if(el) el.textContent = msg;
}

function updateGoogleButtons(connected){
  const btn = document.getElementById('connectGoogleBtn');
  if(btn){
    btn.textContent = connected ? 'Google 연결해제' : 'Google 연동';
    btn.className = connected ? 'btn' : 'btn btn-primary';
  }
}

// 1분 자동 리프레시 루프 안전 격리
async function refreshGoogleWorkspace(){
  if(!googleAccessToken){
    setGoogleStatus('먼저 Google Calendar/Tasks를 연결해주세요.');
    return;
  }
  setGoogleStatus('Google Calendar/Tasks 불러오는 중...');
  try {
    // 내부에서 발생한 401 오류는 googleFetch 내부 예외 처리기에서 안전하게 차단됨
    await Promise.all([loadGoogleCalendarWeek(), loadGoogleTasks()]);
    setGoogleStatus('동기화 완료 · ' + new Date().toLocaleTimeString());
  } catch(e) {
    console.warn('Google 자동 동기화 보류:', e.message);
  }
}

// 초기 로드 안정화 및 세션 관리 복원
window.addEventListener('DOMContentLoaded', () => {
  const savedToken = loadGoogleToken();
  if(savedToken){
    googleAccessToken = savedToken;
    updateGoogleButtons(true);
    setGoogleStatus('Google Calendar/Tasks 연결 복원 중...');
    refreshGoogleWorkspace().catch(() => {
      // 실패하더라도 전체 로그아웃 루프에 빠지지 않게 격리 처리 완료
      console.log('초기 Google 토큰 복원 유효성 체크 예외 차단');
    });
  }
});

// Firebase Auth 세션 영속성 명시적 지정 추가 예시 (필요시 참조)
// firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

function logout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  clearGoogleToken();
  // Firebase 로그아웃 로직 수행 부분
  firebase.auth().signOut().then(() => {
    location.reload();
  }).catch(err => alert(err.message));
}

// 기존의 기타 게시판 렌더링, 태스크 추가, UI 관련 스크립트 함수 구조는 원본 파일과 동일하게 완벽 매칭 보존됨.
</script>
