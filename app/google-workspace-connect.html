<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>분나 OS · Google 연결</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#faf9f5;color:#202020;margin:0;padding:28px}main{max-width:480px;margin:8vh auto;background:white;border:1px solid #d0d7de;border-radius:10px;padding:24px}h1{font-size:23px;line-height:1.4}button{font:inherit;background:#1f2328;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}p{font-size:14px}small{display:block;color:#656d76;margin-top:20px}#status{white-space:pre-wrap}button:focus-visible{outline:3px solid #0969da;outline-offset:3px}</style></head>
<body><main><h1>분나 OS와 Google 연결</h1><p>휴대폰의 Google Tasks와 같은 계정을 선택하세요. 할 일 관리와 일정 조회 권한을 연결합니다.</p><button id="connect" disabled>Google 계정 연결</button><p id="status" role="status">Google 연결 모듈 준비 중…</p><small>연결 결과는 os.bunnar.com 작업대로만 전달합니다. 이 페이지에는 계정 토큰이나 할 일을 저장하지 않습니다.</small></main>
<script>
'use strict';
const CLIENT_ID="281308186420-orapn1qc6687or4bimjlv864ke3ed9ii.apps.googleusercontent.com";
const LEGACY_SCOPES='openid email https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar.readonly';
const params=new URLSearchParams(location.search);
const readOnly=params.get('mode')==='tasks-read';
const SCOPES=readOnly?'openid email https://www.googleapis.com/auth/tasks.readonly':LEGACY_SCOPES;
let hint='',selectAccount=!readOnly,optionsReady=!readOnly;
const state=params.get('state')||'';
const target=params.get('return_origin')||'';
const trustedOrigins=new Set(['https://os.bunnar.com','https://bunnar-control.info66.chatgpt.site']);
const validOrigin=trustedOrigins.has(target);
const validState=/^[a-zA-Z0-9_-]{16,128}$/.test(state);
const valid=validOrigin&&validState&&Boolean(window.opener);
const button=document.getElementById('connect');
const status=document.getElementById('status');
let oauth=null;
function ready(){button.disabled=!oauth||!optionsReady;}
if(readOnly){document.querySelector('h1').textContent='분나 OS · Google Tasks 조회 연결';document.querySelector('main>p').textContent='할 일 조회만 연결합니다. 분나 OS 로그인은 변경되지 않습니다.';window.addEventListener('message',event=>{if(!valid||event.origin!==target||event.source!==window.opener||event.data?.type!=='bunnar-google-options'||event.data.state!==state)return;hint=typeof event.data.hint==='string'?event.data.hint.slice(0,300):'';selectAccount=event.data.selectAccount===true;optionsReady=true;ready();});if(valid)window.opener.postMessage({type:'bunnar-google-ready',state},target);}
function show(text){status.textContent=text;}
function deliver(value){if(valid&&window.opener)window.opener.postMessage({type:'bunnar-google-token',state,...value},target);}
if(!valid){show(!validOrigin?'분나 OS 접속 주소를 확인하지 못했습니다. os.bunnar.com에서 다시 연결해 주세요.':!validState?'연결 요청이 유효하지 않습니다. 이 창을 닫고 OS에서 다시 연결해 주세요.':'브라우저에서 원래 OS 창과의 연결이 끊겼습니다. 이 창을 닫고 일반 브라우저의 OS 화면에서 다시 연결해 주세요.');}
else{
 const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;
 script.onerror=()=>show('Google 연결 모듈을 불러오지 못했습니다. 창을 닫고 다시 연결해 주세요.');
 script.onload=()=>{
  if(!window.google?.accounts?.oauth2){show('Google 연결 모듈을 확인하지 못했습니다. 다시 연결해 주세요.');return;}
  oauth=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,...(readOnly?{include_granted_scopes:false}:{}),error_callback:()=>{button.disabled=false;show('Google 로그인 창이 닫혔거나 열리지 않았습니다. 연결 버튼을 다시 눌러 주세요.');},callback:response=>{
   if(response.error||!response.access_token){show('Google 연결이 취소되었습니다.');deliver({error:'cancelled'});return;}
   if(!google.accounts.oauth2.hasGrantedAllScopes(response,...(readOnly?['https://www.googleapis.com/auth/tasks.readonly']:['https://www.googleapis.com/auth/tasks','https://www.googleapis.com/auth/calendar.readonly']))){show(readOnly?'할 일 조회 권한이 필요합니다.':'할 일과 일정 접근 권한이 필요합니다.');deliver({error:'missing_scope'});return;}
   show('연결했습니다. 작업대로 돌아가는 중…');
   deliver({token:{access_token:response.access_token,expires_in:Number(response.expires_in)||3600,scope:response.scope||''}});
  }});
  ready();show(readOnly?'아래 버튼을 눌러 Google 연결을 이어가세요.':'아래 버튼을 눌러 사용할 Google 계정을 선택하세요.');
 };
 document.head.appendChild(script);
 button.addEventListener('click',()=>{if(!oauth)return;button.disabled=true;show(readOnly?'Google 연결을 확인하고 있습니다.':'Google 계정 선택과 권한 확인을 진행해 주세요.');oauth.requestAccessToken({prompt:selectAccount?'select_account':'',...(hint?{hint}:{})});});
}
</script></body></html>
