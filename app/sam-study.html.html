<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam의 공부 대모험 🚀</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ─── Firebase 설정 (부모님이 여기에 본인 프로젝트 설정을 붙여넣으세요) ───
  const firebaseConfig = {
    apiKey: "AIzaSyBL8G5JrJyIZ25rrWSKqI79FiKXNqJvhlA",
    authDomain: "sam-study.firebaseapp.com",
    projectId: "sam-study",
    storageBucket: "sam-study.firebasestorage.app",
    messagingSenderId: "1005005180729",
    appId: "1:1005005180729:web:e1705133e388b01aed22e8",
    measurementId: "G-2ZV12VLP9B"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let userData = null;

  // ─── 기본 과목 데이터 ───
  const defaultSubjects = [
    { id:"math",   name:"만점왕 수학",    icon:"🔢", color:"#FF8C42", total:20, done:0, stickers:[] },
    { id:"hist",   name:"스토리 한국사",  icon:"🏯", color:"#E05C97", total:15, done:0, stickers:[] },
    { id:"eng",    name:"영문법",          icon:"📝", color:"#5BA8FF", total:12, done:0, stickers:[] },
    { id:"word",   name:"기초 영단어",     icon:"🔤", color:"#2EC4B6", total:20, done:0, stickers:[] },
    { id:"hanja",  name:"쉬운 급수 한자", icon:"🀄", color:"#9B5DE5", total:15, done:0, stickers:[] },
    { id:"sci",    name:"만점왕 통합본",  icon:"🔬", color:"#3BB273", total:18, done:0, stickers:[] },
  ];

  const STICKER_POOL = ["⭐","🌟","🏆","🎯","🚀","🌈","🦁","🐬","🦋","🌺","🍀","🎉","💎","🔥","✨"];

  // ─── 저장 & 로드 ───
  async function saveUserData(uid, data) {
    await setDoc(doc(db, "users", uid), data, { merge: true });
  }
  async function loadUserData(uid) {
    const snap = await getDoc(doc(db, "users", uid));
    return snap.exists() ? snap.data() : null;
  }

  // ─── UI 렌더 ───
  window.renderDashboard = function() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display  = "block";
    document.getElementById("user-name").textContent = currentUser.displayName?.split(" ")[0] + "의 공부 대모험" || "Sam의 공부 대모험";
    renderSubjects();
    renderOverallBar();
  };

  window.renderSubjects = function() {
    const list = document.getElementById("subject-list");
    list.innerHTML = "";
    userData.subjects.forEach((s, idx) => {
      const pct = s.total > 0 ? Math.round((s.done / s.total) * 100) : 0;
      const card = document.createElement("div");
      card.className = "s-card";
      card.style.setProperty("--sc", s.color);
      card.style.animationDelay = (idx * 0.07) + "s";
      card.innerHTML = `
        <div class="sc-top">
          <span class="sc-icon">${s.icon}</span>
          <div class="sc-info">
            <div class="sc-name">${s.name}</div>
            <div class="sc-meta">${s.done} / ${s.total} 강 완료</div>
          </div>
          <div class="sc-pct">${pct}%</div>
        </div>
        <div class="track-wrap">
          <div class="track-bg">
            <div class="track-fill" style="width:${pct}%">
              <div class="runner" title="달리는 Sam!">🏃</div>
            </div>
            <div class="track-flags">
              ${[25,50,75,100].map(f=>`<div class="flag" style="left:${f}%">${f===100?'🏁':'·'}</div>`).join('')}
            </div>
          </div>
        </div>
        <div class="sc-stickers">${(s.stickers||[]).map(st=>`<span class="stk">${st}</span>`).join('')}</div>
        <div class="sc-actions">
          <button class="btn-done" onclick="markDone(${idx})">✅ 1강 완료!</button>
          <button class="btn-undo" onclick="undoDone(${idx})" ${s.done===0?'disabled':''}>↩</button>
          <button class="btn-sticker" onclick="addSticker(${idx})">🎁 스티커</button>
          ${s.done===s.total && s.total>0 ? `<span class="badge-complete">🏆 완주!</span>` : ''}
        </div>`;
      list.appendChild(card);
    });
  };

  window.renderOverallBar = function() {
    const total = userData.subjects.reduce((a,s)=>a+s.total,0);
    const done  = userData.subjects.reduce((a,s)=>a+s.done,0);
    const pct   = total>0 ? Math.round((done/total)*100) : 0;
    document.getElementById("overall-fill").style.width = pct + "%";
    document.getElementById("overall-pct").textContent = pct + "%";
    document.getElementById("overall-done").textContent = done + "강";
    // streak
    const today = new Date().toDateString();
    const last  = userData.lastStudyDate;
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if (last === today) {
      // already counted
    } else if (last === yesterday) {
      userData.streak = (userData.streak||0) + 1;
      userData.lastStudyDate = today;
    }
    document.getElementById("streak-count").textContent = (userData.streak||0);
    renderMiniCalendar();
  };

  window.renderMiniCalendar = function() {
    const cal = document.getElementById("mini-cal");
    const log = userData.studyLog || {};
    cal.innerHTML = "";
    for(let i=6;i>=0;i--) {
      const d = new Date(Date.now() - i*86400000);
      const key = d.toDateString();
      const div = document.createElement("div");
      div.className = "cal-day" + (log[key]?" cal-done":"");
      div.innerHTML = `<span>${['일','월','화','수','목','금','토'][d.getDay()]}</span><span>${d.getDate()}</span>`;
      cal.appendChild(div);
    }
  };

  window.markDone = async function(idx) {
    const s = userData.subjects[idx];
    if (s.done >= s.total) return;
    s.done++;
    // log today
    const today = new Date().toDateString();
    if (!userData.studyLog) userData.studyLog = {};
    userData.studyLog[today] = (userData.studyLog[today]||0)+1;
    userData.lastStudyDate = today;
    // streak
    const yesterday = new Date(Date.now()-86400000).toDateString();
    const last = userData.streak_lastDate;
    if (last === yesterday || !last) {
      userData.streak = (userData.streak||0) + (last===yesterday?0: last===today?0:0);
    }
    if (last !== today) {
      userData.streak_lastDate = today;
      if (last === yesterday) userData.streak = (userData.streak||0)+1;
      else if (!last) userData.streak = 1;
    }
    showConfetti(s.icon);
    renderSubjects();
    renderOverallBar();
    await saveUserData(currentUser.uid, userData);
  };

  window.undoDone = async function(idx) {
    const s = userData.subjects[idx];
    if (s.done <= 0) return;
    s.done--;
    renderSubjects();
    renderOverallBar();
    await saveUserData(currentUser.uid, userData);
  };

  window.addSticker = async function(idx) {
    const s = userData.subjects[idx];
    const stk = STICKER_POOL[Math.floor(Math.random()*STICKER_POOL.length)];
    if (!s.stickers) s.stickers = [];
    s.stickers.push(stk);
    showConfetti(stk);
    renderSubjects();
    await saveUserData(currentUser.uid, userData);
  };

  window.showConfetti = function(emoji) {
    const c = document.getElementById("confetti-container");
    for(let i=0;i<18;i++){
      const el = document.createElement("div");
      el.className = "conf-piece";
      el.textContent = emoji;
      el.style.left = (10+Math.random()*80)+"%";
      el.style.animationDuration = (0.8+Math.random()*0.8)+"s";
      el.style.animationDelay = (Math.random()*0.3)+"s";
      el.style.fontSize = (16+Math.random()*16)+"px";
      c.appendChild(el);
      setTimeout(()=>el.remove(), 2000);
    }
  };

  // ─── 과목 추가 모달 ───
  window.openAddModal = function() {
    document.getElementById("add-modal").style.display = "flex";
  };
  window.closeAddModal = function() {
    document.getElementById("add-modal").style.display = "none";
    document.getElementById("new-name").value = "";
    document.getElementById("new-total").value = "10";
  };
  window.addSubject = async function() {
    const name  = document.getElementById("new-name").value.trim();
    const total = parseInt(document.getElementById("new-total").value)||10;
    const icon  = document.getElementById("new-icon").value || "📚";
    if (!name) return;
    const colors = ["#FF8C42","#E05C97","#5BA8FF","#2EC4B6","#9B5DE5","#3BB273","#F4A261","#E76F51"];
    const color = colors[userData.subjects.length % colors.length];
    userData.subjects.push({ id:"c"+Date.now(), name, icon, color, total, done:0, stickers:[] });
    await saveUserData(currentUser.uid, userData);
    closeAddModal();
    renderSubjects();
    renderOverallBar();
  };

  // ─── 로그인 ───
  window.loginWithGoogle = async function() {
    try {
      const result = await signInWithPopup(auth, provider);
      currentUser = result.user;
      let data = await loadUserData(currentUser.uid);
      if (!data) {
        data = { subjects: defaultSubjects, streak:0, studyLog:{}, lastStudyDate:null, streak_lastDate:null };
        await saveUserData(currentUser.uid, data);
      }
      userData = data;
      renderDashboard();
    } catch(e) {
      alert("로그인 실패: " + e.message);
    }
  };

  window.logout = async function() {
    await signOut(auth);
    currentUser = null; userData = null;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app-screen").style.display  = "none";
  };

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      let data = await loadUserData(user.uid);
      if (!data) {
        data = { subjects: defaultSubjects, streak:0, studyLog:{}, lastStudyDate:null, streak_lastDate:null };
        await saveUserData(user.uid, data);
      }
      userData = data;
      renderDashboard();
    }
  });
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0F0E17;--surface:#1A1929;--surface2:#232235;--border:#2E2D45;
  --accent:#FFD60A;--accent2:#FF6B6B;--text:#F5F0FF;--muted:#8884A8;
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── 별빛 배경 ── */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 20%,#1e1b4b 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,#1a0a2e 0%,transparent 50%),
             var(--bg);
  z-index:-1;
}

/* ── 로그인 화면 ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:20px;padding:20px;
}
.login-planet{font-size:90px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.login-title{font-family:'Jua',sans-serif;font-size:36px;color:var(--accent);text-align:center;line-height:1.2}
.login-sub{color:var(--muted);font-size:14px;text-align:center}
.btn-google{
  background:#fff;color:#333;border:none;border-radius:50px;padding:14px 32px;
  font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s;margin-top:8px;
}
.btn-google:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.btn-google img{width:22px}

/* ── 앱 화면 ── */
#app-screen{display:none;min-height:100vh;padding:0 0 60px}

/* ── 헤더 ── */
.app-header{
  background:linear-gradient(135deg,#1a1040 0%,#0d0c1d 100%);
  border-bottom:0.5px solid var(--border);padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);
}
.header-title{font-family:'Jua',sans-serif;font-size:20px;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px}
.streak-badge{background:#2a1f00;border:1px solid #664400;border-radius:20px;padding:5px 12px;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:4px}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer}
.btn-logout:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── 메인 컨테이너 ── */
.main{max-width:820px;margin:0 auto;padding:24px 16px}

/* ── 전체 진행 바 ── */
.overall-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;margin-bottom:20px;
}
.oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.oc-title{font-family:'Jua',sans-serif;font-size:16px;color:var(--text)}
.oc-stats{display:flex;gap:16px}
.oc-stat{text-align:center}
.oc-stat-num{font-family:'Jua',sans-serif;font-size:22px;color:var(--accent)}
.oc-stat-label{font-size:10px;color:var(--muted)}
.big-track{position:relative;height:28px;background:#1a1929;border-radius:50px;overflow:hidden;border:1px solid var(--border)}
#overall-fill{
  height:100%;border-radius:50px;
  background:linear-gradient(90deg,#FFD60A,#FF6B6B,#A855F7);
  transition:width 0.8s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.big-runner{position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:20px}
.big-pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ── 달력 + 스트릭 ── */
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.info-card-title{font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:500}
#mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  background:var(--surface2);border-radius:8px;padding:4px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9px;color:var(--muted);transition:background .2s;
}
.cal-done{background:#1a3a00;color:#7ec850 !important}
.cal-day span:last-child{font-size:12px;font-weight:700;color:var(--text)}
.cal-done span{color:#7ec850 !important}
.streak-big{font-family:'Jua',sans-serif;font-size:48px;color:var(--accent);text-align:center;line-height:1}
.streak-label{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

/* ── 과목 카드 ── */
.subject-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-title{font-family:'Jua',sans-serif;font-size:18px}
.btn-add-subject{
  background:var(--accent);color:#000;border:none;border-radius:50px;
  padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;
  transition:transform .15s,box-shadow .15s;font-family:'Noto Sans KR',sans-serif;
}
.btn-add-subject:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(255,214,10,.4)}

#subject-list{display:flex;flex-direction:column;gap:12px}

.s-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;position:relative;overflow:hidden;
  animation:slideIn .4s ease both;
  transition:transform .2s,box-shadow .2s;
}
.s-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.s-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--sc);border-radius:4px 0 0 4px;
}
@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.sc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sc-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:12px}
.sc-info{flex:1}
.sc-name{font-family:'Jua',sans-serif;font-size:16px;color:var(--text)}
.sc-meta{font-size:11px;color:var(--muted);margin-top:2px}
.sc-pct{font-family:'Jua',sans-serif;font-size:22px;color:var(--sc)}

/* ── 달리기 트랙 ── */
.track-wrap{margin-bottom:10px}
.track-bg{
  position:relative;height:32px;background:#12111e;border-radius:50px;
  overflow:hidden;border:1px solid var(--border);
}
.track-fill{
  height:100%;border-radius:50px;
  background:linear-gradient(90deg, var(--sc), color-mix(in srgb, var(--sc) 60%, white));
  transition:width 0.7s cubic-bezier(.34,1.56,.64,1);
  position:relative;min-width:28px;
}
.runner{
  position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  font-size:20px;filter:drop-shadow(0 0 6px var(--sc));
  animation:bounce .6s ease-in-out infinite alternate;
}
@keyframes bounce{from{transform:translateY(-48%)}to{transform:translateY(-52%)}}
.track-flags{position:absolute;inset:0;pointer-events:none}
.flag{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:11px;color:rgba(255,255,255,.3);z-index:2}

/* ── 스티커 ── */
.sc-stickers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;min-height:8px}
.stk{font-size:18px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ── 버튼 ── */
.sc-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-done{
  background:var(--sc);color:#000;border:none;border-radius:50px;
  padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;
  transition:transform .15s,opacity .15s;font-family:'Noto Sans KR',sans-serif;
}
.btn-done:hover{transform:scale(1.05)}
.btn-undo{
  background:var(--surface2);color:var(--muted);border:1px solid var(--border);
  border-radius:50px;padding:7px 12px;font-size:13px;cursor:pointer;
  transition:border-color .15s;
}
.btn-undo:hover:not(:disabled){border-color:var(--accent2);color:var(--accent2)}
.btn-undo:disabled{opacity:.3;cursor:default}
.btn-sticker{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:50px;padding:7px 14px;font-size:13px;cursor:pointer;
  transition:border-color .15s;
}
.btn-sticker:hover{border-color:#FFD60A;color:#FFD60A}
.badge-complete{
  background:linear-gradient(135deg,#FFD60A,#FF6B6B);
  color:#000;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;
  animation:shine 1.5s ease-in-out infinite;
}
@keyframes shine{0%,100%{opacity:1}50%{opacity:.7}}

/* ── 모달 ── */
#add-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;width:90%;max-width:400px;
}
.modal-title{font-family:'Jua',sans-serif;font-size:20px;margin-bottom:20px;color:var(--accent)}
.modal-row{margin-bottom:14px}
.modal-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.modal-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;
  font-family:'Noto Sans KR',sans-serif;
}
.modal-input:focus{outline:none;border-color:var(--accent)}
.icon-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.icon-opt{
  width:36px;height:36px;border:1px solid var(--border);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  cursor:pointer;background:var(--surface2);transition:border-color .15s;
}
.icon-opt.selected,.icon-opt:hover{border-color:var(--accent);background:#1a1500}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn-confirm{flex:1;background:var(--accent);color:#000;border:none;border-radius:50px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn-cancel{flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:50px;padding:11px;font-size:14px;cursor:pointer}

/* ── 폭죽 ── */
#confetti-container{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:9999}
.conf-piece{
  position:absolute;top:-20px;animation:confFall linear forwards;
}
@keyframes confFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(0.5);opacity:0}}

/* ── 반응형 ── */
@media(max-width:600px){
  .info-row{grid-template-columns:1fr}
  .app-header{padding:12px 16px}
  .main{padding:16px 12px}
}
</style>
</head>
<body>

<div id="confetti-container"></div>

<!-- ───────── 로그인 화면 ───────── -->
<div id="login-screen">
  <div class="login-planet">🚀</div>
  <div class="login-title">Sam의<br>공부 대모험</div>
  <div class="login-sub">오늘도 한 걸음 더! 어디까지 가볼까? 🌟</div>
  <button class="btn-google" onclick="loginWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Google로 시작하기
  </button>
  <div style="margin-top:24px;background:#1a1929;border:1px solid #2E2D45;border-radius:12px;padding:14px 18px;max-width:380px;font-size:11px;color:#8884A8;line-height:1.7">
    <strong style="color:#FFD60A">⚙️ 부모님께:</strong> Firebase 프로젝트 설정 후<br>
    이 파일 상단 <code style="color:#2EC4B6">firebaseConfig</code> 에 본인 키를 입력해주세요.<br>
    Firebase Console → 프로젝트 설정 → 웹 앱 추가 → 구성 복사
  </div>
</div>

<!-- ───────── 앱 화면 ───────── -->
<div id="app-screen">
  <div class="app-header">
    <div class="header-title" id="user-name">Sam의 공부 대모험 🚀</div>
    <div class="header-right">
      <div class="streak-badge">🔥 <span id="streak-count">0</span>일 연속</div>
      <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="main">

    <!-- 전체 진행 바 -->
    <div class="overall-card">
      <div class="oc-top">
        <div class="oc-title">🗺️ 전체 대모험 진행도</div>
        <div class="oc-stats">
          <div class="oc-stat">
            <div class="oc-stat-num" id="overall-done">0강</div>
            <div class="oc-stat-label">완료 강의</div>
          </div>
          <div class="oc-stat">
            <div class="oc-stat-num" id="overall-pct">0%</div>
            <div class="oc-stat-label">달성률</div>
          </div>
        </div>
      </div>
      <div class="big-track">
        <div id="overall-fill" style="width:0%">
          <div class="big-runner">🏃</div>
          <div class="big-pct" id="overall-pct-inside"></div>
        </div>
      </div>
    </div>

    <!-- 달력 + 스트릭 -->
    <div class="info-row">
      <div class="info-card">
        <div class="info-card-title">📅 최근 7일 출석</div>
        <div id="mini-cal"></div>
      </div>
      <div class="info-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="info-card-title">🔥 연속 공부</div>
        <div class="streak-big" id="streak-big">0</div>
        <div class="streak-label">일 연속 🏆</div>
      </div>
    </div>

    <!-- 과목 목록 -->
    <div class="subject-header">
      <div class="sh-title">📚 내 공부 과목들</div>
      <button class="btn-add-subject" onclick="openAddModal()">+ 과목 추가</button>
    </div>

    <div id="subject-list"></div>

  </div>
</div>

<!-- ───────── 과목 추가 모달 ───────── -->
<div id="add-modal">
  <div class="modal-box">
    <div class="modal-title">➕ 새 과목 추가</div>

    <div class="modal-row">
      <div class="modal-label">아이콘 선택</div>
      <div class="icon-picker">
        <div class="icon-opt selected" data-icon="📚" onclick="selectIcon(this)">📚</div>
        <div class="icon-opt" data-icon="🔢" onclick="selectIcon(this)">🔢</div>
        <div class="icon-opt" data-icon="🔬" onclick="selectIcon(this)">🔬</div>
        <div class="icon-opt" data-icon="🏯" onclick="selectIcon(this)">🏯</div>
        <div class="icon-opt" data-icon="📝" onclick="selectIcon(this)">📝</div>
        <div class="icon-opt" data-icon="🎨" onclick="selectIcon(this)">🎨</div>
        <div class="icon-opt" data-icon="🌍" onclick="selectIcon(this)">🌍</div>
        <div class="icon-opt" data-icon="🎵" onclick="selectIcon(this)">🎵</div>
        <div class="icon-opt" data-icon="💻" onclick="selectIcon(this)">💻</div>
        <div class="icon-opt" data-icon="🔤" onclick="selectIcon(this)">🔤</div>
        <div class="icon-opt" data-icon="🀄" onclick="selectIcon(this)">🀄</div>
        <div class="icon-opt" data-icon="⚗️" onclick="selectIcon(this)">⚗️</div>
      </div>
    </div>

    <div class="modal-row">
      <div class="modal-label">과목 이름</div>
      <input id="new-name" class="modal-input" type="text" placeholder="예: 만점왕 수학 4-1">
    </div>

    <div class="modal-row">
      <div class="modal-label">총 강의 수</div>
      <input id="new-total" class="modal-input" type="number" value="10" min="1" max="100">
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddModal()">취소</button>
      <button class="btn-confirm" onclick="addSubject()">추가하기 🚀</button>
    </div>
  </div>
</div>

<script>
// 아이콘 선택
function selectIcon(el) {
  document.querySelectorAll('.icon-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('new-icon').value = el.dataset.icon;
}
// hidden input for icon
const hi = document.createElement('input');
hi.type='hidden'; hi.id='new-icon'; hi.value='📚';
document.body.appendChild(hi);

// streak big sync
const origRender = window.renderOverallBar;
window.renderOverallBar = function() {
  origRender && origRender();
  const sc = document.getElementById('streak-count');
  const sb = document.getElementById('streak-big');
  if(sc && sb) sb.textContent = sc.textContent;
};
</script>

</body>
</html>
