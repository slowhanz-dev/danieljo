<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNNAR · 업무 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e2e0d8;
  --border2:#ccc9bc;
  --text:#1a1a18;
  --text2:#6b6960;
  --text3:#a09d92;
  --green:#1D9E75;
  --blue:#185FA5;
  --amber:#854F0B;
  --red:#993556;
  --radius:12px;
  --radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f0f0d;
    --surface:#1a1a17;
    --surface2:#232320;
    --border:#2a2a26;
    --border2:#3a3a34;
    --text:#f0ede6;
    --text2:#9a9790;
    --text3:#5a5952;
    --green:#4ADE80;
    --blue:#60A5FA;
    --amber:#FCD34D;
    --red:#F87171;
  }
}
body{
  font-family:'Pretendard',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:14px;
  line-height:1.5;
}

/* ─── Layout ─── */
.header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:20px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}
.logo{font-size:18px;font-weight:600;letter-spacing:.04em}
.logo span{font-weight:300;opacity:.5;margin-left:6px;font-size:13px}
.header-actions{display:flex;gap:8px;align-items:center}
.main{max-width:1200px;margin:0 auto;padding:28px 24px 60px}

/* ─── Stats ─── */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;text-align:center}
.stat-num{font-size:26px;font-weight:500}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px;letter-spacing:.04em}

/* ─── Filter ─── */
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fbtn{
  background:transparent;
  border:1px solid var(--border2);
  border-radius:20px;
  padding:5px 14px;
  font-size:12px;
  color:var(--text2);
  cursor:pointer;
  font-family:inherit;
  transition:all .15s;
}
.fbtn:hover,.fbtn.on{
  background:var(--text);
  border-color:var(--text);
  color:var(--bg);
}
.hint{font-size:11px;color:var(--text3);margin-bottom:20px}

/* ─── Grid ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* ─── Card ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border);
}
.card-icon{font-size:16px;flex-shrink:0}
.card-label{font-size:13px;font-weight:600;flex:1}
.card-meta{font-size:11px;color:var(--text3)}
.pbar{height:2px;background:var(--border)}
.pfill{height:100%;transition:width .4s ease}
.items{padding:4px 0;flex:1}

/* ─── Item row ─── */
.irow{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 16px;
  cursor:pointer;
  transition:background .12s;
  position:relative;
}
.irow:hover{background:var(--surface2)}
.irow.editing{background:var(--surface2)}
.iname{
  flex:1;font-size:12px;
  color:var(--text);
  line-height:1.45;
  word-break:keep-all;
}
.itag{
  font-size:10px;
  background:#fef3c7;
  color:#92400e;
  padding:1px 6px;border-radius:8px;
  margin-left:4px;
  display:inline-block;
}
.badge{
  font-size:10px;font-weight:500;
  padding:2px 9px;border-radius:10px;
  white-space:nowrap;cursor:pointer;
  flex-shrink:0;margin-top:1px;
  border:none;font-family:inherit;
  transition:opacity .12s;
}
.badge:hover{opacity:.75}
.del-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text3);font-size:14px;
  padding:0 0 0 4px;opacity:0;
  transition:opacity .12s;
  line-height:1;
}
.irow:hover .del-btn{opacity:1}
.del-btn:hover{color:var(--red)}

/* ─── Add item ─── */
.add-row{padding:6px 16px 10px}
.add-input{
  width:100%;
  background:transparent;
  border:1px solid var(--border2);
  border-radius:6px;
  padding:7px 10px;
  font-size:12px;
  color:var(--text);
  font-family:inherit;
  outline:none;
}
.add-input:focus{border-color:var(--blue);background:var(--surface2)}
.add-input::placeholder{color:var(--text3)}

/* ─── Category add ─── */
.add-cat-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);
  border:1px dashed var(--border2);
  border-radius:var(--radius);
  padding:24px;
  cursor:pointer;
  color:var(--text2);
  font-size:13px;
  font-family:inherit;
  width:100%;
  transition:all .15s;
}
.add-cat-btn:hover{background:var(--surface2);border-color:var(--text2);color:var(--text)}

/* ─── Buttons ─── */
.btn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:7px 14px;
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  color:var(--text);
  transition:all .15s;
}
.btn:hover{background:var(--surface2)}
.btn-primary{
  background:var(--text);color:var(--bg);border-color:var(--text);
}
.btn-primary:hover{opacity:.85}

/* ─── Modal ─── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  padding:20px;
}
.modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  width:100%;max-width:400px;
}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px}
.modal label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.modal input,.modal select{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:6px;
  padding:8px 10px;
  font-size:13px;
  color:var(--text);
  font-family:inherit;
  outline:none;
  margin-bottom:14px;
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

/* ─── Save notice ─── */
.save-toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--text);color:var(--bg);
  border-radius:var(--radius-sm);
  padding:8px 16px;font-size:12px;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
  z-index:300;
}
.save-toast.show{opacity:1}


/* ─── V2: search / flags / loading ─── */
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:220px;max-width:420px}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:12px;color:var(--text);font-family:inherit;outline:none}
.search-input:focus{border-color:var(--blue);background:var(--surface2)}
.sync-note{font-size:11px;color:var(--text3);white-space:nowrap}
.flag-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 2px;line-height:1;opacity:.55;transition:all .12s;flex-shrink:0;margin-top:2px}
.flag-btn:hover{opacity:1;transform:scale(1.08)}
.flag-btn.on{opacity:1;color:var(--amber)}
.flag-btn.today.on{color:var(--blue)}
.flag-chip{font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;margin-left:4px;display:inline-block;white-space:nowrap}
.flag-important{background:#FDE68A;color:#78350F}
.flag-today{background:#BFDBFE;color:#1E3A8A}
.empty-state{background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:24px;color:var(--text2);font-size:13px;text-align:center}
.loading-inline{font-size:11px;color:var(--text3);margin-left:8px}

/* ─── Responsive ─── */
@media(max-width:600px){
  .header{padding:14px 16px;align-items:flex-start;gap:12px;position:static}
  .header-actions{flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .logo span{display:block;margin-left:0;margin-top:2px}
  .main{padding:16px 12px 60px}
  .stats-row{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .stats-row .stat:nth-child(4),.stats-row .stat:nth-child(5){display:none}
  .stat{padding:10px 8px}.stat-num{font-size:22px}
  .filter-row{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.fbtn{white-space:nowrap}
  .toolbar{display:block}.search-wrap{max-width:none;margin-bottom:8px}.sync-note{display:block;margin-bottom:8px}
  .grid{grid-template-columns:1fr;gap:12px}
  .btn{padding:6px 10px;font-size:11px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="logo">BUNNAR <span>· 업무 현황판</span></span>
  </div>
  <div class="header-actions">
    <button class="btn" id="exportBtn" onclick="exportData()">📤 내보내기</button>
    <button class="btn" id="importBtn" onclick="triggerImport()">📥 가져오기</button>
    <button class="btn" id="loginBtn" onclick="login()">🔐 로그인</button>
    <button class="btn" id="logoutBtn" onclick="logout()" style="display:none">로그아웃</button>
    <span id="authStatus" style="font-size:11px;color:var(--text3);display:none"></span>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-primary" id="addCatHeaderBtn" onclick="showAddCat()">+ 카테고리 추가</button>
  </div>
</div>

<div class="main">
  <div class="stats-row" id="sg"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" placeholder="검색: 지원사업, 바이어, 웹사이트 작업 등" oninput="setSearch(this.value)">
    </div>
    <div class="sync-note" id="syncNote">로컬 데이터 준비 중</div>
  </div>

  <div class="filter-row" id="fr">
    <button class="fbtn on" data-f="all">전체</button>
    <button class="fbtn" data-f="important">중요</button>
    <button class="fbtn" data-f="today">오늘 할일</button>
    <button class="fbtn" data-f="완료">완료</button>
    <button class="fbtn" data-f="수행중">수행중</button>
    <button class="fbtn" data-f="진행중">진행중</button>
    <button class="fbtn" data-f="심사중">심사중</button>
    <button class="fbtn" data-f="신청완료">신청완료</button>
    <button class="fbtn" data-f="예정">예정</button>
    <button class="fbtn" data-f="탈락">탈락</button>
  </div>
  <p class="hint">상태 배지 클릭 → 순환 변경 &nbsp;·&nbsp; ★ 중요 / 오늘 버튼으로 빠른 필터링 &nbsp;·&nbsp; 항목 우측 × → 삭제 &nbsp;·&nbsp; 모든 변경사항 자동 저장</p>

  <div class="grid" id="mg"></div>
</div>

<!-- Add category modal -->
<div class="modal-overlay" id="catModal" style="display:none" onclick="closeCatModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>새 카테고리 추가</h3>
    <label>카테고리 이름</label>
    <input type="text" id="catName" placeholder="예: 재무 관리" />
    <label>아이콘 (이모지 또는 텍스트)</label>
    <input type="text" id="catIcon" placeholder="예: 💰" />
    <label>포인트 컬러</label>
    <input type="color" id="catColor" value="#378ADD" style="height:40px;cursor:pointer" />
    <div class="modal-actions">
      <button class="btn" onclick="closeCatModalDirect()">취소</button>
      <button class="btn btn-primary" onclick="addCategory()">추가</button>
    </div>
  </div>
</div>

<!-- Save toast -->
<div class="save-toast" id="toast">✓ 저장됨</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ── Constants ──────────────────────────────
const KEY = 'bunnar_dashboard_v1';
const STATUSES = ['완료','수행중','진행중','심사중','신청완료','예정','탈락'];
const BADGE_STYLE = {
  '완료':   'background:#9FE1CB;color:#085041',
  '수행중': 'background:#6EE7B7;color:#065F46',
  '진행중': 'background:#B5D4F4;color:#0C447C',
  '심사중': 'background:#FAC775;color:#633806',
  '신청완료':'background:#AFA9EC;color:#3C3489',
  '예정':   'background:#D3D1C7;color:#444441',
  '탈락':   'background:#F09595;color:#791F1F',
};

// ── Firebase config ────────────────────────
// Firebase 콘솔에서 등록한 bunnar-dashboard 웹 앱 설정값입니다.
// 이 설정값 자체는 비밀번호가 아니며, 실제 접근 제한은 Firestore 보안 규칙에서 처리합니다.
const firebaseConfig = {
  apiKey: "AIzaSyBGBDywtb_UQwewBObvTSVxiXTTLDZQd2w",
  authDomain: "bunnar-dashboard.firebaseapp.com",
  projectId: "bunnar-dashboard",
  storageBucket: "bunnar-dashboard.firebasestorage.app",
  messagingSenderId: "170038311346",
  appId: "1:170038311346:web:59e4eb30f65961aab80cab",
  measurementId: "G-TDR9PS981E"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const DASHBOARD_DOC = db.collection('dashboards').doc('bunnar-main');

// ── Default data ───────────────────────────
const DEFAULT = [
  {id:'grants',label:'지원사업',icon:'🏛️',color:'#378ADD',items:[
    {n:'판판대로 TOPS 온라인 브랜드 육성사업',s:'탈락'},
    {n:'판판대로 SNS마케팅 지원사업',s:'수행중'},
    {n:'판판대로 상품개선 지원사업',s:'수행중'},
    {n:'화성e샵 복지몰 입점 지원',s:'심사중'},
    {n:'판판셀러 통합관리시스템',s:'신청완료'},
    {n:'소공인 자생력강화사업',s:'진행중',tag:'⚡ 마감 D-3'},
    {n:'소공인 스마트제조 지원사업',s:'진행중'},
    {n:'경기도 제품디자인개발 지원사업',s:'신청완료'},
  ]},
  {id:'web',label:'웹사이트 개발',icon:'🌐',color:'#1D9E75',items:[
    {n:'bunnar.kr 모바일 UX 개선',s:'진행중'},
    {n:'블로그 아카이브 재설계',s:'진행중'},
    {n:'브랜드 카피라이팅',s:'진행중'},
    {n:'드로어 메뉴 CSS 작업',s:'완료'},
    {n:'Pretendard 폰트 적용',s:'완료'},
    {n:'danieljo.com 기본 구축',s:'완료'},
    {n:'JSON 프로젝트 데이터 시스템',s:'완료'},
    {n:'Google Sheets → projects.json 연동',s:'예정'},
    {n:'이미지 비율 제한 제거',s:'예정'},
    {n:'Cloudinary 이미지 호스팅',s:'예정'},
  ]},
  {id:'sns',label:'SNS / 마케팅',icon:'📡',color:'#BA7517',items:[
    {n:'핀터레스트 계정 운영',s:'예정'},
    {n:'링크드인 계정 운영',s:'예정'},
    {n:'광고 소재 다듬기',s:'진행중'},
    {n:'마케팅 자동화 세팅',s:'예정'},
  ]},
  {id:'overseas',label:'해외 B2B / 홍보',icon:'✈️',color:'#3B6D11',items:[
    {n:'BLÆK Coffee (함부르크) 샘플+결제',s:'완료'},
    {n:'네덜란드 바이어 관계 관리',s:'진행중'},
    {n:'호주 바이어 관계 관리',s:'진행중'},
    {n:'일본 바이어 관계 관리',s:'진행중'},
    {n:'독일 바이어 관계 관리',s:'진행중'},
    {n:'해외 Shopify 스토어 운영',s:'진행중'},
  ]},
  {id:'prod',label:'생산 / ODM',icon:'🏭',color:'#7F77DD',items:[
    {n:'GBH 6,000유닛 ODM 계약',s:'완료'},
    {n:'신창세라믹 제조계약 체결',s:'완료'},
    {n:'공장등록 (화성시청)',s:'완료'},
    {n:'직접생산 체계 검토',s:'진행중'},
    {n:'소형 전기가마 도입 검토',s:'예정'},
  ]},
  {id:'brand',label:'브랜드 전략',icon:'✦',color:'#D85A30',items:[
    {n:'제품명 다듬기',s:'진행중'},
    {n:'10피스 테이블웨어 시스템 개발',s:'진행중'},
    {n:'패키징 디자인 지원사업 신청',s:'신청완료'},
    {n:'럭셔리 브랜드 라이센싱 전략',s:'예정'},
    {n:'Arita (일본) 연계 기획',s:'예정'},
  ]},
];

// ── State ──────────────────────────────────
let DATA = JSON.parse(JSON.stringify(DEFAULT));
let activeFilter = 'all';
let searchQuery = '';
let unsubscribeDashboard = null;
let isSaving = false;

function getLocalBackupData() {
  try {
    const saved = localStorage.getItem(KEY);
    if (!saved) return null;
    const parsed = JSON.parse(saved);
    return Array.isArray(parsed) ? parsed : null;
  } catch(e) {
    return null;
  }
}

async function loadData() {
  try {
    const snap = await DASHBOARD_DOC.get();

    if (snap.exists && Array.isArray(snap.data().items)) {
      const cloudData = snap.data().items;
      localStorage.setItem(KEY, JSON.stringify(cloudData));
      return cloudData;
    }

    // Firebase 데이터가 아직 없으면, 이 브라우저에 남아 있는 기존 데이터를 우선 이전합니다.
    const localBackup = getLocalBackupData();
    const initialData = localBackup || JSON.parse(JSON.stringify(DEFAULT));

    await DASHBOARD_DOC.set({
      items: initialData,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    localStorage.setItem(KEY, JSON.stringify(initialData));
    return initialData;
  } catch(e) {
    console.error(e);
    alert('데이터 불러오기에 실패했습니다. Firebase 설정, 로그인 상태, 보안 규칙을 확인해 주세요.');
    return getLocalBackupData() || JSON.parse(JSON.stringify(DEFAULT));
  }
}

async function save() {
  // 화면 속도를 위해 먼저 브라우저에 즉시 백업합니다.
  localStorage.setItem(KEY, JSON.stringify(DATA));

  if (!auth.currentUser) {
    updateSyncNote('로그인 후 Firebase 저장 가능');
    return;
  }

  try {
    isSaving = true;
    updateSyncNote('저장 중...');
    await DASHBOARD_DOC.set({
      items: DATA,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: auth.currentUser.email || ''
    }, { merge: true });

    updateSyncNote('Firebase 저장 완료');
    showToast();
  } catch(e) {
    console.error(e);
    updateSyncNote('저장 실패: 로그인 계정/보안 규칙 확인');
    alert('저장에 실패했습니다. 로그인 상태나 Firebase 보안 규칙을 확인해 주세요.');
  } finally {
    isSaving = false;
  }
}

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  auth.signInWithPopup(provider).catch(err => {
    console.error(err);
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
      auth.signInWithRedirect(provider);
      return;
    }
    alert('로그인에 실패했습니다. Firebase Authentication 설정과 승인 도메인을 확인해 주세요.');
  });
}

function logout() {
  auth.signOut();
}


function updateSyncNote(text) {
  const el = document.getElementById('syncNote');
  if (el) el.textContent = text;
}

function setSearch(value) {
  searchQuery = (value || '').trim().toLowerCase();
  render();
}

function toggleImportant(catId, itemIdx) {
  const cat = DATA.find(c => c.id === catId);
  if (!cat || !cat.items[itemIdx]) return;
  cat.items[itemIdx].important = !cat.items[itemIdx].important;
  save();
  render();
}

function toggleToday(catId, itemIdx) {
  const cat = DATA.find(c => c.id === catId);
  if (!cat || !cat.items[itemIdx]) return;
  cat.items[itemIdx].today = !cat.items[itemIdx].today;
  save();
  render();
}

function itemMatches(item) {
  if (activeFilter === 'important' && !item.important) return false;
  if (activeFilter === 'today' && !item.today) return false;
  if (!['all','important','today'].includes(activeFilter) && item.s !== activeFilter) return false;
  if (!searchQuery) return true;
  const hay = [item.n, item.s, item.tag, item.important ? '중요' : '', item.today ? '오늘 할일' : ''].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(searchQuery);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 1500);
}

// ── Stats ──────────────────────────────────
function calcStats() {
  const all = DATA.flatMap(c => c.items);
  const done = all.filter(i => i.s === '완료').length;
  return {
    total: all.length,
    done,
    active: all.filter(i => ['수행중','진행중','심사중','신청완료'].includes(i.s)).length,
    today: all.filter(i => i.today).length,
    important: all.filter(i => i.important).length,
    plan: all.filter(i => i.s === '예정').length,
    fail: all.filter(i => i.s === '탈락').length,
    pct: all.length ? Math.round(done / all.length * 100) : 0,
  };
}

// ── Cycle status ───────────────────────────
function cycleStatus(catId, itemIdx) {
  const cat = DATA.find(c => c.id === catId);
  if (!cat) return;
  const item = cat.items[itemIdx];
  if (!item) return;
  item.s = STATUSES[(STATUSES.indexOf(item.s) + 1) % STATUSES.length];
  save();
  render();
}

// ── Delete item ────────────────────────────
function deleteItem(catId, itemIdx) {
  const cat = DATA.find(c => c.id === catId);
  if (!cat) return;
  cat.items.splice(itemIdx, 1);
  save();
  render();
}

// ── Delete category ────────────────────────
function deleteCat(catId) {
  if (!confirm('이 카테고리를 삭제할까요?')) return;
  DATA = DATA.filter(c => c.id !== catId);
  save();
  render();
}

// ── Add item on Enter ──────────────────────
function addItemKey(e, catId) {
  if (e.key !== 'Enter') return;
  const input = e.target;
  const text = input.value.trim();
  if (!text) return;
  const cat = DATA.find(c => c.id === catId);
  if (!cat) return;
  cat.items.push({ n: text, s: '예정' });
  input.value = '';
  save();
  render();
  // Re-focus the input after render
  setTimeout(() => {
    const inp = document.getElementById('inp_' + catId);
    if (inp) inp.focus();
  }, 50);
}

// ── Add category ───────────────────────────
function showAddCat() {
  document.getElementById('catModal').style.display = 'flex';
  document.getElementById('catName').focus();
}
function closeCatModal(e) {
  if (e.target === document.getElementById('catModal')) closeCatModalDirect();
}
function closeCatModalDirect() {
  document.getElementById('catModal').style.display = 'none';
  document.getElementById('catName').value = '';
  document.getElementById('catIcon').value = '';
}
function addCategory() {
  const name = document.getElementById('catName').value.trim();
  if (!name) { alert('이름을 입력하세요'); return; }
  const icon = document.getElementById('catIcon').value.trim() || '📌';
  const color = document.getElementById('catColor').value;
  const id = 'cat_' + Date.now();
  DATA.push({ id, label: name, icon, color, items: [] });
  save();
  render();
  closeCatModalDirect();
}

// ── Export / Import ────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bunnar-dashboard-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function triggerImport() {
  document.getElementById('importFile').click();
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!Array.isArray(parsed)) throw new Error();
      DATA = parsed;
      save();
      render();
      alert('가져오기 완료!');
    } catch(err) {
      alert('올바른 JSON 파일이 아닙니다.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Render ─────────────────────────────────
function render() {
  const s = calcStats();

  // Stats
  document.getElementById('sg').innerHTML = `
    <div class="stat"><div class="stat-num">${s.total}</div><div class="stat-label">전체</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--green)">${s.done}</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--blue)">${s.active}</div><div class="stat-label">진행중</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--amber)">${s.important}</div><div class="stat-label">중요</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--red)">${s.today}</div><div class="stat-label">오늘</div></div>
  `;

  // Cards
  const grid = document.getElementById('mg');
  grid.innerHTML = '';
  let visibleItemsTotal = 0;

  DATA.forEach(cat => {
    const done = cat.items.filter(i => i.s === '완료').length;
    const pct = cat.items.length ? Math.round(done / cat.items.length * 100) : 0;
    const vis = cat.items.filter(itemMatches);
    visibleItemsTotal += vis.length;

    if (vis.length === 0 && (activeFilter !== 'all' || searchQuery)) return;

    const card = document.createElement('div');
    card.className = 'card';

    // Header
    card.innerHTML = `
      <div class="card-head">
        <span class="card-icon">${cat.icon}</span>
        <span class="card-label">${cat.label}</span>
        <span class="card-meta">${done}/${cat.items.length} &nbsp; ${pct}%</span>
        <button onclick="deleteCat('${cat.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0 0 0 8px;line-height:1" title="카테고리 삭제">×</button>
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:${cat.color}"></div></div>
    `;

    // Items
    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';

    vis.forEach(item => {
      const realIdx = cat.items.indexOf(item);
      const row = document.createElement('div');
      row.className = 'irow';
      row.innerHTML = `
        <span class="iname">
          ${item.n}
          ${item.important ? `<span class="flag-chip flag-important">중요</span>` : ''}
          ${item.today ? `<span class="flag-chip flag-today">오늘</span>` : ''}
          ${item.tag ? `<span class="itag">${item.tag}</span>` : ''}
        </span>
        <button class="flag-btn ${item.important ? 'on' : ''}" onclick="event.stopPropagation();toggleImportant('${cat.id}',${realIdx})" title="중요 표시">★</button>
        <button class="flag-btn today ${item.today ? 'on' : ''}" onclick="event.stopPropagation();toggleToday('${cat.id}',${realIdx})" title="오늘 할일">오늘</button>
        <button class="badge" style="${BADGE_STYLE[item.s]}" onclick="event.stopPropagation();cycleStatus('${cat.id}',${realIdx})" title="클릭하여 상태 변경">${item.s}</button>
        <button class="del-btn" onclick="event.stopPropagation();deleteItem('${cat.id}',${realIdx})" title="삭제">×</button>
      `;
      itemsDiv.appendChild(row);
    });

    card.appendChild(itemsDiv);

    // Add input
    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `<input class="add-input" id="inp_${cat.id}" placeholder="+ 새 항목 추가 후 Enter" onkeydown="addItemKey(event,'${cat.id}')">`;
    card.appendChild(addRow);

    grid.appendChild(card);
  });

  if (visibleItemsTotal === 0 && (activeFilter !== 'all' || searchQuery)) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '조건에 맞는 항목이 없습니다.';
    grid.appendChild(empty);
  }

  // Add category button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-cat-btn';
  addBtn.innerHTML = '＋ 새 카테고리 추가';
  addBtn.onclick = showAddCat;
  grid.appendChild(addBtn);
}

// ── Filter ─────────────────────────────────
document.getElementById('fr').addEventListener('click', e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  activeFilter = b.dataset.f;
  render();
});

// ── Init ────────────────────────────────────
auth.onAuthStateChanged(async user => {
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const authStatus = document.getElementById('authStatus');
  const addCatHeaderBtn = document.getElementById('addCatHeaderBtn');

  if (unsubscribeDashboard) {
    unsubscribeDashboard();
    unsubscribeDashboard = null;
  }

  if (!user) {
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    authStatus.style.display = 'none';
    updateSyncNote('로그인이 필요합니다');
    addCatHeaderBtn.style.display = 'none';

    document.getElementById('sg').innerHTML = '';
    document.getElementById('mg').innerHTML = `
      <div class="card" style="padding:24px">
        <strong>로그인이 필요합니다.</strong>
        <p style="margin-top:8px;color:var(--text2)">
          회사와 집에서 같은 데이터를 보려면 구글 로그인을 해주세요.
        </p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="login()">구글 로그인</button>
      </div>
    `;
    return;
  }

  loginBtn.style.display = 'none';
  logoutBtn.style.display = 'inline-block';
  authStatus.textContent = user.email || '로그인됨';
  authStatus.style.display = 'inline-block';
  addCatHeaderBtn.style.display = 'inline-block';

  // V2: 새로고침 직후에는 브라우저 백업 데이터를 먼저 보여주고, Firebase 최신 데이터는 뒤에서 동기화합니다.
  const localBackup = getLocalBackupData();
  if (localBackup) {
    DATA = localBackup;
    updateSyncNote('로컬 백업 먼저 표시 · Firebase 확인 중');
    render();
  } else {
    updateSyncNote('Firebase 데이터 불러오는 중');
  }

  DATA = await loadData();
  updateSyncNote('Firebase 동기화 완료');
  render();

  // 다른 기기에서 저장한 변경사항이 있으면 새로고침 없이도 반영합니다.
  unsubscribeDashboard = DASHBOARD_DOC.onSnapshot(snap => {
    if (!snap.exists || !Array.isArray(snap.data().items)) return;
    if (isSaving) return;
    DATA = snap.data().items;
    localStorage.setItem(KEY, JSON.stringify(DATA));
    updateSyncNote('최신 데이터 반영됨');
    render();
  }, err => {
    console.error(err);
  });
});
</script>
</body>
</html>
