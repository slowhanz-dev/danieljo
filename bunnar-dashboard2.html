<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNNAR · 업무 현황판</title>
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e2e0d8;
  --border2:#ccc9bc;
  --text:#1a1a18;
  --text2:#6b6960;
  --text3:#a09d92;
  --green:#1D9E75;
  --blue:#185FA5;
  --amber:#854F0B;
  --red:#993556;
  --radius:12px;
  --radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f0f0d;
    --surface:#1a1a17;
    --surface2:#232320;
    --border:#2a2a26;
    --border2:#3a3a34;
    --text:#f0ede6;
    --text2:#9a9790;
    --text3:#5a5952;
    --green:#4ADE80;
    --blue:#60A5FA;
    --amber:#FCD34D;
    --red:#F87171;
  }
}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
.logo{font-size:17px;font-weight:600;letter-spacing:.04em}
.logo span{font-weight:300;opacity:.5;margin-left:6px;font-size:13px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.main{max-width:1240px;margin:0 auto;padding:24px 22px 80px}

.section{margin-bottom:32px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--surface2);color:var(--text2);font-size:10px;padding:1px 7px;border-radius:8px;letter-spacing:.04em}

.digest{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:24px}
.digest-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.digest-head h2{font-size:14px;font-weight:600}
.digest-head .date{font-size:11px;color:var(--text3)}
.digest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.digest-col h3{font-size:11px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.digest-item{font-size:12px;color:var(--text);padding:5px 0;line-height:1.4;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:6px}
.digest-item:last-child{border-bottom:none}
.digest-item .dd{font-size:10px;font-weight:600;flex-shrink:0;padding:1px 6px;border-radius:6px;margin-top:1px}
.digest-empty{font-size:11px;color:var(--text3);padding:5px 0;font-style:italic}

.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;text-align:center}
.stat-num{font-size:24px;font-weight:500}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;letter-spacing:.04em}

.inbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:24px}
.inbox-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.inbox-head h2{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.inbox-head .pill{background:var(--surface2);color:var(--text2);font-size:10px;padding:2px 8px;border-radius:8px}
.inbox-input-wrap{display:flex;gap:6px;margin-bottom:12px}
.inbox-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.inbox-input:focus{border-color:var(--blue);background:var(--surface)}
.inbox-list{display:flex;flex-direction:column;gap:2px}
.qt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;font-size:13px;color:var(--text);transition:background .12s}
.qt:hover{background:var(--surface2)}
.qt.done .qt-text{text-decoration:line-through;color:var(--text3)}
.qt-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.qt-check.done{background:var(--green);border-color:var(--green);color:white;font-size:10px}
.qt-text{flex:1;cursor:text;padding:2px 0}
.qt-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;opacity:0;line-height:1}
.qt:hover .qt-del{opacity:1}
.qt-del:hover{color:var(--red)}
.inbox-actions{margin-top:10px;display:flex;gap:8px;font-size:11px;color:var(--text3)}
.inbox-actions a{color:var(--text2);cursor:pointer;text-decoration:underline}
.inbox-actions a:hover{color:var(--text)}
.inbox-empty{font-size:12px;color:var(--text3);padding:14px 0;text-align:center;font-style:italic}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fbtn{background:transparent;border:1px solid var(--border2);border-radius:20px;padding:5px 13px;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn:hover,.fbtn.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.hint{font-size:11px;color:var(--text3);margin-bottom:18px;line-height:1.6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--border)}
.card-icon{font-size:15px;flex-shrink:0}
.card-label{font-size:13px;font-weight:600;flex:1}
.card-meta{font-size:11px;color:var(--text3)}
.pbar{height:2px;background:var(--border)}
.pfill{height:100%;transition:width .4s ease}
.items{padding:4px 0;flex:1}

.irow{border-bottom:1px solid transparent;transition:background .12s}
.irow:hover{background:var(--surface2)}
.irow.open{background:var(--surface2);border-bottom-color:var(--border)}
.irow-main{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer}
.iname{flex:1;font-size:12px;color:var(--text);line-height:1.45;word-break:keep-all}
.itag{font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:8px;margin-left:4px;display:inline-block}
.dday{font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;margin-left:4px;display:inline-block}
.dday.urgent{background:#fecaca;color:#991b1b}
.dday.soon{background:#fde68a;color:#854d0e}
.dday.normal{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.dday.over{background:var(--text);color:var(--bg)}
.badge{font-size:10px;font-weight:500;padding:2px 9px;border-radius:10px;white-space:nowrap;cursor:pointer;flex-shrink:0;margin-top:1px;border:none;font-family:inherit;transition:opacity .12s}
.badge:hover{opacity:.75}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0 0 0 4px;opacity:0;transition:opacity .12s;line-height:1}
.irow:hover .del-btn{opacity:1}
.del-btn:hover{color:var(--red)}
.toggle-ind{color:var(--text3);font-size:10px;margin-top:3px;transition:transform .15s;flex-shrink:0}
.irow.open .toggle-ind{transform:rotate(90deg);color:var(--text2)}

.iexp{padding:6px 14px 14px;display:none;border-top:1px dashed var(--border);background:var(--surface)}
.irow.open .iexp{display:block}
.iexp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--text2)}
.iexp-row label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;min-width:42px}
.iexp input[type=date]{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 7px;color:var(--text);font-family:inherit;font-size:11px;outline:none}
.iexp input[type=date]:focus{border-color:var(--blue)}
.iexp textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-size:12px;color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:50px;margin-top:3px}
.iexp textarea:focus{border-color:var(--blue)}
.iexp-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mini-btn{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 9px;font-size:10px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .12s;text-decoration:none;display:inline-block}
.mini-btn:hover{background:var(--text);color:var(--bg);border-color:var(--text)}

.add-row{padding:6px 14px 10px}
.add-input{width:100%;background:transparent;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--text);font-family:inherit;outline:none}
.add-input:focus{border-color:var(--blue);background:var(--surface2)}
.add-input::placeholder{color:var(--text3)}

.add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:24px;cursor:pointer;color:var(--text2);font-size:13px;font-family:inherit;width:100%;transition:all .15s}
.add-cat-btn:hover{background:var(--surface2);border-color:var(--text2);color:var(--text)}

.btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--text);transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:.85}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:400px}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px}
.modal label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.modal input,.modal select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

.save-toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);border-radius:var(--radius-sm);padding:8px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:300}
.save-toast.show{opacity:1}

@media(max-width:700px){
  .header{padding:12px 14px}
  .main{padding:14px 12px 80px}
  .digest-grid{grid-template-columns:1fr;gap:18px}
  .stats-row{grid-template-columns:repeat(3,1fr)}
  .stats-row .stat:nth-child(4),.stats-row .stat:nth-child(5){display:none}
  .logo{font-size:15px}
}
</style>
</head>
<body>

<div class="header">
  <div><span class="logo">BUNNAR <span>· 업무 현황판</span></span></div>
  <div class="header-actions">
    <button class="btn" id="exportBtn" onclick="exportData()">📤 내보내기</button>
    <button class="btn" id="importBtn" onclick="triggerImport()">📥 가져오기</button>
    <button class="btn" id="loginBtn" onclick="login()">🔐 로그인</button>
    <button class="btn" id="logoutBtn" onclick="logout()" style="display:none">로그아웃</button>
    <span id="authStatus" style="font-size:11px;color:var(--text3);display:none"></span>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-primary" id="addCatHeaderBtn" onclick="showAddCat()">+ 카테고리</button>
  </div>
</div>

<div class="main">
  <div class="digest" id="digest" style="display:none">
    <div class="digest-head">
      <h2>오늘의 다이제스트</h2>
      <span class="date" id="todayDate"></span>
    </div>
    <div class="digest-grid">
      <div class="digest-col"><h3>🔴 지금 당장</h3><div id="digUrgent"></div></div>
      <div class="digest-col"><h3>🟡 이번 주</h3><div id="digSoon"></div></div>
      <div class="digest-col"><h3>⚪ 진행 중</h3><div id="digActive"></div></div>
    </div>
  </div>

  <div class="inbox" id="inboxBox" style="display:none">
    <div class="inbox-head">
      <h2>📥 잔업 (Quick Inbox)</h2>
      <span class="pill" id="qtCount">0개 남음</span>
    </div>
    <div class="inbox-input-wrap">
      <input type="text" id="qtInput" class="inbox-input" placeholder="빠르게 적기 → Enter (예: 세무사 전화, 샘플 박스 라벨)" onkeydown="addQuickTask(event)">
    </div>
    <div class="inbox-list" id="qtList"></div>
    <div class="inbox-actions">
      <span id="qtDoneInfo"></span>
      <a id="qtClearDone" onclick="clearDoneQt()" style="display:none">완료된 항목 비우기</a>
    </div>
  </div>

  <div class="section" id="projectsSection" style="display:none">
    <div class="section-title">프로젝트 현황 <span class="count" id="catCount">0개 카테고리</span></div>
    <div class="stats-row" id="sg"></div>
    <div class="filter-row" id="fr">
      <button class="fbtn on" data-f="all">전체</button>
      <button class="fbtn" data-f="완료">완료</button>
      <button class="fbtn" data-f="수행중">수행중</button>
      <button class="fbtn" data-f="진행중">진행중</button>
      <button class="fbtn" data-f="심사중">심사중</button>
      <button class="fbtn" data-f="신청완료">신청완료</button>
      <button class="fbtn" data-f="예정">예정</button>
      <button class="fbtn" data-f="탈락">탈락</button>
    </div>
    <p class="hint"><strong>항목 클릭</strong> → 마감일·메모 펼치기 &nbsp;·&nbsp; <strong>상태 배지</strong> → 순환 변경 &nbsp;·&nbsp; <strong>카드 하단 입력</strong> → 새 항목 추가<br>D-day는 마감일을 설정하면 자동 표시됩니다. 모든 변경사항은 Firebase에 자동 저장됩니다.</p>
    <div class="grid" id="mg"></div>
  </div>

  <div id="loggedOut" style="display:none">
    <div class="card" style="padding:24px">
      <strong>로그인이 필요합니다.</strong>
      <p style="margin-top:8px;color:var(--text2)">회사·집·모바일에서 같은 데이터를 보려면 구글 로그인을 해주세요.</p>
      <button class="btn btn-primary" style="margin-top:16px" onclick="login()">구글 로그인</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal" style="display:none" onclick="closeCatModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>새 카테고리 추가</h3>
    <label>카테고리 이름</label>
    <input type="text" id="catName" placeholder="예: 재무 관리" />
    <label>아이콘 (이모지 또는 텍스트)</label>
    <input type="text" id="catIcon" placeholder="예: 💰" />
    <label>포인트 컬러</label>
    <input type="color" id="catColor" value="#378ADD" style="height:40px;cursor:pointer" />
    <div class="modal-actions">
      <button class="btn" onclick="closeCatModalDirect()">취소</button>
      <button class="btn btn-primary" onclick="addCategory()">추가</button>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">✓ 저장됨</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const KEY = 'bunnar_dashboard_v1';
const STATUSES = ['완료','수행중','진행중','심사중','신청완료','예정','탈락'];
const BADGE_STYLE = {
  '완료':'background:#9FE1CB;color:#085041',
  '수행중':'background:#6EE7B7;color:#065F46',
  '진행중':'background:#B5D4F4;color:#0C447C',
  '심사중':'background:#FAC775;color:#633806',
  '신청완료':'background:#AFA9EC;color:#3C3489',
  '예정':'background:#D3D1C7;color:#444441',
  '탈락':'background:#F09595;color:#791F1F',
};

// ── Firebase config ────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBGBDywtb_UQwewBObvTSVxiXTTLDZQd2w",
  authDomain: "bunnar-dashboard.firebaseapp.com",
  projectId: "bunnar-dashboard",
  storageBucket: "bunnar-dashboard.firebasestorage.app",
  messagingSenderId: "170038311346",
  appId: "1:170038311346:web:59e4eb30f65961aab80cab",
  measurementId: "G-TDR9PS981E"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const DASHBOARD_DOC = db.collection('dashboards').doc('bunnar-main');

let DATA = [];
let QUICK = [];
let activeFilter = 'all';
let openItemKey = null;
let unsubscribeDashboard = null;
let suppressSnapshot = false;

function todayISO(){return new Date().toISOString().slice(0,10)}
function daysUntil(d){if(!d)return null;const t=new Date(todayISO()+'T00:00:00');const due=new Date(d+'T00:00:00');return Math.round((due-t)/86400000)}
function ddayLabel(d){const n=daysUntil(d);if(n===null)return null;if(n<0)return{cls:'over',text:`D+${Math.abs(n)}`};if(n===0)return{cls:'urgent',text:'D-DAY'};if(n<=3)return{cls:'urgent',text:`D-${n}`};if(n<=7)return{cls:'soon',text:`D-${n}`};return{cls:'normal',text:`D-${n}`}}
function escapeHtml(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function getLocalBackup(){
  try{
    const saved=localStorage.getItem(KEY);
    if(!saved)return null;
    const p=JSON.parse(saved);
    if(Array.isArray(p))return{items:p,quickTasks:[]};
    if(p&&typeof p==='object')return p;
    return null;
  }catch(e){return null}
}
function setLocalBackup(obj){
  try{localStorage.setItem(KEY,JSON.stringify(obj||{items:DATA,quickTasks:QUICK}))}catch(e){}
}

async function loadData(){
  try{
    const snap=await DASHBOARD_DOC.get();
    if(snap.exists){
      const d=snap.data();
      const items=Array.isArray(d.items)?d.items:[];
      const quickTasks=Array.isArray(d.quickTasks)?d.quickTasks:[];
      setLocalBackup({items,quickTasks});
      return{items,quickTasks};
    }
    const local=getLocalBackup();
    const initial=local||{items:[],quickTasks:[]};
    suppressSnapshot=true;
    await DASHBOARD_DOC.set({
      items:initial.items,
      quickTasks:initial.quickTasks||[],
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    setLocalBackup(initial);
    return initial;
  }catch(e){
    console.error(e);
    alert('데이터 불러오기에 실패했습니다. Firebase 설정, 로그인 상태, 보안 규칙을 확인해 주세요.');
    return getLocalBackup()||{items:[],quickTasks:[]};
  }
}

async function save(){
  if(!auth.currentUser){alert('저장하려면 먼저 구글 로그인이 필요합니다.');return}
  try{
    suppressSnapshot=true;
    await DASHBOARD_DOC.set({
      items:DATA,
      quickTasks:QUICK,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy:auth.currentUser.email||''
    },{merge:true});
    setLocalBackup();
    showToast();
  }catch(e){
    console.error(e);
    alert('저장에 실패했습니다. 로그인 상태나 Firebase 보안 규칙을 확인해 주세요.');
  }
}

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider).catch(err=>{
    console.error(err);
    if(err.code==='auth/popup-blocked'||err.code==='auth/cancelled-popup-request'){
      auth.signInWithRedirect(provider);return;
    }
    alert('로그인에 실패했습니다.');
  });
}
function logout(){auth.signOut()}
function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT=setTimeout(()=>t.classList.remove('show'),1500);
}

function calcStats(){
  const all=DATA.flatMap(c=>c.items);
  const done=all.filter(i=>i.s==='완료').length;
  return{
    total:all.length,done,
    active:all.filter(i=>['수행중','진행중','심사중','신청완료'].includes(i.s)).length,
    plan:all.filter(i=>i.s==='예정').length,
    fail:all.filter(i=>i.s==='탈락').length,
    pct:all.length?Math.round(done/all.length*100):0,
  };
}

function cycleStatus(catId,idx){
  const c=DATA.find(x=>x.id===catId);if(!c||!c.items[idx])return;
  c.items[idx].s=STATUSES[(STATUSES.indexOf(c.items[idx].s)+1)%STATUSES.length];
  save();render();
}
function deleteItem(catId,idx){
  const c=DATA.find(x=>x.id===catId);if(!c)return;
  c.items.splice(idx,1);save();render();
}
function deleteCat(catId){
  if(!confirm('이 카테고리를 삭제할까요? (안의 모든 항목이 사라집니다)'))return;
  DATA=DATA.filter(c=>c.id!==catId);save();render();
}

function toggleItem(catId,idx){
  const k=catId+'::'+idx;openItemKey=(openItemKey===k)?null:k;render();
}
function updateDue(catId,idx,v){
  const c=DATA.find(x=>x.id===catId);if(!c||!c.items[idx])return;
  if(v)c.items[idx].due=v;else delete c.items[idx].due;
  save();render();
}
function updateNotes(catId,idx,v){
  const c=DATA.find(x=>x.id===catId);if(!c||!c.items[idx])return;
  c.items[idx].notes=v;
}
function commitNotes(catId,idx){save()}

function calendarLink(item,catLabel){
  const title=encodeURIComponent('['+catLabel+'] '+item.n);
  const details=encodeURIComponent((item.notes||'')+'\n\n— BUNNAR 대시보드');
  let dates='';
  if(item.due){
    const d=item.due.replace(/-/g,'');
    const dt=new Date(item.due+'T00:00:00');
    const next=new Date(dt.getTime()+86400000);
    const ns=next.toISOString().slice(0,10).replace(/-/g,'');
    dates=`&dates=${d}/${ns}`;
  }
  return`https://calendar.google.com/calendar/r/eventedit?text=${title}&details=${details}${dates}`;
}

function addItemKey(e,catId){
  if(e.key!=='Enter')return;
  const text=e.target.value.trim();if(!text)return;
  const c=DATA.find(x=>x.id===catId);if(!c)return;
  c.items.push({n:text,s:'예정'});
  e.target.value='';save();render();
  setTimeout(()=>{const inp=document.getElementById('inp_'+catId);if(inp)inp.focus()},50);
}

function showAddCat(){
  document.getElementById('catModal').style.display='flex';
  document.getElementById('catName').focus();
}
function closeCatModal(e){if(e.target===document.getElementById('catModal'))closeCatModalDirect()}
function closeCatModalDirect(){
  document.getElementById('catModal').style.display='none';
  document.getElementById('catName').value='';
  document.getElementById('catIcon').value='';
}
function addCategory(){
  const name=document.getElementById('catName').value.trim();
  if(!name){alert('이름을 입력하세요');return}
  const icon=document.getElementById('catIcon').value.trim()||'📌';
  const color=document.getElementById('catColor').value;
  DATA.push({id:'cat_'+Date.now(),label:name,icon,color,items:[]});
  save();render();closeCatModalDirect();
}

function addQuickTask(e){
  if(e.key!=='Enter')return;
  const text=e.target.value.trim();if(!text)return;
  QUICK.unshift({id:'qt_'+Date.now(),text,done:false,createdAt:new Date().toISOString()});
  e.target.value='';save();renderQuick();
}
function toggleQuick(id){
  const q=QUICK.find(x=>x.id===id);if(!q)return;
  q.done=!q.done;save();renderQuick();
}
function deleteQuick(id){QUICK=QUICK.filter(q=>q.id!==id);save();renderQuick()}
function clearDoneQt(){
  if(!confirm('완료된 잔업 항목을 모두 비울까요?'))return;
  QUICK=QUICK.filter(q=>!q.done);save();renderQuick();
}

function exportData(){
  const payload={items:DATA,quickTasks:QUICK,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bunnar-dashboard-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function triggerImport(){document.getElementById('importFile').click()}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const p=JSON.parse(ev.target.result);
      if(Array.isArray(p)){DATA=p;QUICK=[]}
      else if(p&&Array.isArray(p.items)){DATA=p.items;QUICK=Array.isArray(p.quickTasks)?p.quickTasks:[]}
      else throw new Error();
      save();render();renderQuick();
      alert('가져오기 완료!');
    }catch(err){alert('올바른 JSON 파일이 아닙니다.')}
  };
  r.readAsText(file);e.target.value='';
}

function renderQuick(){
  const list=document.getElementById('qtList');
  const count=document.getElementById('qtCount');
  const doneInfo=document.getElementById('qtDoneInfo');
  const clearBtn=document.getElementById('qtClearDone');
  const open=QUICK.filter(q=>!q.done);
  const done=QUICK.filter(q=>q.done);
  count.textContent=`${open.length}개 남음`;
  if(QUICK.length===0){
    list.innerHTML='<div class="inbox-empty">머릿속 떠다니는 작은 일들을 빠르게 적어두세요.</div>';
    doneInfo.textContent='';clearBtn.style.display='none';return;
  }
  list.innerHTML=QUICK.map(q=>`
    <div class="qt ${q.done?'done':''}">
      <button class="qt-check ${q.done?'done':''}" onclick="toggleQuick('${q.id}')" title="완료 토글">${q.done?'✓':''}</button>
      <span class="qt-text">${escapeHtml(q.text)}</span>
      <button class="qt-del" onclick="deleteQuick('${q.id}')" title="삭제">×</button>
    </div>`).join('');
  doneInfo.textContent=done.length>0?`완료 ${done.length}개 · `:'';
  clearBtn.style.display=done.length>0?'inline':'none';
}

function renderDigest(){
  const dateEl=document.getElementById('todayDate');
  dateEl.textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const all=[];
  DATA.forEach(cat=>{
    cat.items.forEach((it,idx)=>{
      all.push({...it,catLabel:cat.label,catColor:cat.color,catId:cat.id,idx});
    });
  });
  const urgent=all.filter(i=>i.due&&!['완료','탈락'].includes(i.s)).filter(i=>daysUntil(i.due)<=3).sort((a,b)=>daysUntil(a.due)-daysUntil(b.due));
  const soon=all.filter(i=>i.due&&!['완료','탈락'].includes(i.s)).filter(i=>{const n=daysUntil(i.due);return n>3&&n<=14}).sort((a,b)=>daysUntil(a.due)-daysUntil(b.due));
  const active=all.filter(i=>!i.due&&i.s==='수행중').slice(0,6);
  document.getElementById('digUrgent').innerHTML=renderDigestList(urgent,true);
  document.getElementById('digSoon').innerHTML=renderDigestList(soon,true);
  document.getElementById('digActive').innerHTML=renderDigestList(active,false);
}
function renderDigestList(items,showDday){
  if(items.length===0)return'<div class="digest-empty">없음</div>';
  return items.slice(0,6).map(i=>{
    const dd=showDday?ddayLabel(i.due):null;
    return`<div class="digest-item">${dd?`<span class="dd ${dd.cls}">${dd.text}</span>`:''}<span><span style="color:${i.catColor};font-size:10px">●</span> ${escapeHtml(i.n)}</span></div>`;
  }).join('');
}

function render(){
  renderDigest();
  const s=calcStats();
  document.getElementById('sg').innerHTML=`
    <div class="stat"><div class="stat-num">${s.total}</div><div class="stat-label">전체</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--green)">${s.done}</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--blue)">${s.active}</div><div class="stat-label">진행중</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--text2)">${s.plan}</div><div class="stat-label">예정</div></div>
    <div class="stat"><div class="stat-num" style="color:${s.pct>=50?'var(--green)':'var(--red)'}">${s.pct}%</div><div class="stat-label">완료율</div></div>`;
  document.getElementById('catCount').textContent=`${DATA.length}개 카테고리`;
  const grid=document.getElementById('mg');
  grid.innerHTML='';
  DATA.forEach(cat=>{
    const done=cat.items.filter(i=>i.s==='완료').length;
    const pct=cat.items.length?Math.round(done/cat.items.length*100):0;
    const vis=activeFilter==='all'?cat.items:cat.items.filter(i=>i.s===activeFilter);
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-head">
        <span class="card-icon">${cat.icon}</span>
        <span class="card-label">${escapeHtml(cat.label)}</span>
        <span class="card-meta">${done}/${cat.items.length} · ${pct}%</span>
        <button onclick="deleteCat('${cat.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0 0 0 8px;line-height:1" title="카테고리 삭제">×</button>
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:${cat.color}"></div></div>`;
    const itemsDiv=document.createElement('div');
    itemsDiv.className='items';
    vis.forEach(item=>{
      const realIdx=cat.items.indexOf(item);
      const key=cat.id+'::'+realIdx;
      const isOpen=openItemKey===key;
      const dd=item.due?ddayLabel(item.due):null;
      const row=document.createElement('div');
      row.className='irow'+(isOpen?' open':'');
      row.innerHTML=`
        <div class="irow-main" onclick="toggleItem('${cat.id}',${realIdx})">
          <span class="toggle-ind">▶</span>
          <span class="iname">${escapeHtml(item.n)}${item.tag?`<span class="itag">${escapeHtml(item.tag)}</span>`:''}${dd?`<span class="dday ${dd.cls}">${dd.text}</span>`:''}</span>
          <button class="badge" style="${BADGE_STYLE[item.s]}" onclick="event.stopPropagation();cycleStatus('${cat.id}',${realIdx})" title="클릭하여 상태 변경">${item.s}</button>
          <button class="del-btn" onclick="event.stopPropagation();deleteItem('${cat.id}',${realIdx})" title="삭제">×</button>
        </div>
        <div class="iexp">
          <div class="iexp-row">
            <label>마감일</label>
            <input type="date" value="${item.due||''}" onchange="updateDue('${cat.id}',${realIdx},this.value)">
            ${item.due?`<button class="mini-btn" onclick="updateDue('${cat.id}',${realIdx},'')">지우기</button>`:''}
          </div>
          <div class="iexp-row" style="align-items:flex-start">
            <label style="margin-top:6px">메모</label>
            <textarea placeholder="결정사항·진행상황·참고 링크 등" oninput="updateNotes('${cat.id}',${realIdx},this.value)" onblur="commitNotes('${cat.id}',${realIdx})">${item.notes?escapeHtml(item.notes):''}</textarea>
          </div>
          <div class="iexp-actions">
            <a class="mini-btn" href="${calendarLink(item,cat.label)}" target="_blank" rel="noopener">📅 캘린더에 추가</a>
          </div>
        </div>`;
      itemsDiv.appendChild(row);
    });
    card.appendChild(itemsDiv);
    const addRow=document.createElement('div');
    addRow.className='add-row';
    addRow.innerHTML=`<input class="add-input" id="inp_${cat.id}" placeholder="+ 새 항목 추가 후 Enter" onkeydown="addItemKey(event,'${cat.id}')">`;
    card.appendChild(addRow);
    grid.appendChild(card);
  });
  const addBtn=document.createElement('button');
  addBtn.className='add-cat-btn';
  addBtn.innerHTML='＋ 새 카테고리 추가';
  addBtn.onclick=showAddCat;
  grid.appendChild(addBtn);
}

document.getElementById('fr').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');activeFilter=b.dataset.f;render();
});

auth.onAuthStateChanged(async user=>{
  const loginBtn=document.getElementById('loginBtn');
  const logoutBtn=document.getElementById('logoutBtn');
  const authStatus=document.getElementById('authStatus');
  const addCatHeaderBtn=document.getElementById('addCatHeaderBtn');
  const digest=document.getElementById('digest');
  const inboxBox=document.getElementById('inboxBox');
  const projectsSection=document.getElementById('projectsSection');
  const loggedOut=document.getElementById('loggedOut');

  if(unsubscribeDashboard){unsubscribeDashboard();unsubscribeDashboard=null}

  if(!user){
    loginBtn.style.display='inline-block';
    logoutBtn.style.display='none';
    authStatus.style.display='none';
    addCatHeaderBtn.style.display='none';
    digest.style.display='none';
    inboxBox.style.display='none';
    projectsSection.style.display='none';
    loggedOut.style.display='block';
    return;
  }

  loginBtn.style.display='none';
  logoutBtn.style.display='inline-block';
  authStatus.textContent=user.email||'로그인됨';
  authStatus.style.display='inline-block';
  addCatHeaderBtn.style.display='inline-block';
  digest.style.display='block';
  inboxBox.style.display='block';
  projectsSection.style.display='block';
  loggedOut.style.display='none';

  const loaded=await loadData();
  DATA=loaded.items||[];
  QUICK=loaded.quickTasks||[];
  render();renderQuick();

  unsubscribeDashboard=DASHBOARD_DOC.onSnapshot(snap=>{
    if(suppressSnapshot){suppressSnapshot=false;return}
    if(!snap.exists)return;
    const d=snap.data();
    if(Array.isArray(d.items))DATA=d.items;
    if(Array.isArray(d.quickTasks))QUICK=d.quickTasks;
    setLocalBackup();render();renderQuick();
  },err=>{console.error(err)});
});
</script>
</body>
</html>
